/* ==================================================================
   V4 — GURUR ESIGI
   ------------------------------------------------------------------
   TICARI_PLAN 2 numarali is. Ilke: IQ dusukse asla one cikarma.
   Bunun yerine oyuncunun EN GUCLU alt zekasini ilan et.
   Herkes bir dalda ustadir -> herkes paylasabilir -> yayilma.
   Yuzdelik dilim, popülasyon dagilimindan (POP_MEAN/POP_SD) turetiliyor;
   uydurma degil, olcumun kendisinden geliyor.
   ================================================================== */
function erf(x){                       // Abramowitz-Stegun 7.1.26
  const s=x<0?-1:1; x=Math.abs(x);
  const t=1/(1+0.3275911*x);
  const poly=((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t;
  return s*(1-poly*Math.exp(-x*x));
}
const normCdf=z=>0.5*(1+erf(z/Math.SQRT2));

/* Oyuncunun en guclu dali + o dalda ustunlugu */
function proudest(p){
  const best=MIND_DIMS.map(d=>({d, v:p.chi[d.k]||0}))
    .sort((a,b)=>b.v-a.v)[0];
  const z=(best.v-POP_MEAN)/POP_SD;
  const pct=Math.max(1, Math.round((1-normCdf(z))*100));   // ust %N
  return {dim:best.d, val:Math.round(best.v), topPct:pct};
}
/* Sonuc ekraninda IQ yerine/yaninda gosterilecek gurur satiri */
function prideLine(p){
  const pr=proudest(p);
  /* GURUR ESIGI KURALI: yuzde ancak OVUNULECEKSE gosterilir.
     "ust %91'desin" demek gururun tam tersi - o yuzden %50 ustu
     dilimlerde sayi yerine tesvik metni cikar. Kimse utanmaz. */
  const sub = pr.topPct<=50
      ? t("prideSub").replace("{n}", pr.topPct)
      : t("prideSubGrow").replace("{d}", t(pr.dim.tk));
  return {icon:pr.dim.ico, col:pr.dim.col2,
          title:t("prideTitle").replace("{d}", t(pr.dim.tk)), sub, pr};
}

/* ==================================================================
   AILE KARNESI (V2) — yayilma motoru
   ------------------------------------------------------------------
   TICARI_PLAN.md'de 1 numarali is. Gerekce: Turkiye'de bir icerik
   Instagram'dan degil AILE GRUBUNDAN yayilir. Haftalik karne kartI
   WhatsApp'a atilir, atildigi her yerde bir indirme dogurur.
   Maliyeti sifir (canvas), yayilmasi en yuksek.

   Kart mantigi: her alt zekada evin BIRINCISI kim? Boylece herkes bir
   dalda birinci cikar (V4 "gurur esigi" ilkesi) - kimse utanmaz,
   herkes paylasir.
   ================================================================== */
function weekKey(d){
  const t=d?new Date(d):new Date();
  const y=t.getFullYear();
  const jan1=new Date(y,0,1);
  const wk=Math.ceil(((t-jan1)/864e5 + jan1.getDay()+1)/7);
  return y+"-W"+String(wk).padStart(2,"0");
}
/* Bu hafta oynayan profiller */
function activeThisWeek(){
  const now=Date.now();
  return DB.profiles.filter(p=>p.sessions>0 && (now-(p.lastPlay||0))<8*864e5);
}
/* Her alt zekada birinci + genel sampiyon */
function familyReport(){
  const ps=activeThisWeek();
  if(ps.length<1) return null;
  const cats=MIND_DIMS.map(d=>{
    const win=ps.slice().sort((a,b)=>(b.chi[d.k]||0)-(a.chi[d.k]||0))[0];
    return {dim:d, who:win, val:Math.round(win.chi[d.k]||0)};
  });
  const champ=ps.slice().sort((a,b)=>(b.level-a.level)||(chiTotal(b.chi)-chiTotal(a.chi)))[0];
  const mostImproved=ps.slice().sort((a,b)=>(b.sessions||0)-(a.sessions||0))[0];
  const totalSessions=ps.reduce((a,p)=>a+(p.sessions||0),0);
  return {ps,cats,champ,mostImproved,totalSessions};
}

function drawReport(canvas){
  const r=familyReport(); if(!r) return false;
  const ctx=canvas.getContext("2d");
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);

  /* zemin */
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#241a4d"); bg.addColorStop(.55,"#1a1338"); bg.addColorStop(1,"#120d28");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  const rnd=seededRand(1234);
  for(let i=0;i<120;i++){
    ctx.globalAlpha=.10+rnd()*.4; ctx.fillStyle=rnd()>.85?"#ffd9a0":"#dbe4ff";
    ctx.beginPath(); ctx.arc(rnd()*W,rnd()*H,rnd()*1.4+.3,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.strokeStyle="rgba(255,207,92,.45)"; ctx.lineWidth=3;
  ctx.strokeRect(14,14,W-28,H-28);

  ctx.textAlign="center";
  ctx.fillStyle="#ffcf5c"; ctx.font="700 21px system-ui,sans-serif";
  ctx.fillText(t("frTitle"), W/2, 62);
  ctx.fillStyle="rgba(255,255,255,.55)"; ctx.font="500 14px system-ui,sans-serif";
  ctx.fillText(weekKey()+" · "+r.ps.length+" "+t("frPlayers"), W/2, 86);

  /* dort dal birincisi */
  let y=132;
  r.cats.forEach(c=>{
    ctx.fillStyle="rgba(255,255,255,.055)";
    ctx.beginPath(); ctx.roundRect(34,y-26,W-68,54,14); ctx.fill();
    ctx.strokeStyle=c.dim.col+"66"; ctx.lineWidth=1.5; ctx.stroke();
    ctx.textAlign="left";
    ctx.font="24px system-ui,sans-serif"; ctx.fillText(c.dim.ico,52,y+8);
    ctx.fillStyle="rgba(255,255,255,.62)"; ctx.font="600 13px system-ui,sans-serif";
    ctx.fillText(t(c.dim.tk).toUpperCase(),90,y-4);
    ctx.fillStyle="#fff"; ctx.font="700 19px system-ui,sans-serif";
    ctx.fillText((c.who.avatar||"")+" "+c.who.name,90,y+18);
    ctx.textAlign="right";
    ctx.fillStyle=c.dim.col2; ctx.font="700 20px system-ui,sans-serif";
    ctx.fillText(c.val, W-52, y+10);
    y+=66;
  });

  /* sampiyon serisi */
  y+=6;
  const g=ctx.createLinearGradient(34,y-28,W-34,y+28);
  g.addColorStop(0,"rgba(255,207,92,.22)"); g.addColorStop(1,"rgba(120,80,200,.22)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(34,y-28,W-68,58,14); ctx.fill();
  ctx.strokeStyle="rgba(255,207,92,.6)"; ctx.lineWidth=2; ctx.stroke();
  ctx.textAlign="left"; ctx.font="26px system-ui,sans-serif"; ctx.fillText("👑",52,y+9);
  ctx.fillStyle="rgba(255,255,255,.62)"; ctx.font="600 13px system-ui,sans-serif";
  ctx.fillText(t("frChamp").toUpperCase(),92,y-5);
  ctx.fillStyle="#ffe9a8"; ctx.font="700 20px system-ui,sans-serif";
  ctx.fillText((r.champ.avatar||"")+" "+r.champ.name+" · "+t("lvl")+" "+r.champ.level,92,y+19);

  /* alt bilgi */
  ctx.textAlign="center";
  ctx.fillStyle="rgba(255,255,255,.45)"; ctx.font="500 13px system-ui,sans-serif";
  ctx.fillText(t("frTotal").replace("{n}",r.totalSessions), W/2, H-52);
  ctx.fillStyle="rgba(255,207,92,.85)"; ctx.font="700 15px system-ui,sans-serif";
  ctx.fillText("STONEBREAKING", W/2, H-26);
  return true;
}

/* ==================================================================
   TAC / SIRALAMA / BEGENI / PROFIL DUZENLEME
   ------------------------------------------------------------------
   Kullanici istegi: "ana ekranda en son seviyeye ulasan kisinin ismi,
   yaninda tac seklinde Taskiran simgesi, top 10 siralama".

  return DB.profiles.slice().sort((a,b)=>
    (b.level-a.level) || (chiTotal(b.chi)-chiTotal(a.chi)) || ((b.likes||0)-(a.likes||0))
  );
}
function championId(){ const l=leaderboard(); return l.length?l[0].id:null; }
function crownFor(p){ return p.id===championId() ? ' <span title="STONEBREAKING">👑</span>' : ''; }

/* BT TASI — enerji birimimizin gorsel karsiligi.
   Oyundaki kumtasi levhanin minyaturu, uzerinde kazinmis "BT".
   full=false ise sonuk/bos taş (harcanmis enerji). */
function btStone(full,size){
  const S=size||22;
  return `<img class="btIcon${full?"":" off"}" src="assets/bt_stone${full?"":"_off"}.webp"
    style="width:${S}px" alt="BT" draggable="false">`;

function btRow(n,max,size){
  let o=""; for(let i=0;i<max;i++) o+=btStone(i<n,size);

function toast(msg){
  let el=document.getElementById("toast");
  if(!el){ el=document.createElement("div"); el.id="toast"; document.getElementById("app").appendChild(el); }
  el.textContent=msg; el.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),1900);
}

function renderProfiles(){
  const box=document.getElementById("profList"); box.innerHTML="";
  DB.profiles.forEach(p=>{
    const md=MODES[p.mode]||MODES.family;
    const d=document.createElement("div");
    d.className="prof"+(p.id===DB.active?" act":"");
    const chi=Math.round(chiTotal(p.chi));
    const likes=p.likes||0, liked=(S.given||[]).includes(p.id), mine=p.id===S.id;
    d.innerHTML=`<img class="pav" src="${heroOf(p)}" alt="">
      <div class="info">
        <div class="nm">${p.avatar||""} ${p.name}${crownFor(p)}</div>
        <div class="st">${t("lvl")} ${p.level} · ⚡${chi} · ${p.sessions} ${t("sessions")}</div>
        <div class="md">${md.icon} ${md[L]}</div>
        <div class="likeRow">
          <span class="likeBtn ${liked?"on":""}" data-like="${p.id}"
            title="${mine?t("likeSelf"):t("likeTip")}">${liked?"❤️":"🤍"} ${likes}</span>
        </div>
      </div>
      <div class="edit" data-edit="${p.id}">✏️</div>
      <div class="del" data-del="${p.id}">🗑</div>`;
    d.onclick=(ev)=>{
      // Begeni: aile icinde birbirini alkislama. Ayni profile bir kez.
      if(ev.target.dataset.like){
        const id=ev.target.dataset.like;
        if(id===S.id){ toast(t("likeSelf")); return; }
        S.given=S.given||[];
        const tgt=DB.profiles.find(x=>x.id===id); if(!tgt) return;
        const i=S.given.indexOf(id);
        if(i>=0){ S.given.splice(i,1); tgt.likes=Math.max(0,(tgt.likes||0)-1); }
        else { S.given.push(id); tgt.likes=(tgt.likes||0)+1; SFX.pick&&SFX.pick(); }
        save(); saveDB(); renderProfiles();
        return;
      }
      if(ev.target.dataset.edit){
        editProfile(ev.target.dataset.edit);
        return;
      }
      if(ev.target.dataset.del){
        if(confirm(t("profDel")+"\n\n"+p.name)){
          DB.profiles=DB.profiles.filter(x=>x.id!==p.id);
          if(DB.active===p.id) DB.active=DB.profiles[0]?DB.profiles[0].id:null;
          if(DB.profiles.length===0){ saveDB(); show("s-newprof"); prepNew(); return; }
          if(S.id===p.id) loadProfile(DB.active);
          saveDB(); renderProfiles(); paintProfBtn(); refreshSplash();

      loadProfile(p.id); paintProfBtn(); refreshSplash();
      show("s-splash");

  });

    familyBonusActive() ? "👨‍👩‍👧 "+t("famBonus") : t("famNote");
}

/* ==================================================================
   HIKAYE MOTORU
   playAct(act, onDone) — perdeyi panel panel oynatir, bitince onDone.
   Atlanabilir; atlanan perde "gorulmus" sayilmaz, gunlukten tekrar acilir.
   ================================================================== */
let ST={act:null, i:0, done:null, queue:null};
function seenActs(){ S.acts=S.acts||[]; return S.acts; }
function markAct(id){ const a=seenActs(); if(!a.includes(id)){ a.push(id); save(); } }

function playAct(act, onDone){
  if(!act){ onDone&&onDone(); return; }
  ST={act, i:0, done:onDone, queue:null};
  show("s-story");
  paintPanel();
  actIntro(act);
  if(act.act===0) coldOpen();            // oyunun ilk saniyeleri
  const mood=moodForAct(act.act);
  musicStart(mood);                      // perdenin ruh haline gore muzik
  /* Acilis perdesi bir MACERA GIRISI: davul girer, tek vurusla acilir.
     Diger perdelerde davul yok - orada anlati one cikar. */
  if(act.act===0){ heroSting(); setTimeout(()=>drumStart(),900); }
  else drumStop();
  const key=Object.keys(MOODS).find(k=>MOODS[k]===mood)||"calm";
  dustStart(key);                        // ve ayni ruh halinde yildiz tozu
}
/* Acilis perdesinin ILK panelinde ozel giris: ekran karanliktan acilir,
   cekirdek bir kez guclu atar. Oyunun ilk 3 saniyesi burasi - donuk bir
   resim yerine "bir sey basliyor" hissi vermeli. */
function coldOpen(){
  const sec=document.getElementById("s-story");
  if(!sec) return;
  sec.classList.remove("coldOpen"); void sec.offsetWidth;
  sec.classList.add("coldOpen");
  setTimeout(()=>sec.classList.remove("coldOpen"),2600);
}

/* ==================================================================
   ACILIS SINEMATIGI — Perde I'in uc paneli birer OLAY olarak sahnelenir
   ------------------------------------------------------------------
   Kullanici: "Baslangictaki hikayeye giris daha canli bisey olmali".
   Onceki halinde ekran karariyor, cekirdek atiyor, toz suzuluyordu ama
   sahnede HICBIR SEY OLMUYORDU. Simdi metin ne anlatiyorsa ekranda o
   oluyor: cember kuruluyor, cekirdek catliyor, kolye cagiriyor.
   Tasarim kurali: tek bir yeni gorsel dosyasi eklemedik (yukleme
   butcesi E4 zaten sinirda) — var olan madalyonlar + CSS + SVG.
   ================================================================== */
/* Ruhlarin GORSELDEKI yerleri (yuzde). Uzerlerine kendi renklerinde isik
   acilir - boylece "ruhlar uyaniyor" hissi resmin kendisinden dogar.
   Konumlar ch1_denge.webp / ch2_kirilma.webp uzerinden olculdu. */
const FX_SPIRITS={
  denge:[   // Perde I panel 1: su sol-ust, ates sag-ust, toprak sol-alt, hava sag-alt
    /* Renkler element anayasasina uyduruldu: mavi su, kirmizi ates,
       yesil toprak, BEYAZ hava. Konumlar focus:47% cercevesine gore. */
    {x:"21%", y:"33%", c:"rgba(47,155,255,.80)",  bx:"-40%", by:"-40%"},
    {x:"75%", y:"29%", c:"rgba(255,77,46,.80)",   bx:"40%",  by:"-40%"},
    {x:"26%", y:"70%", c:"rgba(53,193,94,.78)",   bx:"-40%", by:"40%"},
    {x:"72%", y:"71%", c:"rgba(255,255,255,.72)", bx:"40%",  by:"40%"}
  ],
  kirilma:[ // Perde I panel 2: ates sol-ust, su sag-ust, toprak sol-alt, hava sag-alt
    {x:"24%", y:"16%", c:"rgba(255,77,46,.80)",   bx:"-45%", by:"-45%"},
    {x:"78%", y:"16%", c:"rgba(47,155,255,.80)",  bx:"45%",  by:"-45%"},
    {x:"22%", y:"80%", c:"rgba(53,193,94,.78)",   bx:"-45%", by:"45%"},
    {x:"80%", y:"81%", c:"rgba(255,255,255,.72)", bx:"45%",  by:"45%"}
  ]
};
let FXT=[];                                   // calan zamanlayicilar
function fxClear(){
  FXT.forEach(clearTimeout); FXT=[];
  const sec=document.getElementById("s-story");
  if(sec) sec.classList.remove("fxCrack");
  ["stOrbit","stRing","stCrack","stFlash","stAmulet"].forEach(id=>{
    const e=document.getElementById(id);
    if(e){ e.classList.remove("on","go","blow");
           if(id==="stOrbit"||id==="stCrack") e.innerHTML=""; }
  });
}
function fxLater(fn,ms){ FXT.push(setTimeout(fn,ms)); }
function fxReduced(){
  try{ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; }
}
/* Cekirdegin ekrandaki yerini panelden al (yoksa merkez) */
function fxAnchor(p){
  const c=(p&&(p.fxAt||p.core))||{x:"50%",y:"50%"};
  return {x:c.x||"50%", y:c.y||"50%"};
}

/* Ruh isiklarini sahneye kur (hangi gorsel gosteriliyorsa ona gore) */
function fxSpirits(setKey,delay0){
  const o=document.getElementById("stOrbit");
  const set=FX_SPIRITS[setKey]; if(!o||!set) return;
  o.innerHTML=set.map((s,i)=>
    `<div class="orb" style="--x:${s.x};--y:${s.y};--oc:${s.c};
      --bx:${s.bx};--by:${s.by};--od:${(delay0+i*0.45).toFixed(2)}s"></div>`).join("");
}

/* 1) CEMBER KURULUYOR — dort ruh sirayla uyaniyor, sonra halka kapaniyor */
function fxCircle(p){
  const r=document.getElementById("stRing");
  const a=fxAnchor(p);
  if(r){ r.style.left=a.x; r.style.top=a.y; }
  fxSpirits("denge", 0.2);
  if(fxReduced()) return;
  // her ruh uyandikca tek bir temiz nota — cember kulakla da kuruluyor
  for(let i=0;i<4;i++) fxLater(()=>{ try{ SFX.pick(); }catch(e){} }, 300+i*450);
  if(r) fxLater(()=>{ r.classList.remove("go"); void r.offsetWidth; r.classList.add("go"); },1750);
}

/* 2) CEKIRDEK CATLIYOR — sarsinti, kirik isik, savrulan ruhlar */
function fxShatter(p){
  const sec=document.getElementById("s-story");
  const cr=document.getElementById("stCrack"), fl=document.getElementById("stFlash");
  const o=document.getElementById("stOrbit");
  const a=fxAnchor(p);
  fxSpirits("kirilma", 0);      // dort ruh bu gorselde de yaniyor...
  /* Cekirdek logosu bu panelde YOK: gorselin kendisi zaten patlama.
     Normal 1sn'lik solma patlamanin ustunde hayalet birakiyordu -> aninda kes. */
  const core=document.getElementById("stCore"), halo=document.getElementById("stCoreGlow");
  [core,halo].forEach(e=>{ if(!e) return;
    e.style.transition="opacity .12s linear"; e.style.opacity="0";
    fxLater(()=>{ e.style.transition=""; e.style.opacity=""; },400); });
  if(cr){
    const cx=parseFloat(a.x)||50, cy=parseFloat(a.y)||50;
    // yedi kirik hat: merkezden disari, her biri iki kirilma noktali
    let d="";
    for(let i=0;i<7;i++){
      const ang=(i/7)*6.2832 + 0.5;
      const p1=[cx+Math.cos(ang)*9,  cy+Math.sin(ang)*9];
      const p2=[cx+Math.cos(ang+0.22)*26, cy+Math.sin(ang+0.22)*26];
      const p3=[cx+Math.cos(ang-0.18)*52, cy+Math.sin(ang-0.18)*52];
      d+=`<path d="M${cx} ${cy} L${p1[0].toFixed(1)} ${p1[1].toFixed(1)}
           L${p2[0].toFixed(1)} ${p2[1].toFixed(1)} L${p3[0].toFixed(1)} ${p3[1].toFixed(1)}"
           style="--cd:${(i*0.055).toFixed(2)}s"></path>`;
    }
    cr.innerHTML=d;
  }
  if(fxReduced()) return;
  fxLater(()=>{
    if(sec){ sec.classList.remove("fxCrack"); void sec.offsetWidth; sec.classList.add("fxCrack"); }
    if(fl){ fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go"); }
    if(cr){ cr.classList.remove("go"); void cr.offsetWidth; cr.classList.add("go"); }
    try{ SFX.shatter(); }catch(e){}
    buzz&&buzz([30,50,80]);
  },620);
  fxLater(()=>{ if(o) o.classList.add("blow"); },900);          // dort uca savrulus
  fxLater(()=>{ if(sec) sec.classList.remove("fxCrack"); },2600);
}

/* 3) KOLYE PARLIYOR — cagri artik kahramanda */
function fxAmulet(){
  const el=document.getElementById("stAmulet");
  if(!el || fxReduced()) return;
  /* Kahramanin gogsundeki kolye: konum ch3_cagri.webp uzerinden olculdu */
  el.style.left="50%"; el.style.top="52%";
  el.classList.remove("go"); void el.offsetWidth; el.classList.add("go");
  fxLater(()=>{ try{ SFX.match(2); }catch(e){} },700);
}

/* Panel numarasina gore dogru olayi sahnele */
function fxForPanel(actId,i,p){
  fxClear();
  if(actId!==0) return;
  // Panel 1'de siyah perde ~2,4sn; ruhlar perde kalkarken uyansin ki
  // oyuncu uyanislarini gorsun (karanlikta olup bitmesin).
  if(i===0)      fxLater(()=>fxCircle(p), 1500);
  else if(i===1) fxShatter(p);
  else if(i===2) fxAmulet();
}

/* Metni satir satir akit: <br><br> ile ayrilmis bloklar sirayla girer.
   "Duvar gibi paragraf" yerine nefes alan bir anlatim. */
function stagger(html,off){
  const parts=String(html).split(/<br>\s*<br>/i).filter(s=>s.trim());
  if(parts.length<2) return html;
  const d0=0.26+(off||0);
  return parts.map((s,i)=>`<span class="ln" style="--ld:${(d0+i*0.6).toFixed(2)}s">${s}</span>`).join("");
}

/* Perde girisi: altin dalga + "YENI PERDE" rozeti. Her perde bir olay. */
function actIntro(act){
  const b=document.getElementById("stBurst"), g=document.getElementById("stBadge");
  if(b){ b.classList.remove("go"); void b.offsetWidth; b.classList.add("go"); }
  if(g){
    const d=(act.panels[0][L]||act.panels[0].tr);
    g.textContent=(d.c||"").split("·")[0].trim() || t("stActNew");
    g.classList.remove("go"); void g.offsetWidth; g.classList.add("go");
  }
  try{ SFX.win&&SFX.win(); }catch(e){}
}
/* ==================================================================
   SENARYO ↔ ARAYUZ BAGI — Golge'nin sorusu oyuncunun VERISIYLE yanitlanir
   ------------------------------------------------------------------
   SORUN: Perde VII'de Golge soruyor: "Ben senin en guclu yaninim,
   diger ucune ne gerek var?" — ama oyuncu cevap veremiyordu. Perde
   VIII'de "dordunu ayni anda kullandin" deniyordu, oysa oyuncu
   boyle bir sey YAPMAMISTI. Hikayenin tezi arayuzde karsiliksizdi.

   COZUM: Perde VII'den sonra oyuncunun KENDI dort dalini gosteren
   bir kart cikar. Golge'nin iddiasi oyuncunun gercek verisiyle
   sinanir: en guclu dal one cikar, digerleri yaninda durur.
   Boylece Perde VIII'deki "dordunu birlikte kullandin" cumlesi
   oyuncunun kendi tablosuna dayanan bir GERCEK olur.
   ================================================================== */
function shadowMirror(onDone){
  const dims=MIND_DIMS.map(d=>({d, v:S.chi[d.k]||CHI_START}));
  const en=[...dims].sort((a,b)=>b.v-a.v)[0];
  const zayif=[...dims].sort((a,b)=>a.v-b.v)[0];
  const tot=Math.round(chiTotal(S.chi));
  const denge=Math.round(100 - (en.v-zayif.v)/CHI_MAX*100);   // 100 = tam denge
  const rows=dims.map(x=>{
    const pct=clamp((x.v-CHI_MIN)/(CHI_MAX-CHI_MIN)*100,4,100);
    const gucu = x===en;
    return `<div class="smRow${gucu?" top":""}">
      <div class="smHead"><span>${x.d.ico} ${t(x.d.tk)}</span>
        <b>${Math.round(x.v)}</b></div>
      <div class="smBar"><i style="width:${pct}%;background:linear-gradient(90deg,${x.d.col},${x.d.col2})"></i></div>
    </div>`;
  }).join("");
  const el=document.getElementById("wisdom");
  el.innerHTML=`<div class="wCard shadowCard" style="--wc:#b3261a">
      <div class="wGlow"></div>
      <div class="smTag">${t("smTag")}</div>
      <div class="smQ">"${t("smShadow")}"</div>
      <div class="smBars">${rows}</div>
      <div class="smAnswer">${t("smAnswer")
        .replace("{d}", t(en.d.tk)).replace("{n}", denge)}</div>
      <button class="btn wide" id="smGo">${t("smBtn")}</button>
    </div>`;
  el.classList.add("on");
  try{ SFX.shatter && SFX.shatter(); }catch(e){}
  document.getElementById("smGo").onclick=()=>{
    el.classList.remove("on"); onDone && onDone();
  };
}

/* Tum efsaneyi bastan sona kesintisiz oynat (Gunluk > "Bastan Sona İzle") */
function playAll(from){
  const list=STORY.slice(from||0);
  if(!list.length){ show("s-legend"); renderDiary(); return; }
  const step=k=>{
    if(k>=list.length){ show("s-legend"); renderDiary(); return; }
    ST={act:list[k], i:0, done:()=>step(k+1), queue:{k:k+1,n:list.length}};
    show("s-story"); paintPanel(); actIntro(list[k]);
    const md=moodForAct(list[k].act);
    musicStart(md);
    dustStart(Object.keys(MOODS).find(x=>MOODS[x]===md)||"calm");
  };
  step(0);
}
function paintPanel(){
  if(!ST.act) return;
  const p=ST.act.panels[ST.i]; if(!p) return;
  const d=p[L]||p.tr;
  const img=document.getElementById("stImg");
  // Kahramanli panellerde oyuncunun sectigi cinsiyetin Taskiran'i gosterilir
  const src = (p.hero && S.sex==="female") ? p.img.replace(".webp","_f.webp") : p.img;
  // ayni gorsel arka arkaya geliyorsa yeniden yukleme/zipla yok
  if(img.getAttribute("src")!==src){
    img.classList.remove("in");
    img.onload=()=>img.classList.add("in");
    img.src=src;
    img.style.animation="none"; void img.offsetWidth; img.style.animation="";
  } else img.classList.add("in");
  /* PERDE KAHRAMANI: panelde heroAt varsa oyuncunun avatari sahneye girer.
     Logo yerine oyuncu: hikaye onun hikayesi. Kolye + BT tasi da uzerinde. */
  const shw=document.getElementById("stHeroWrap"), sh=document.getElementById("stHero");
  if(shw && sh){
    if(p.heroAt){
      sh.src=heroOf(S);
      const sec2=document.getElementById("s-story");
      sec2.style.setProperty("--shX", p.heroAt.x||"50%");
      sec2.style.setProperty("--shB", p.heroAt.b||"6%");
      sec2.style.setProperty("--shH", p.heroAt.h||"44%");
      shw.classList.add("on");
      shw.style.animation="none"; void shw.offsetWidth; shw.style.animation="";
      paintHeroGear(shw, S.level);
    } else shw.classList.remove("on");
  }
  // Cekirdek logosu: yalnizca isaretli panellerde (dort ruhun ortasindaki kure)
  const core=document.getElementById("stCore"), halo=document.getElementById("stCoreGlow");
  if(core){
    if(p.core){
      core.style.left=p.core.x; core.style.top=p.core.y; core.style.width=p.core.w||"46%";
      core.classList.remove("on"); void core.offsetWidth; core.classList.add("on");
      if(halo){ halo.style.left=p.core.x; halo.style.top=p.core.y;
                halo.style.width=p.core.glow||"96%";
                halo.classList.remove("on"); void halo.offsetWidth; halo.classList.add("on"); }
    } else { core.classList.remove("on"); if(halo) halo.classList.remove("on"); }
  }

  const set=(id,html)=>{ const e=document.getElementById(id);
    e.innerHTML=html; e.classList.remove("stFade"); void e.offsetWidth; e.classList.add("stFade"); };
  set("stChapter", d.c);
  set("stTitle",   d.t);
  /* Metin uzunluguna gore punto: HTML etiketleri sayilmaz */
  const dz=String(d.x).replace(/<[^>]+>/g,"").length;
  const te=document.getElementById("stText");
  te.classList.remove("long","xlong");
  if(dz>380) te.classList.add("xlong"); else if(dz>250) te.classList.add("long");
  /* Perde I panel 1'de soguk acilisin siyah perdesi ~2,4sn suruyor.
     Metin de efektler de perde kalkarken girmeli; yoksa oyuncu ilk
     satirlari karanlikta kaciriyor. */
  const coldOff = (ST.act.act===0 && ST.i===0) ? 1.6 : 0;
  set("stText",    ST.act.act===0 ? stagger(d.x, coldOff) : d.x);

  // Acilis perdesinde panel neyi anlatiyorsa ekranda o olur
  fxForPanel(ST.act.act, ST.i, p);

  /* Metin blogu icerige gore olculur: kisa metin -> gorsel buyuk kalir,
     uzun metin -> alan buyur ama gorsel asla yazinin altinda kalmaz. */
  const sec=document.getElementById("s-story");
  sec.style.setProperty("--focus", p.focus || "center 40%");
  requestAnimationFrame(()=>{
    const body=document.getElementById("stBody");
    // Onceki panelin degeri olcumu kirletmesin: once serbest birak, sonra olc.
    const prev=body.style.height;
    body.style.height="auto";
    const need=body.scrollHeight+12;
    body.style.height=prev;
    const H=sec.clientHeight||1;
    /* METIN BLOGU PAYI — olcumle belirlendi (test/perdeler.js)
       13 panel tarandi: blok %41-46 arasi yer kapliyordu ve iki panelde
       metin YINE tasiyordu. Yani hem gorsel yeniyor hem metin sigmiyor.

       Cozum iki tarafli:
         1) Tavan 46 -> 50: uzun metin icin biraz daha alan
         2) Punto icerige gore kuculuyor (asagida): 4 satirdan uzun
            metinlerde yazi 17.5px -> 16px -> 15px iner
       Boylece hem tasma biter hem gorsel korunur. */
    const pct=Math.min(50,Math.max(26,Math.round(need/H*100)));
    sec.style.setProperty("--sh", pct+"%");
  });

  const totalPanels = ST.act.panels.length;
  const dotsLegacy=ST.act.panels.map((_,k)=>`<i class="${k===ST.i?"on":""}"></i>`).join("");
  const dotsEl=document.getElementById("stDots");
  if(dotsEl) dotsEl.innerHTML=totalPanels>1?dotsLegacy:"";
  const progEl=document.getElementById("stComicProg");
  const pageEl=document.getElementById("stComicPage");
  if(progEl){
    progEl.innerHTML = ST.act.panels.map((_,k)=>`<div class="comicDot ${k===ST.i?"on":""}"></div>`).join("");
  }
  if(pageEl){
    const actNum = (ST.act.act+1).toString().padStart(2,"0");
    pageEl.textContent = `${actNum} · ${ST.i+1} / ${totalPanels}`;
  }


  const last = ST.i>=ST.act.panels.length-1;
  const q=ST.queue;
  document.getElementById("stNext").textContent =
    last ? (q ? (q.k<q.n ? t("stNextAct") : t("stDone")) : t(p.how?"stBegin":"stGo"))
         : t("stNext");
  const sk=document.getElementById("stSkip");
  // zincir modunda cikis her zaman acik olmali
  sk.textContent = q ? t("stExit") : t("stSkip");
  sk.style.display = (q || !last) ? "block" : "none";
  // zincirde kacinci perdedeyiz
  const ch=document.getElementById("stChapter");
  if(q) ch.innerHTML = d.c + ` <span style="opacity:.55">· ${q.k}/${q.n}</span>`;
}
function storyNext(){
  if(!ST.act) return;                       // cift tik / gec gelen olay
  if(ST.i < ST.act.panels.length-1){ ST.i++; paintPanel(); return; }
  storyFinish(true);
}
function storyFinish(completed){
  if(!ST.act) return;                       // zaten kapanmis
  const act=ST.act, done=ST.done, q=ST.queue;
  if(completed) markAct(act.act);
  /* PERDE VII (Golge) bitince: oyuncunun kendi dort dali gosterilir.
     Golge'nin sorusu boylece veriyle yanitlanmis olur. */
  if(completed && act.act===6 && !q){
    const d2=done;
    musicStop(1.1); dustStop(); drumStop();
    ST={act:null,i:0,done:null,queue:null};
    shadowMirror(()=>{ d2 ? d2() : backHome(); });
    return;
  }
  // Zincirde degilsek muzik biter; zincirde bir sonraki perde kendi tonunu kurar
  if(!q || !completed){ musicStop(1.1); dustStop(); drumStop(); }
  ST={act:null,i:0,done:null,queue:null};
  if(!completed && q){ show("s-legend"); renderDiary(); return; }  // zincirden cikis
  done ? done() : backHome();
}
document.getElementById("stNext").onclick=()=>storyNext();
document.getElementById("stSkip").onclick=()=>storyFinish(false);

/* ---- D5: Gunluk ekrani ---- */
function renderDiary(){
  const el=document.getElementById("diaryList"); if(!el) return;
  const seen=seenActs();
  // acilmis + planlanan bir sonraki mühür
  const rows=STORY.map(a=>{
    const open = STORY_PREVIEW || S.level>=a.at;
    const d=(a.panels[0][L]||a.panels[0].tr);
    if(!open) return `<div class="card" style="opacity:.6;text-align:left">
        <div style="font-size:11px;letter-spacing:2px;color:var(--gold);opacity:.7;
          text-transform:uppercase">${d.c}</div>
        <b>🔒 ${t("diaryLocked")}</b>
        <div class="muted" style="font-size:12px">${t("diaryHint").replace("{lv}",a.at)}</div></div>`;
    return `<div class="card" style="text-align:left;border-color:rgba(255,207,92,.4)">
        <div style="font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase">${d.c}</div>
        <b>${d.t}</b>
        <div style="margin-top:7px">
          <button class="btn sec" style="padding:7px 14px;font-size:12.5px"
            onclick="replayAct(${a.act})">${t("diaryReplay")}</button></div>
      </div>`;
  });
  // Bir sonraki (henuz yazilmamis) perde de gorunur: yol haritasi kancasi
  const nxt=nextActLevel(S.level);
  if(!STORY.some(a=>a.at===nxt))
    rows.push(`<div class="card" style="opacity:.45;text-align:left">
      <b>🔒 ${t("diaryLocked")}</b>
      <div class="muted" style="font-size:12px">${t("diaryHint").replace("{lv}",nxt)}</div></div>`);
  // Bastan sona izleme butonu — en uste
  const pr=storyProgress();
  const opened=STORY_PREVIEW ? pr.total : pr.open;
  const pct=Math.round(opened/pr.total*100);

/* ==================================================================
   HIKAYE YILDIZ TOZU — acilisi canlandiran parcacik katmani
   ------------------------------------------------------------------
   Kullanici: "baslangictaki hikayeye giris daha canli bisey olmali."
   Durgun bir resim yerine YASAYAN bir sahne: gorselin uzerinde altin
   ve element renginde toz zerreleri suzuluyor, arada bir parlak bir
   kivilcim yukseliyor. Perdenin ruh haline gore renk degisiyor.
   Hafif: 40 parcacik, requestAnimationFrame, ekran kapaninca duruyor.
   ================================================================== */
const DUST={cv:null,ctx:null,p:[],raf:0,last:0,hue:null,dpr:1};
function dustInit(){
  DUST.cv=document.getElementById("stDust");
  if(!DUST.cv) return;
  DUST.ctx=DUST.cv.getContext("2d");
}
function dustResize(){
  if(!DUST.cv) return;
  const w=DUST.cv.parentElement;
  if(!w) return;
  DUST.dpr=Math.min(window.devicePixelRatio||1,2);
  DUST.cv.width=w.clientWidth*DUST.dpr;
  DUST.cv.height=w.clientHeight*DUST.dpr;
  DUST.cv.style.width=w.clientWidth+"px";
  DUST.cv.style.height=w.clientHeight+"px";
}
/* Perde ruh haline gore toz rengi */
const DUST_HUE={
  calm :["#ffe9a8","#ffd27a","#cfe4ff"],
  quest:["#ffd9a0","#e8c98a","#bcd6ff"],
  dark :["#c9b6ff","#9f8ce0","#e0d4ff"],
  hope :["#fff0c4","#ffd98a","#ffe9b8"]
};
function dustStart(moodKey){
  if(!DUST.cv) return;
  try{ if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return; }catch(e){}
  dustResize();
  DUST.hue=DUST_HUE[moodKey]||DUST_HUE.calm;
  const W=DUST.cv.width, H=DUST.cv.height, d=DUST.dpr;
  DUST.p=[];
  for(let i=0;i<40;i++){
    DUST.p.push({
      x:Math.random()*W, y:Math.random()*H,
      r:(0.7+Math.random()*2.1)*d,
      vy:-(4+Math.random()*16)*d/60,          // yavas yukselis
      vx:(Math.random()-0.5)*6*d/60,
      a:0.15+Math.random()*0.55,
      tw:Math.random()*6.28,                   // parildama fazi
      tws:0.6+Math.random()*1.6,
      col:DUST.hue[Math.floor(Math.random()*DUST.hue.length)],
      spark:Math.random()<0.18                 // bazilari parlak kivilcim
    });
  }
  DUST.cv.classList.add("on");
  cancelAnimationFrame(DUST.raf);
  DUST.last=performance.now();
  DUST.raf=requestAnimationFrame(dustTick);
}
function dustStop(){
  cancelAnimationFrame(DUST.raf); DUST.raf=0;
  if(DUST.cv){ DUST.cv.classList.remove("on");
    if(DUST.ctx) DUST.ctx.clearRect(0,0,DUST.cv.width,DUST.cv.height); }
}
function dustTick(now){
  if(!DUST.ctx){ return; }
  const dt=Math.min(50,now-DUST.last); DUST.last=now;
  const W=DUST.cv.width, H=DUST.cv.height, ctx=DUST.ctx;
  ctx.clearRect(0,0,W,H);
  for(const p of DUST.p){
    p.y+=p.vy*dt; p.x+=p.vx*dt; p.tw+=p.tws*dt/1000;
    if(p.y<-10){ p.y=H+10; p.x=Math.random()*W; }
    if(p.x<-10) p.x=W+10; if(p.x>W+10) p.x=-10;
    const tw=0.55+0.45*Math.sin(p.tw);
    ctx.globalAlpha=p.a*tw;
    if(p.spark){
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);
      g.addColorStop(0,p.col); g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*5,0,6.2832); ctx.fill();
    }
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1;
  DUST.raf=requestAnimationFrame(dustTick);
}

/* ==================================================================
   SAHNE OYNATICI — seviye biter bitmez gunluk sayfasi
   ================================================================== */
let SCN={done:null, typing:null};
function playScene(lv, onDone){
  const sc=sceneAt(lv);
  if(!sc){ onDone&&onDone(); return; }
  SCN.done=onDone;
  const el=document.getElementById("scene");
  /* KAHRAMAN sahneye girer: oyuncunun kendi rutbesindeki Taşkıran'i.
     Boylece her gunluk sayfasi "birinin yolculugu" gibi gorunur,
     bos manzara olmaktan cikar. Ruh anlarinda biraz daha buyuk durur
     (o an kahramana ozel konusuluyor). */
  const spEl=document.getElementById("sceneSpirit");
  if(spEl){
    if(sc.spirit){ spEl.src=sc.spirit.img; spEl.classList.add("on");
      spEl.style.animation="none"; void spEl.offsetWidth; spEl.style.animation=""; }
    else spEl.classList.remove("on");
  }
  const hero=document.getElementById("sceneHero");
  if(hero){
    hero.src=heroOf(S);
    const own=!!sc.spirit;
    /* HATA (SAHNE_GOZU buldu): ruh ani OLMAYAN sahnelerde metin blogu
       daha kisa (%28) ama kahraman ayni yukseklikte kaliyordu -> botlari
       arc yazisinin uzerine biniyordu.
       COZUM: kahramanin alt kenari, metin blogunun ustunden guvenli
       mesafede baslasin. Blok payi runtime'da olculuyor (--sh). */
    const card=document.getElementById("sceneCard");
    card.style.setProperty("--heroH", own?"36%":"32%");
    /* Metin blogunun GERCEK yuksekligi olculur, kahraman onun ustune
       konumlanir. Blok icerige gore degistigi icin sabit yuzde yetmiyor. */
    requestAnimationFrame(()=>{
      const body=document.getElementById("sceneBody");
      const H=card.clientHeight||1;
      const pay=body.getBoundingClientRect().height/H*100;
      card.style.setProperty("--heroB", Math.max(28, Math.round(pay)+3)+"%");
    });
    const hw=document.getElementById("sceneHeroWrap");
    if(hw){ hw.style.animation="none"; void hw.offsetWidth; hw.style.animation="";
            paintHeroGear(hw, S.level); }
  }
  /* Gorsel yumusak girsin (tam sayfada sert gecis goze batiyor) */
  const sImg=document.getElementById("sceneImg");
  sImg.classList.remove("in");
  sImg.onload=()=>sImg.classList.add("in");
  sImg.style.animation="none"; void sImg.offsetWidth; sImg.style.animation="";
  sImg.src="assets/story/"+sc.bg+".webp";
  /* Ruh ani ise kart o ruhun kimligine burunur: adi, ikonu, rengi.
     Oyuncu bu anin KENDI ruhuna ozel oldugunu aninda anlar. */
  const arcEl=document.getElementById("sceneArc");
  const card=document.getElementById("sceneCard");
  if(sc.spirit){
    arcEl.innerHTML=`<span class="scSpirit">${sc.spirit.icon} ${sc.spirit.name}</span>`;
    card.classList.add("spiritMoment");
    card.style.setProperty("--spc", SP_COL[sc.spirit.id]||"var(--gold)");
  }else{
    arcEl.textContent=(sc.arc[L]||sc.arc.tr);
    card.classList.remove("spiritMoment");
  }
  document.getElementById("sceneLv").textContent=t("lvl")+" "+lv;
  const pr=storyProgress();
  document.getElementById("sceneCount").textContent=
    t("scCount").replace("{a}",pr.open).replace("{b}",pr.total);
  document.getElementById("sceneNext").textContent=t("scNext");
  el.classList.add("on");
  markScene(lv);
  try{ SFX.pick&&SFX.pick(); }catch(e){}

  // Daktilo etkisi: metin harf harf beliriyor
  const box=document.getElementById("sceneTxt");
  const full=sc.txt; box.textContent="";
  clearInterval(SCN.typing);
  let i=0;
  SCN.typing=setInterval(()=>{
    i+=2;
    box.textContent=full.slice(0,i);
    if(i>=full.length){ clearInterval(SCN.typing); box.textContent=full; }
  },18);
}
function closeScene(){
  clearInterval(SCN.typing);
  const el=document.getElementById("scene");
  el.classList.remove("on");
  const d=SCN.done; SCN.done=null;
  /* Sahneden sonra ara sira koruyucunun bilgeligi gelir.
     Sonuc ekranina gecis, kart kapaninca devam eder. */
  if(maybeWisdom()){
    const w=document.getElementById("wisdom");
    const btn=document.getElementById("wClose");
    const shr=document.getElementById("wShare");
    const fin=()=>{ w.classList.remove("on"); d ? d() : null; };
    if(btn) btn.onclick=fin;
    if(shr){ const old=shr.onclick;
      shr.onclick=(e)=>{ old&&old(e); };   // paylas kapatmasin
    }
    return;
  }
  d ? d() : null;
}
document.getElementById("sceneNext").onclick=()=>closeScene();

function startLevelStoried(){
  /* Linkle gelen oyuncu profilini yeni kurduysa: hikaye yerine
     once RANDEVUYA gidilir. Arkadasi onu bekliyor. */
  if(PENDING_DUEL){
    const pd=PENDING_DUEL; PENDING_DUEL=null;
    if(pd.startAt && pd.startAt>Date.now()+800){ duelLobby(pd.d,pd.startAt); return; }
    launchDuel(pd.d); return;
  }
  const act=actAt(S.level);
  if(act && !seenActs().includes(act.act)){
    // BUYUK ETKI: perde acilirken ekran cam gibi catlar, sonra efsane gelir.
    if(typeof shatter==="function") shatter(()=>playAct(act, ()=>startLevel()));
    else playAct(act, ()=>startLevel());
  }
  else startLevel();
}

   "bir el daha" hissi uretmez.

     1) Neredesin      -> seviye + rutbe

     3) Ne kazandin    -> acilan an sayisi

function renderJourney(){
  const el=document.getElementById("journeyCard"); if(!el) return;
  if(!S || !S.sessions){                    // hic oynamamis: vaat goster
    el.innerHTML=`<div class="jCard fresh">
      <div class="jHead">${t("jFreshHead")}</div>
      <div class="jSub">${t("jFreshSub")}</div></div>`;
    return;
  }
  const pr=storyProgress();
  const nxt=nextActLevel(S.level);
  const kalan=Math.max(0,nxt-S.level);
  /* Cubuk, HEDEF METNIYLE ayni seyi olcmeli. Once toplam hikaye yuzdesini
     gosteriyordu ("%23 dolu") ama metin "7 sunak kaldi" diyordu - iki
     farkli sey. Artik ikisi de BIR SONRAKI PERDEYI gosteriyor: cubuk
     dolunca perde aciliyor. Yakin ve ulasilabilir hedef daha cok cektirir. */
  const from=prevActLevel(S.level);
  const pct = nxt>from ? Math.round(clamp((S.level-from)/(nxt-from)*100,3,100)) : 100;
  const md=MODE();
  const enerji = md.energy
    ? `<span class="jChip">${btRow(S.lives,ENERGY_MAX,13)}</span>` : "";
  const hedef = kalan>0
    ? t("jNext").replace("{n}",kalan)
    : t("jNextNow");
  el.innerHTML=`<div class="jCard">
    <div class="jTop">
      <img src="${heroOf(S)}" class="jHero" alt="">
      <div class="jInfo">
        <div class="jRank">${rankOf(S.level)}</div>
        <div class="jLv">${t("lvl")} ${S.level} ${enerji}</div>
      </div>
    </div>
    <div class="jGoal">${hedef}</div>
    <div class="jBarWrap"><i style="width:${pct}%"></i></div>
    <div class="jFoot">${t("scCount").replace("{a}",pr.open).replace("{b}",pr.total)}</div>
  </div>`;
}

/* ==================================================================
   GERI NAVIGASYONU
   ------------------------------------------------------------------
   Kullanici: "oyun icinde geri tusu yok".
   Iki katman: (1) ekrandaki gorunur geri dugmesi, (2) telefonun donanim
   geri tusu. Ikincisi onemli: eskiden donanim geri tusu SAYFADAN
   CIKIYORDU, oyuncu ilerlemesini kaybettigini saniyordu.
   ================================================================== */
function currentScreen(){ const e=document.querySelector(".screen.on"); return e?e.id:null; }

/* Her ekranin nereye donecegi. null = geri yok (kok ekran). */
function backTarget(id){
  switch(id){
    case "s-game":     return "confirm-quit";
    case "s-story":    return "story-exit";
    case "s-legend":
    case "s-mind":
    case "s-pick":
    case "s-profiles": return "s-splash";
    case "s-newprof":  return DB.profiles.length ? "s-profiles" : null;
    default:           return null;      // s-splash, onboarding ekranlari
  }
}

function goBack(){
  // Once acik modal varsa onu kapat
  if(document.getElementById("modal").classList.contains("on")){
    const inGame=currentScreen()==="s-game";
    if(!inGame || !G || !G.over){ closeModal(); paintBackBtn(); return true; }
  }
  const id=currentScreen(), tgt=backTarget(id);
  if(!tgt) return false;

  if(tgt==="story-exit"){                       // efsaneden cikis
    storyFinish(false); paintBackBtn(); return true;
  }
  if(tgt==="confirm-quit"){                     // oyundan cikis: onay
    modal(`<h2>${t("qQuitTitle")}</h2>
      <div class="muted" style="font-size:13px">${t("qQuitSub")}</div>
      <div style="margin-top:14px">
        <button class="btn wide" onclick="closeModal()">${t("qStay")}</button>
        <button class="btn sec wide" onclick="closeModal();backHome()">${t("qLeave")}</button>
      </div>`);
    return true;
  }
  show(tgt);
  if(tgt==="s-splash")  refreshSplash();
  if(tgt==="s-profiles") renderProfiles();
  paintBackBtn();
  return true;
}

/* Geri dugmesini dogru ekranlarda goster */
function paintBackBtn(){
  const b=document.getElementById("backBtn"); if(!b) return;
  const id=currentScreen();
  // Oyun ekraninda sol ustte ses/profil dugmeleri var + zaten "Menu" var.
  // Hikaye ekraninda "Kapat/Atla" var. Onlarda gizli tutuyoruz.
  const showIt = !!backTarget(id) && id!=="s-game" && id!=="s-story";
  b.classList.toggle("on", showIt);
}
document.getElementById("backBtn").onclick=()=>goBack();
