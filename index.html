/* Yuz havuzu: aileler arasinda DENGELI dagitim.
   Eskiden ALLFACES.slice(0,nF) sirali aliyordu; dizilim
   [4 element][9 yildiz][9 run][9 rakam][9 muhur] oldugu icin orta
   seviyelerde tahtanin yarisi yildiz oluyordu ve noktalar birbirine
   karisiyordu. Simdi her aileden sirayla cekiyoruz: 4 element once
   (oyunun kimligi), sonra yildiz/run/rakam/muhur donusumlu. */
function facePool(nF){
  const fam={el:[],dot:[],stk:[],num:[],let:[]};
  ALLFACES.forEach(f=>fam[f.k].push(f));
  const out=fam.el.slice(0, Math.min(4,nF));        // dort element hep acik
  const rings=[fam.dot,fam.stk,fam.num,fam.let];
  let i=0;
  while(out.length<nF){
    let added=false;
    for(const r of rings){
      if(out.length>=nF) break;
      if(i<r.length){ out.push(r[i]); added=true; }
    }
    if(!added) break;
    i++;
  }
  return out;
}

/* Tüm yüz havuzu — zorluk arttıkça daha fazlası açılır */
const ALLFACES=[];
["fire","water","earth","air"].forEach(e=>ALLFACES.push({k:"el",e,id:"el"+e}));
for(let i=1;i<=9;i++) ALLFACES.push({k:"dot",n:i,id:"dot"+i});
for(let i=1;i<=9;i++) ALLFACES.push({k:"stk",n:i,id:"stk"+i});
for(let i=1;i<=9;i++) ALLFACES.push({k:"num",n:i,id:"num"+i});
"ABCDEFGHI".split("").forEach(c=>ALLFACES.push({k:"let",c,id:"let"+c}));

/* ==================================================================
   MATEMATİK (docs/math_model.py ile aynı)
   ================================================================== */
const MAX_LEVEL=100, CHI_START=1000, CHI_MIN=400, CHI_MAX=2400;
const K_BASE=40, K_FLOOR=12, K_DECAY_N=25;
const POP_MEAN=1250, POP_SD=260, SB_K=8;
/* IQ tahmininin gorunmesi icin gereken en az oturum. Metinle kod ayni
   kaynaktan beslensin diye sabit: eskiden metin "20 oturum" diyor ama kod
   rho>=0.35 (5. oturum) kosulunu kullaniyordu -> celiski. */
const IQ_MIN_SESSIONS=20;
const ENERGY_MAX=3, REGEN_MIN=30;
const GRACE_DAYS=2, HALF_LIFE=21, LAMBDA=Math.log(2)/HALF_LIFE, FLOOR_RATIO=.65;
const MATCH_N=3;                    // kaç aynı taş patlar
/* Zincir penceresi: bir eslesmeden sonra bu sure icinde yeni eslesme
   gelirse kombo buyur.
   Eskiden combo "ardisik eslesme" idi; ama uclu kurmak icin arada
   eslesmesiz secim SART oldugundan combo hep 1'de kaliyordu (5 oyunda
   olculdu) - yani kombo bagirislari ve zaman dondurma OLU KODDU.
   Deger 40 oyunluk simulasyonla kalibre edildi (secim arasi 0.9-2.5sn):
     3000ms -> ort. kombo 1.1, hic 3'lu yok      (cok siki)
     4500ms -> ort. kombo 3.0, %65 uc, %8 bes    <- SECILDI
     6000ms -> ort. kombo 10.8, %93 bes          (cok comert)
   Hedef: 3'lu kombo cabayla gelsin, 5'li nadir bir zafer olsun. */
const CHAIN_MS=4500;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* --- Seviye eğrisi (tepsi mekaniğine göre) --- */
// Taş sayısı MATCH_N katı olmalı
// Ilk seviyeler 6-7 uclu ile cok seyrek basliyordu; tabla bos gorunuyordu.
// Yeni taban 11 uclu (33 tas): ekran dolu, "ciddi bulmaca" hissi veriyor.
function triplesOf(n){ return Math.round(11+26*(1-Math.exp(-Math.min(n,MAX_LEVEL)/24))); }  // 11 -> 37 üçlü
const tilesOf = n => triplesOf(n)*MATCH_N;                              // 18 -> 108 taş
// Sv1'den itibaren 2 katman: yigin derinligi (B4) ilk saniyeden gorunur.
// Tek katmanli duz tabla premium durmuyordu.
const layersOf= n => n<=8?2 : n<=26?3 : n<=60?4 : 5;   // Sv60+ ve sonsuz: 5
// Tepsi genişliği: ilk seviyeler daha geniş (öğrenme payı), sonra 7'de sabit.
// 6'ya indirmek geç seviyelerde kazanma oranını %50'ye düşürüyordu (test edildi).
// Telafi: tabla zorlastigi icin ogrenme penceresi genisletildi (3 -> 6 seviye).
function trayOf(n){ if(isEndless(n)) return endlessTray(endlessRun(n));
                    return n<=6?8 : 7; }
// Yuz cesidi = gorsel karmasiklik. Daha fazla farkli sembol -> tabla
// "karisik" gorunur. Cozulebilirlik bundan etkilenmiyor (ters cozum uretimi).
function facesOf(n){ if(isEndless(n)) return endlessFaces(endlessRun(n));
  return clamp(Math.round(7+triplesOf(n)*0.62),7,ALLFACES.length); }
// Üçlülerin soyma sırasında ne kadar dağıldığı = asıl zorluk kolu.
// 0 = üç taş peş peşe açılır (çok kolay), yüksek = tepside beklerler.
function spreadOf(n){
  if(isEndless(n)) return endlessSpread(endlessRun(n));
  return n<=3?1 : Math.round(clamp(2+n*0.075,2,9));
}
// Sure: tas basina ~2.6s -> ~1.7s. Onceki degerler (5.5s/tas) hic baskı
// yaratmiyordu: Sv1'de 34sn'lik is icin 115sn veriliyordu.
const parTime = n => {
  const base=Math.round(tilesOf(n)*(1.5*Math.exp(-Math.min(n,MAX_LEVEL)/70)+1.7));
  return isEndless(n) ? Math.round(base*endlessTimeMult(endlessRun(n))) : base;
};
const hintMax = n => Math.max(1,4-Math.floor(n/28));
const undoMax = n => Math.max(1,3-Math.floor(n/35));
/* ==================================================================
   SONSUZ MOD — "Arafta Kosu"  (Sv100 sonrasi)
   ------------------------------------------------------------------
   Sorun: Sv100'de tas sayisi doygun (111 tas), Elo tavanda (2400).
   Daha fazla tas telefonda okunmaz, daha yuksek Elo Chi tavanini asar.
   Simulasyon: seviye basi %1.5 birakma ile Sv100'e ulasan %22 =
   48.875 MAU'da ~10.750 kisi. Bu kadar oyuncuyu bosluga birakamayiz.

   Cozum: seviye degil TUR. Tahta buyuklugu sabit; sure kisilir,
   yuz cesidi artar, tepsi daralir. Chi zaten tavanda oldugu icin
   artik ULASILAN TUR yarisiyor - siralama tablosu buradan besleniyor.
   ================================================================== */
const ENDLESS_START = MAX_LEVEL + 1;
const isEndless = n => n > MAX_LEVEL;
const endlessRun = n => Math.max(1, n - MAX_LEVEL);        // kacinci tur
const endlessTimeMult = r => Math.max(0.55, 1.0 - r*0.045);
const endlessFaces    = r => Math.min(ALLFACES.length, 30 + r);
const endlessTray     = r => r < 5 ? 7 : (r < 12 ? 6 : 5);
/* Tur 10'dan sonra sure/yuz/tepsi tavana vuruyor. Zorluk donmasin diye
   asil kol DAGILIM oluyor: ucluler tepside daha uzun bekliyor.
   Bu, tepsi kapasitesine bindirir - gercek ustalik testi. */
const endlessSpread   = r => Math.min(12, 9 + Math.floor(Math.max(0, r-8)/5));

const levelElo= n => Math.round(800+1600*(1-Math.exp(-n/38))/(1-Math.exp(-100/38)));
const kFactor = s => K_FLOOR+(K_BASE-K_FLOOR)*Math.exp(-s/K_DECAY_N);
const expected=(p,e)=>1/(1+Math.pow(10,(e-p)/400));
const reliab  = s => s/(s+SB_K);

function rankOf(n){
  if(n<=15) return L==="tr"?"Çırak":"Apprentice";
  if(n<=35) return L==="tr"?"Öğrenci":"Student";
  if(n<=60) return L==="tr"?"Bükücü":"Bender";
  if(n<=85) return L==="tr"?"Usta":"Master";
  if(n<=99) return L==="tr"?"Büyük Usta":"Grandmaster";
  if(n===MAX_LEVEL) return L==="tr"?"Element Avatarı":"Element Avatar";
  return (L==="tr"?"Arafta Koşu · Tur ":"Void Run · Round ")+endlessRun(n);
}
const rSpeed=(u,p)=>u<=0?1:clamp(1/(1+Math.exp(-2.2*(p/u-.95))),0,1);
const rLogic=(ok,bad)=>{const tt=ok+bad;return tt===0?.5:clamp(((ok/tt)-.45)/.55,0,1);};
const rMemory=(h,hm,rv,p)=>clamp(.55*(1-h/Math.max(1,hm))+.45*(1-Math.min(1,rv/Math.max(1,p*1.5))),0,1);
const rPattern=(c,p,s,sm)=>clamp(.7*Math.min(1,c/Math.max(3,p*.35))+.3*(1-s/Math.max(1,sm)),0,1);
function updateChi(cur,lvl,r,sess){
  return clamp(cur+kFactor(sess)*(r-expected(cur,levelElo(lvl))),CHI_MIN,CHI_MAX);
}
function chiTotal(s){
  const v=[s.speed,s.logic,s.memory,s.pattern];
  const a=v.reduce((x,y)=>x+y,0)/4;
  const h=4/v.reduce((x,y)=>x+1/Math.max(1e-9,y),0);
  return .75*a+.25*h;
}
function chiToIQ(chi,sess){
  const rho=reliab(sess);
  return {iq:clamp(100+(15*((chi-POP_MEAN)/POP_SD))*rho,55,145),
          ci:1.96*15*Math.sqrt(Math.max(0,1-rho)), rho};
}
function applyDecay(chi,peak,days){
  const d=Math.max(0,days-GRACE_DAYS), fl=Math.max(CHI_MIN,FLOOR_RATIO*peak);
  return chi<=fl?chi:fl+(chi-fl)*Math.exp(-LAMBDA*d);
}


/* ---------- Ses (WebAudio — harici dosya yok) ---------- */
let AC=null, SOUND=true;
try{ SOUND = localStorage.getItem("sb_sound")!=="0"; }catch(e){}
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  if(AC&&AC.state==="suspended") AC.resume().catch(()=>{});
  return AC;
}
function beep(freq,dur,type,vol){
  if(!SOUND) return;
  const c=ac(); if(!c) return;
  try{
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(0,c.currentTime);
    g.gain.linearRampToValueAtTime(vol||0.09,c.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+(dur||0.12));
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+(dur||0.12)+0.02);
  }catch(e){}
}
function buzz(ms){ if(SOUND&&navigator.vibrate) try{navigator.vibrate(ms);}catch(e){} }

/* ==================================================================
   HIKAYE MUZIGI — dosyasiz, WebAudio ile bestelenmis
   ------------------------------------------------------------------
   Kullanici: "hikayemizin muzikleri olsun".
   TASARIM KARARI: mp3 yuklemedik. Neden: (1) ilk yukleme butcesi
   (E4) zaten 1.5 MB'a dayandi, bir muzik dosyasi 2-3 MB ekler,
   (2) telif/lisans riski, (3) prosedurel muzik perdeye gore
   TON DEGISTIREBILIYOR - Perde I huzurlu, Perde VII karanlik.
   Ayni motor, farkli mod. Sifir bayt.

   Yapisi: kok nota uzerine yavas arpej (pad) + alt oktav dem sesi.
   Ses acikken calar, ses kapaliyken hic baslamaz.
   ================================================================== */
const MUSIC={on:false, nodes:[], timer:null, gain:null};
/* Perde ruh haline gore olcek: minor = agir/karanlik, major = umutlu */
const MOODS={
  calm  :{root:196.00, scale:[0,3,5,7,10,12], rate:2.6, wave:"sine",     vol:0.055}, // Perde I-II
  dark  :{root:146.83, scale:[0,1,5,6,8,11],  rate:2.2, wave:"triangle", vol:0.050}, // Perde VI-VII
  hope  :{root:220.00, scale:[0,4,7,9,11,12], rate:2.4, wave:"sine",     vol:0.055}, // Perde VIII-X
  quest :{root:174.61, scale:[0,2,3,7,8,10],  rate:2.8, wave:"sine",     vol:0.048}, // Perde III-V
  /* EPIC — yalniz acilis perdesi.
     Kullanici: "oyunun basindaki ses yetersiz, bir maceraya giris
     yapacagiz, secim ekranindan 1. maca kadar biraz daha aksiyon".
     Daha alcak kok (guclu his), genis araliklar (kahramanlik),
     hizli tempo ve testere dalgasi (gerilim). Ustune davul biner. */
  epic  :{root:130.81, scale:[0,7,12,15,19,24], rate:1.5, wave:"sawtooth", vol:0.052}
};
/* ==================================================================
   MACERA GIRISI — davul + yukselen gerilim
   ------------------------------------------------------------------
   Acilis perdesinde arpej TEK BASINA yetersizdi: "bir sey basliyor"
   hissi vermiyordu. Uc katman eklendi:
     1) Kalp atisi davulu (alcak sinus + hizli sonum)
     2) Yukselen gerilim suzgeci (filter sweep)
     3) Vurus anlarinda cin sesi (bell)
   Hepsi WebAudio - sifir dosya, sifir bayt.
   ================================================================== */
const DRUM={timer:null, on:false, step:0};
function drumHit(t0,freq,dur,gain){
  const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type="sine"; o.frequency.setValueAtTime(freq,t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*0.4),t0+dur);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(gain,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.05);
}
function bellHit(t0,freq,gain){
  const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type="triangle"; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(gain,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+1.1);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+1.2);
}
/* Kalp atisi: iki vurus, sonra bosluk. Gerilim boyle kurulur. */
function drumStart(){
  if(!SOUND) return;
  drumStop();
  const c=ac(); if(!c) return;
  DRUM.on=true; DRUM.step=0;
  const beat=()=>{
    if(!DRUM.on) return;
    const t=c.currentTime, k=DRUM.step%4;
    if(k===0){ drumHit(t,58,0.45,0.34); }               // guclu vurus
    else if(k===1){ drumHit(t,52,0.30,0.17); }          // yanki
    else if(k===3){ drumHit(t,64,0.22,0.11); }          // hazirlik
    if(DRUM.step%8===6) bellHit(t,784,0.055);           // uzak can
    DRUM.step++;
    DRUM.timer=setTimeout(beat,430);
  };
  beat();
}
function drumStop(){
  DRUM.on=false;
  if(DRUM.timer){ clearTimeout(DRUM.timer); DRUM.timer=null; }
}
/* Odak cini: oyun basinda tek, temiz, uzun sonumlu ses.
   Davulun tersi - sakinlestirir, dikkati toplar. */
function focusChime(){
  if(!SOUND) return;
  const c=ac(); if(!c) return;
  const t0=c.currentTime+0.05;
  [523.25, 784.0].forEach((f,i)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0,t0+i*0.09);
    g.gain.linearRampToValueAtTime(0.055,t0+i*0.09+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+i*0.09+2.2);
    o.connect(g); g.connect(c.destination);
    o.start(t0+i*0.09); o.stop(t0+i*0.09+2.3);
  });
}

/* Tek seferlik "macera basliyor" vurusu: alcaktan yukari suzulen dalga */
function heroSting(){
  if(!SOUND) return;
  const c=ac(); if(!c) return;
  const t0=c.currentTime;
  const o=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain();
  o.type="sawtooth"; o.frequency.setValueAtTime(65,t0);
  o.frequency.exponentialRampToValueAtTime(262,t0+1.5);
  f.type="lowpass"; f.frequency.setValueAtTime(180,t0);
  f.frequency.exponentialRampToValueAtTime(3400,t0+1.5);
  f.Q.value=7;
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(0.10,t0+0.5);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+2.0);
  o.connect(f); f.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+2.1);
  drumHit(t0,48,0.7,0.32);
  setTimeout(()=>{ const cc=ac(); if(cc) bellHit(cc.currentTime,1046,0.07); },1450);
}
function moodForAct(id){
  if(id===0) return MOODS.epic;        // acilis: macera girisi
  if(id>=8) return MOODS.hope;
  if(id>=6) return MOODS.dark;
  if(id>=2) return MOODS.quest;
  return MOODS.calm;
}
function musicStart(mood){
  if(!SOUND) return;
  musicStop();
  const c=ac(); if(!c) return;
  const M=mood||MOODS.calm;
  try{
    const master=c.createGain();
    master.gain.setValueAtTime(0,c.currentTime);
    master.gain.linearRampToValueAtTime(M.vol, c.currentTime+2.2);   // yumusak giris
    master.connect(c.destination);
    MUSIC.gain=master;

    // Alt oktav dem sesi (drone) — sahnenin zemini
    const d=c.createOscillator(), dg=c.createGain();
    d.type="sine"; d.frequency.value=M.root/2;
    dg.gain.value=0.5; d.connect(dg); dg.connect(master); d.start();
    MUSIC.nodes.push(d);

    // Yavas arpej: her adimda olcekten bir nota
    let step=0;
    const play=()=>{
      if(!MUSIC.on) return;
      const semi=M.scale[step%M.scale.length];
      const oct=(step%(M.scale.length*2))>=M.scale.length ? 2 : 1;
      const f=M.root*Math.pow(2,semi/12)*oct;
      try{
        const o=c.createOscillator(), g=c.createGain();
        o.type=M.wave; o.frequency.value=f;
        g.gain.setValueAtTime(0,c.currentTime);
        g.gain.linearRampToValueAtTime(0.42, c.currentTime+0.35);
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+M.rate*0.95);
        o.connect(g); g.connect(master);
        o.start(); o.stop(c.currentTime+M.rate);
      }catch(e){}
      step++;
    };
    MUSIC.on=true;
    play();
    MUSIC.timer=setInterval(play, M.rate*1000);
  }catch(e){}
}
function musicStop(fade){
  MUSIC.on=false;
  clearInterval(MUSIC.timer); MUSIC.timer=null;
  const c=AC;
  if(MUSIC.gain && c){
    try{
      MUSIC.gain.gain.cancelScheduledValues(c.currentTime);
      MUSIC.gain.gain.setValueAtTime(MUSIC.gain.gain.value, c.currentTime);
      MUSIC.gain.gain.linearRampToValueAtTime(0.0001, c.currentTime+(fade||0.8));
    }catch(e){}
  }
  const nodes=MUSIC.nodes.slice(); MUSIC.nodes=[];

/* ==================================================================
   TAHTA ÜRETİMİ
   Yığın: katmanlı, yarım hücre kaydırmalı (görseldeki gibi organik)
   ================================================================== */
function buildPositions(nTiles,nLayers){
  const pos=[]; let need=nTiles, z=0;
  let w=Math.max(5,Math.round(Math.sqrt(nTiles*1.15)));
  let h=Math.max(5,Math.ceil(nTiles/w));
  while(need>0 && z<nLayers){
    const cw=Math.max(2,w-z), ch=Math.max(2,h-z);
    const off=(z%2)?0.5:0;                        // katmanlar yarım kaydırılır
    const cells=[];
    for(let y=0;y<ch;y++) for(let x=0;x<cw;x++)
      cells.push({x:x+off+z*0.5, y:y+z*0.5, z});
    const share = (z===nLayers-1) ? need : Math.min(need,Math.round(cells.length*(z===0?.86:.66)));
    const cx=(cw-1)/2+off+z*0.5, cy=(ch-1)/2+z*0.5;
    cells.sort((a,b)=>((a.x-cx)**2+(a.y-cy)**2)-((b.x-cx)**2+(b.y-cy)**2));
    cells.slice(0,Math.min(share,cells.length)).forEach(c=>pos.push(c));
    need-=Math.min(share,cells.length); z++;
  }
  let guard=0;
  while(need>0 && guard++<400){
    const x=Math.floor(BRD.rnd()*w), y=Math.floor(BRD.rnd()*h);
    if(!pos.some(p=>p.z===0&&Math.abs(p.x-x)<.4&&Math.abs(p.y-y)<.4)){ pos.push({x,y,z:0}); need--; }
  }
  return pos.slice(0,nTiles);
}
/* ==================================================================
   DETERMINISTIK TAHTA — tohumlu uretim
   ------------------------------------------------------------------
   TICARI_PLAN "tahtalarimiz tohumlu uretiliyor, bu bedava geliyor"
   diyordu ama uretim Math.random() kullaniyordu; ayni tohum ayni
   tahtayi VERMIYORDU. V3 Meydan Okuma ve PvP bu varsayima dayaniyor.
   Artik tum tahta uretimi BRD.rnd uzerinden akiyor: ayni tohum =
   ayni tahta, her cihazda, her zaman. Sunucu gerekmiyor.
   ================================================================== */
function seededRand(seed){
  let s=seed>>>0;
  return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
}
const BRD={rnd:Math.random};                 // uretim sirasinda degistirilir
/* Metinden 32-bit tohum (meydan okuma kodu -> tahta) */
function hashSeed(str){
  let h=2166136261>>>0;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  return h>>>0;
}
/* Gunluk/seviye tohumu: ayni oyuncu ayni seviyeyi tekrar oynarsa
   FARKLI tahta gorsun diye deneme sayaci da karisiyor. */
function levelSeed(level, salt){
  return hashSeed("SB|"+level+"|"+(salt==null?Math.floor(Math.random()*1e9):salt));
}

/* Üstü örtülü mü? (bir üst katmanda örtüşen taş var mı) */
function coveredIn(set,p){
  return set.some(q=>q.z===p.z+1 && Math.abs(q.x-p.x)<0.75 && Math.abs(q.y-p.y)<0.75);
}
/* Yanı açık mı? (aynı katmanda sol VEYA sağ boş olmalı) */
function sideOpenIn(set,p){
  const l=set.some(q=>q.z===p.z&&Math.abs(q.y-p.y)<0.5&&Math.abs(q.x-(p.x-1))<0.4);
  const r=set.some(q=>q.z===p.z&&Math.abs(q.y-p.y)<0.5&&Math.abs(q.x-(p.x+1))<0.4);
  return !l||!r;
}
function freeIn(set,p){ return !coveredIn(set,p) && sideOpenIn(set,p); }

/* Soyma sırası: tahtayı serbest taşlardan tek tek "soyarak" bir açılış
   sırası çıkar. Bu sıra, taşların hangi anda erişilebilir olduğunu verir. */
function peelOrder(positions){
  const rem=positions.map(p=>({...p})), order=[];
  let guard=0;
  while(rem.length && guard++<9999){
    const free=rem.filter(p=>freeIn(rem,p));
    if(!free.length){ rem.forEach(p=>order.push(p)); break; }   // güvenlik ağı
    const pick=free[Math.floor(BRD.rnd()*free.length)];
    order.push(pick);
    const k=rem.findIndex(q=>q.x===pick.x&&q.y===pick.y&&q.z===pick.z);
    rem.splice(k,1);
  }
  return order;
}

/* Yüz dağıtımı — KRİTİK.
   Rastgele dağıtım tepsiyi taşırıyordu (geç seviyelerde kazanma %0-20).
   Çözüm: üçlüleri SOYMA SIRASINA göre ata; böylece bir üçlünün üç taşı
   birbirine yakın zamanda açılır ve tepside sonsuza kadar beklemez.
   spread = üçlünün ne kadar dağıldığı -> zorluk kolu.
   Test: 16 seviye x 60 tahta -> kazanma %92-100. */
/* Hizli ic simulasyon: bu tahta greedy oyuncu ile cozulebiliyor mu?
   DOM'a dokunmaz, saniyenin binde biri surer. */
function boardSolvable(tiles,traySize){
  const t=tiles.map(x=>({x:x.x,y:x.y,z:x.z,id:x.face.id,dead:false,inTray:false}));
  let tray=[],guard=0;
  while(guard++<4000){
    if(t.every(q=>q.dead)) return true;
    const live=t.filter(q=>!q.dead&&!q.inTray);
    const free=live.filter(q=>{
      const cov=live.some(o=>o.z===q.z+1&&Math.abs(o.x-q.x)<0.75&&Math.abs(o.y-q.y)<0.75);
      const l=live.some(o=>o.z===q.z&&Math.abs(o.y-q.y)<0.5&&Math.abs(o.x-(q.x-1))<0.4);
      const r=live.some(o=>o.z===q.z&&Math.abs(o.y-q.y)<0.5&&Math.abs(o.x-(q.x+1))<0.4);
      return !cov&&(!l||!r);});
    if(!free.length||tray.length>=traySize) return false;
    let pick=null;
    for(const tt of tray){ const m=free.find(f=>f.id===tt.id); if(m){pick=m;break;} }
    if(!pick){ const c={}; free.forEach(f=>c[f.id]=(c[f.id]||0)+1);
      const bs=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
      pick=free.find(f=>f.id===bs[0]); }
    pick.inTray=true;
    let ins=tray.length;
    for(let k=tray.length-1;k>=0;k--) if(tray[k].id===pick.id){ ins=k+1; break; }
    tray.splice(ins,0,pick);
    let again=true;
    while(again){ again=false;
      for(let k=0;k+MATCH_N<=tray.length;k++){
        if(tray[k+1].id===tray[k].id&&tray[k+2].id===tray[k].id){
          tray.splice(k,MATCH_N).forEach(q=>q.dead=true); again=true; break; } } }
  }
  return false;
}

/* Cozulebilirlik garantisi: uretilen tahtayi dogrula, gecmezse yeniden uret.
   Testte ham uretim %73-100 arasi dalgalaniyordu (Sv82 en kotu);
   bu sarmal ile her tahta oynanabilir cikiyor. */
function generateBoard(level, seed){
  const tray=trayOf(level);
  const base = (seed==null) ? levelSeed(level) : (seed>>>0);
  let best=null;
  for(let attempt=0; attempt<24; attempt++){
    // Her deneme tohumun turevi: ayni tohum -> ayni deneme dizisi -> ayni tahta
    const prev=BRD.rnd;
    BRD.rnd=seededRand((base + attempt*2654435761)>>>0);
    const cand=makeBoard(level);
    BRD.rnd=prev;
    if(boardSolvable(cand,tray)){ cand.seed=base; return cand; }
    best=cand;
  }
  if(best) best.seed=base;
  return best;   // asiri nadir: en son adayi ver (oyun yine de oynanir)
}

function makeBoard(level){
  const nT=tilesOf(level), nL=layersOf(level), nF=facesOf(level), sp=spreadOf(level);
  const positions=buildPositions(nT,nL);
  const order=peelOrder(positions);
  const N=Math.floor(order.length/MATCH_N)*MATCH_N;
  const idx=[...Array(N).keys()];
  if(sp>0){                       // pencere içinde karıştır -> üçlüler dağılır
    const win=Math.max(MATCH_N,sp);
    for(let s=0;s<N;s+=win){
      const seg=idx.slice(s,Math.min(s+win,N));
      for(let i=seg.length-1;i>0;i--){ const j=Math.floor(BRD.rnd()*(i+1)); [seg[i],seg[j]]=[seg[j],seg[i]]; }
      for(let i=0;i<seg.length;i++) idx[s+i]=seg[i];
    }
  }
  const pool=facePool(nF), tiles=[];
  for(let i=0;i<N;i+=MATCH_N){
    const f=pool[(i/MATCH_N)%pool.length];
    for(let j=0;j<MATCH_N;j++) tiles.push({...order[idx[i+j]], face:f});
  }
  return tiles.map((t,i)=>({...t, i, dead:false, inTray:false}));
}

/* Sinav bitti: sonucu HESAPLA ama kalici Chi'yi BOZMA.
   Sinav ayri bir olcumdur; gunluk ilerlemeyi kirletmemeli. */
function finishExam(won,reason){
  const n=EXAM_LEVEL, p=triplesOf(n), used=(Date.now()-G.t0)/1000;
  /* KALIBRASYON NOTU:
     rMemory ve rPattern normalde "kullanilan ipucu / verilen ipucu"
     oranina bakar. Sinavda ipucu hakki SIFIR oldugu icin bu terimler
     otomatik tam puan uretiyordu -> bedava puan, herkes tavana vuruyordu
     (bot testi: 11 saniyede 145). Sinavda bu iki boyut YALNIZ gercek
     davranistan olculur:
       hafiza = tekrar bakma (revisit) azligi
       oruntu = kurulan en uzun zincir
     Boylece dort boyut da gercekten kazanilir. */
  const r={
    speed  : rSpeed(used,G.par),
    logic  : rLogic(G.ok,G.bad),
    memory : clamp(1-Math.min(1,G.revisits/Math.max(1,p*1.2)),0,1),
    /* Zincir esigi: p*0.45 iken orta oyuncu bile tavana vuruyordu
       (simulasyon: orta 119, usta 145 - ikisi de ust banda sikisti).
       Kusursuz zincir = tum ucluler ust uste; bu nadir olmali.
       p*0.9 esigi: yarisini zincirleyen ~0.5 alir, tamamini
       zincirleyen 1.0. Ayrimi acar. */
    pattern: clamp(Math.min(1,G.bestCombo/Math.max(3,p*0.9)),0,1)
  };
  if(!won) for(const k in r) r[k]*=0.6;
  /* Tek oturumluk ham skoru Chi olcegine tasi.
     Normal oyunda Chi 20 oturumda oturur; burada tek sinavdan
     dogrudan uretiyoruz, bu yuzden guven araligi genis verilir. */
  /* Cubuklar UCLARA yapismasin: ham oran 0..1 iken dogrudan
     CHI_MIN..CHI_MAX'e yayinca tek oturumda cubuklar ya tam dolu ya
     bombos cikiyordu (bot testi: uc boyut 2400, hafiza 400).
     Tek oturum bu kadar kesin konusamaz. Skoru orta banda sikistiriyoruz:
     0 -> 700, 0.5 -> 1250, 1 -> 1900. Uclar ancak asiri performansta
     gorulur, tipik oyuncu ortada anlamli bir dagilim gorur. */
  const EX_LO=700, EX_HI=1900;
  const chi={};
  for(const k in r) chi[k]=clamp(EX_LO+(EX_HI-EX_LO)*clamp(r[k],0,1),CHI_MIN,CHI_MAX);
  const tot=chiTotal(chi);
  /* SINAVA OZEL OLCEK.
     POP_MEAN/POP_SD sabitleri UZUN VADELI oyun icin kalibre edildi;
     tek oturumun dagilimi farkli. O olcegi burada kullaninca herkes
     tavana vuruyordu (simulasyon: usta 145, orta 119 - ikisi de ust
     bantta sikisti).
     Burada dogrudan ham basari ortalamasindan gidiyoruz:
       ortalama oyun (0.50) -> 100
       cok iyi oyun  (0.85) -> ~131
       kusursuz      (1.00) -> ~144  (tavan nadir kalir)
     0.17 -> 1 standart sapma varsayimi. */
  const rAvg=(r.speed+r.logic+r.memory+r.pattern)/4;
  const iq=clamp(100+15*((rAvg-0.50)/0.17),55,145);
  const ci=1.96*15*Math.sqrt(1-0.55);          // tek oturum: rho~0.55
  S.exam={ iq, chi, tot, won, at:Date.now(), sec:Math.round(used) };
  save();
  EXAM=null;
  showExamResult();
}

    .map(([k,el])=>{

      return `<div class="dim"><div class="row"><span>${t(k)}</span>
        <span class="sp"></span><b>${Math.round(e.chi[k])}</b></div>

/* Yel'nin hediyesi: sayac belirtilen sure boyunca durur. */
function freezeTime(sec){
  if(!G || G.noTimer) return;
  G.freeze=Math.max(G.freeze||0, sec);
  const ht=document.getElementById("hTime");
  if(ht){ ht.classList.remove("frozen"); void ht.offsetWidth; ht.classList.add("frozen"); }
  const wrap=document.getElementById("s-game");
  if(wrap){ wrap.classList.remove("freezeFlash"); void wrap.offsetWidth; wrap.classList.add("freezeFlash");
            setTimeout(()=>wrap.classList.remove("freezeFlash"),900); }
  shout("timeFreeze", `<b style="color:#9fe8ff">+${sec}s ❄</b>`);
  popFx(document.getElementById("hTime"), t("frozen"));
}

function tick(){
  if(!G||G.over) return;
  if(G.noTimer){                       // Cocuk Modu: sure yok, gecen sureyi say
    G.elapsed=(G.elapsed||0)+1;
    document.getElementById("hTime").textContent="⏱ "+fmt(G.elapsed);
    return;
  }
  // Watchdog: busy kilidi 3sn'den uzun takili kalirsa serbest birak.
  // (animasyon zinciri beklenmedik sekilde kesilirse oyun donmasin)
  if(G.busy){ G.busyT=(G.busyT||0)+1; if(G.busyT>3){ G.busy=false; G.busyT=0; } }
  else G.busyT=0;
  // Zaman donmusken sayac islemiyor
  if(G.freeze>0){
    G.freeze--;
    const hf=document.getElementById("hTime");
    if(hf){ hf.textContent="❄ "+fmt(G.left); hf.style.color="#9fe8ff"; hf.style.fontWeight="900"; }
    if(G.freeze===0 && hf){ hf.classList.remove("frozen"); hf.style.color=""; hf.style.fontWeight=""; }
    return;
  }
  G.left--;
  const ht=document.getElementById("hTime");
  ht.textContent="⏱ "+fmt(G.left);
  const kritik=G.left<=10;
  ht.style.color=kritik?"var(--bad)":"";
  ht.style.fontWeight=kritik?"900":"";
  if(kritik&&G.left>0){ SFX.warn(); if(G.left===10) shout("lowTime"); }
  if(G.left<=0){ clearInterval(timerId); endLevel(false,"time"); }
}
const fmt=s=>Math.floor(Math.max(0,s)/60)+":"+String(Math.max(0,s)%60).padStart(2,"0");

/* ---------- Tepsi ---------- */
function buildTray(){
  const tr=document.getElementById("tray");
  // taş ölçüsünü ekrana göre belirle
  const availW=Math.min(document.getElementById("app").clientWidth,520)-44;
  TW=clamp(Math.floor(availW/G.traySize)-4,30,48);
  TH=Math.round(TW*1.32);
  tr.style.setProperty("--tw",TW+"px");
  tr.style.setProperty("--th",TH+"px");
  tr.innerHTML="";
  for(let i=0;i<G.traySize;i++){
    const d=document.createElement("div"); d.className="slot"; d.dataset.s=i;
    tr.appendChild(d);
  }
}
function slotRect(i){
  const s=document.querySelector(`.slot[data-s="${i}"]`);
  const wrap=document.getElementById("app").getBoundingClientRect();
  const r=s.getBoundingClientRect();
  return {x:r.left-wrap.left, y:r.top-wrap.top, w:r.width, h:r.height};
}
function renderTray(){
  // tepsideki taşları slotlara yerleştir (aynılar yan yana — sıralı diziliş)
  document.querySelectorAll(".ttile").forEach(e=>e.remove());
  const app=document.getElementById("app");
  G.tray.forEach((tl,idx)=>{
    const r=slotRect(idx);
    const d=document.createElement("div");
    d.className="ttile"; d.dataset.tt=tl.i;
    d.style.width=r.w+"px"; d.style.height=r.h+"px";
    d.style.left=r.x+"px"; d.style.top=r.y+"px";
    d.innerHTML=faceSVG(tl.face);
    app.appendChild(d);
  });
  // doluluk uyarısı
  const danger=G.tray.length>=G.traySize-1;
  document.querySelectorAll(".slot").forEach((s,i)=>
    s.classList.toggle("danger",danger&&i>=G.tray.length));
  const trEl=document.getElementById("tray");
  if(danger&&!G.warned){ G.warned=true; SFX.warn(); buzz(60);
    trEl.classList.add("warn"); setTimeout(()=>trEl.classList.remove("warn"),480); }
  if(!danger) G.warned=false;
  const kalan=G.tiles.filter(x=>!x.dead).length;
  document.getElementById("hLeft").textContent=`${t("left")} ${kalan}`;
  const pf=document.getElementById("progFill");
  if(pf) pf.style.width=(100*(1-kalan/Math.max(1,G.tiles.length)))+"%";
}

/* ---------- Tahta çizimi ---------- */
function renderBoard(){
  const bw=document.getElementById("boardWrap"), bd=document.getElementById("board");
  bd.innerHTML="";
  const live=G.tiles.filter(t=>!t.dead&&!t.inTray);
  if(!live.length){ return; }
  const minX=Math.min(...live.map(t=>t.x)), maxX=Math.max(...live.map(t=>t.x));
  const minY=Math.min(...live.map(t=>t.y)), maxY=Math.max(...live.map(t=>t.y));
  const DZ=4;
  const W=(maxX-minX+1)*TW+18, H=(maxY-minY+1)*TH*0.82+TH*0.3+18;
  const availW=bw.clientWidth, availH=bw.clientHeight;
  if(availW<10||availH<10){ requestAnimationFrame(renderBoard); return; }
  // Tahta boş alanı doldursun: üst sınır 1.15 iken tahta ufacık kalıyordu.
  const scale=Math.min(availW/W, availH/H, 1.9)*0.98;
  bd.style.transform=`translate(-50%,-50%) scale(${scale})`;
  bd.style.width=W+"px"; bd.style.height=H+"px";

  // B4: yigin icindeki en ust katman referans alinir; alt katmanlar kucuk+sonuk
  const maxZ=Math.max(...live.map(t=>t.z));
  live.sort((a,b)=>a.z-b.z||a.y-b.y||a.x-b.x).forEach(tl=>{
    const d=document.createElement("div");
    d.className="tile"; d.dataset.i=tl.i;
    // dep: 0 = en alt katman, 1 = en ust katman
    const dep = maxZ>0 ? tl.z/maxZ : 1;
    d.style.setProperty("--dep", dep.toFixed(3));
    d.style.setProperty("--dsc", (0.955+dep*0.065).toFixed(4)); // %6.5 buyume araligi
    d.style.setProperty("--dsh", (3+dep*5).toFixed(1)+"px");    // 3px -> 8px golge
    d.style.width=(TW-3)+"px"; d.style.height=(TH-3)+"px";
    d.style.left=((tl.x-minX)*TW+tl.z*DZ+8)+"px";
    d.style.top =((tl.y-minY)*TH*0.82-tl.z*DZ+8)+"px";
    d.style.zIndex=tl.z*200+Math.round(tl.y*10);
    d.innerHTML=faceSVG(tl.face);
    if(!isFree(tl)) d.classList.add("locked"); else d.classList.add("free");
    d.onclick=()=>pickTile(tl.i);
    bd.appendChild(d);
  });
}
const elOf=i=>document.querySelector(`.tile[data-i="${i}"]`);
function isFree(tl){
  const live=G.tiles.filter(x=>!x.dead&&!x.inTray);
  return freeIn(live,tl);
}

/* ---------- Taş seçimi ---------- */
function pickTile(i){
  if(!G||G.busy||G.over) return;
  const tl=G.tiles[i];
  if(!tl||tl.dead||tl.inTray) return;
  // B2: ret durumu — kilitli tasa veya dolu tepsiye dokununca tas titrer
  if(!isFree(tl) || G.tray.length>=G.traySize){
    SFX.deny();
    const bad=elOf(i);
    if(bad){ bad.classList.remove("nope"); void bad.offsetWidth; bad.classList.add("nope");
             setTimeout(()=>bad.classList.remove("nope"),300); }
    return;
  }
  SFX.pick();

  if(G.seen.has(tl.face.id)) G.revisits++;
  G.seen.add(tl.face.id);

  G.busy=true;
  G.history.push({i, trayBefore:G.tray.map(x=>x.i)});
  if(G.history.length>12) G.history.shift();

  tl.inTray=true;
  // aynı yüzden olanların hemen sağına ekle (yan yana dizilim)
  let ins=G.tray.length;
  for(let k=G.tray.length-1;k>=0;k--){
    if(G.tray[k].face.id===tl.face.id){ ins=k+1; break; }
  }
  G.tray.splice(ins,0,tl);

  const el=elOf(i);
  if(el){
    const pos=fxPos(el);
    // B2: once secili hali (altin hale) bir kare gorunur, sonra tepsiye ucar
    el.classList.remove("free"); el.classList.add("sel");
    fxSpawn(pos.x,pos.y,faceElement(tl.face),0.32);
    setTimeout(()=>{ el.classList.remove("sel"); el.classList.add("pick"); },80);
  }
  /* TEPKI SURESI — olculdu: eskiden tasa basmakla tepside gormek arasinda
     273-354ms geciyordu (4x yavaslatilmis CPU, Sv20-100). Oyun hissiyatinda
     100ms ustu "kasma" olarak algilanir; kullanici da "kasiyor" dedi.

     Iki sebep vardi:
       1) Tepsi 170ms BEKLETILIYORDU. Oysa tas zaten G.tray'e eklendi -
          tepsiyi hemen cizmemek icin hicbir sebep yok.
       2) renderBoard() TUM tahtayi DOM'dan sifirdan kuruyordu (Sv60'ta
          105 tas x SVG = 57ms). Halbuki tek bir tas kalkiyor; degisen
          sadece o tasin komsularinin kilit durumu.

     Cozum: tepsi ANINDA cizilir, tahta ise yeniden kurulmaz - sadece
     "free/locked" siniflari guncellenir (refreshLocks). DOM korunur,
     tarayici yeniden yerlesim yapmaz. */
  renderTray();                       // tepsi: bekleme yok
  requestAnimationFrame(()=>{
    const e2=elOf(i); if(e2) e2.remove();   // secilen tas tahtadan kalkar
    refreshLocks();                          // komsularin kilidi tazelenir
    checkMatch();
  });
}

/* Tahtayi yeniden KURMADAN kilit durumlarini tazele.
   renderBoard() tam yeniden cizim yapiyordu (Sv100'de ~51ms + reflow);
   burada sadece iki sinif degisiyor, DOM ayni kaliyor. */
function refreshLocks(){
  if(!G) return;
  const live=G.tiles.filter(t=>!t.dead&&!t.inTray);
  for(const tl of live){
    const e=elOf(tl.i); if(!e) continue;
    const free=freeIn(live,tl);
    e.classList.toggle("free",free);
    e.classList.toggle("locked",!free);
  }
}

function checkMatch(){
  // ardışık MATCH_N aynı yüz var mı
  let hit=-1;
  for(let k=0;k+MATCH_N<=G.tray.length;k++){
    let same=true;
    for(let j=1;j<MATCH_N;j++) if(G.tray[k+j].face.id!==G.tray[k].face.id){ same=false; break; }
    if(same){ hit=k; break; }
  }
  if(hit<0){
    // Zincir penceresi: eslesme yoksa combo HEMEN sifirlanmaz.
    // Oyuncu uclu kurmak icin arada eslesmesiz tas secmek zorunda.
    if(G.combo>0 && Date.now()-(G.lastMatchAt||0) > CHAIN_MS) G.combo=0;
    G.busy=false;
    // Tepsi kritik doluluga geldi: Dem sakinlestirir
    if(G.tray.length===G.traySize-1) shout("trayFull");
    if(G.tray.length>=G.traySize){ clearInterval(timerId); endLevel(false,"full"); }
    return;
  }
  // Zincir: onceki eslesmeden bu yana CHAIN_MS gecmediyse zincir buyur
  if(Date.now()-(G.lastMatchAt||0) > CHAIN_MS) G.combo=0;
  G.lastMatchAt=Date.now();
  G.ok++; G.combo++; G.bestCombo=Math.max(G.bestCombo,G.combo);
  SFX.match(G.combo);
  const gone=G.tray.splice(hit,MATCH_N);
  const elem=faceElement(gone[0].face);
  gone.forEach((tl,gi)=>{
    tl.dead=true;
    const e=document.querySelector(`.ttile[data-tt="${tl.i}"]`);
    if(e){
      const pos=fxPos(e);
      // kombo yükseldikçe patlama güçlenir
      setTimeout(()=>fxSpawn(pos.x,pos.y,elem,1+Math.min(G.combo,5)*0.16), gi*45);
      e.classList.add("boom"); setTimeout(()=>e.remove(),220);
    }
  });
  const anchor=document.querySelector(".ttile");
  popFx(anchor||document.getElementById("tray"), G.combo>1?`${t("combo")} x${G.combo}`:"+1");

  /* ---- RUHLAR TEPKI VERIYOR ----
     Kombo yukseldikce ruhlar bagiriyor ve Yel ZAMANI DONDURUYOR.
     Kullanicinin fikri: "combo olunca zaman onemsizlesiyor gibi".
     Mekanige cevrildi: 3'lu kombo = 3sn, 5'li = 6sn zaman durur.
     Odul sure EKLEMEK degil DONDURMAK - boylece oyuncu panige degil
     akisa giriyor, ve ekranda "ZAMAN DONDU" yazisi bir olay gibi patliyor. */
  if(G.combo>=5)      { shout("combo5"); freezeTime(6); }
  else if(G.combo===3){ shout("combo3"); freezeTime(3); }
  else if(G.combo===2){ shout("combo2"); }

  // Son taslar: Kaya cesaret veriyor
  const kalanT=G.tiles.filter(x=>!x.dead).length;
  if(kalanT===MATCH_N*2) shout("lastFew");

  // 2. ucluden sonra ve tahtanin yarisinda hikaye hedefi fisildanir
  if(G.ok===2 || G.ok===Math.floor(G.tiles.length/MATCH_N/2)) questWhisper();
  /* Tepsi hemen sikisir (bosluk birakmaz), zincir kontrolu patlama
     animasyonu bitince. Eskiden ikisi de 170ms bekliyordu ve oyuncu
     tepside bir sure "hayalet bosluk" goruyordu. */
  renderTray();
  refreshLocks();                      // altta kalan taslar acildi mi?
  setTimeout(()=>{
    if(G.tiles.every(x=>x.dead)){ clearInterval(timerId); endLevel(true); return; }
    checkMatch();                      // zincirleme patlama
  },190);
}

function popFx(node,txt){
  if(!node) return;
  const wrap=document.getElementById("fx"), r=node.getBoundingClientRect(),
        w=wrap.getBoundingClientRect();
  const s=document.createElement("div"); s.className="pop"; s.textContent=txt;
  s.style.left=(r.left-w.left+r.width/2-20)+"px";
  s.style.top=(r.top-w.top+6)+"px";
  wrap.appendChild(s); setTimeout(()=>s.remove(),800);
}

/* ---------- Araçlar ---------- */
document.getElementById("bHint").onclick=()=>{
  if(!G||G.busy||G.over) return;
  if(G.hints>=G.hintMax){ sayToast(t("hintNone")); return; }
  // tepside olanla eşleşen serbest taş, yoksa en çok tekrar eden serbest yüz
  const live=G.tiles.filter(x=>!x.dead&&!x.inTray);
  const free=live.filter(x=>freeIn(live,x));
  let target=null;
  for(const tt of G.tray){ const m=free.find(f=>f.face.id===tt.face.id); if(m){ target=m; break; } }
  if(!target){
    const cnt={}; free.forEach(f=>cnt[f.face.id]=(cnt[f.face.id]||0)+1);
    const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    if(best) target=free.find(f=>f.face.id===best[0]);
  }
  if(!target) return;
  G.hints++; shout("hint");
  free.filter(f=>f.face.id===target.face.id).slice(0,3).forEach(f=>{
    const e=elOf(f.i); if(e){ e.classList.add("hintme"); setTimeout(()=>e.classList.remove("hintme"),1600); }
  });
  updateHUD();
};
document.getElementById("bUndo").onclick=()=>{
  if(!G||G.busy||G.over||!G.history.length) return;
  if(G.undos>=G.undoMax){ sayToast(t("undoNone")); return; }
  const h=G.history.pop();
  const tl=G.tiles[h.i];
  if(!tl||!tl.inTray) return;
  G.undos++;
  tl.inTray=false;
  G.tray=G.tray.filter(x=>x.i!==tl.i);
  renderBoard(); renderTray(); updateHUD();
};
document.getElementById("bQuit").onclick=()=>{ clearInterval(timerId); save(); show("s-splash"); refreshSplash(); };

/* ==================================================================
   BILGELIK KARTI — ekran goruntusu alinasi an
   ------------------------------------------------------------------
   Soz kucuk bir satirda gecerse kimse paylasmaz. Tam ekran, koruyucu
   renginde, imzali bir kart olarak sunulur; altinda "Paylas" var.
   Oyuncu SS alip story atsin diye tasarlandi: marka adi kartin
   uzerinde, boylece paylasilan her kare bir reklamdir.
   ================================================================== */
function showWisdom(spId){
  const sp=SPIRITS[spId]||SPIRITS[S.spirit]||SPIRITS.fire;
  const w=pickWisdom(sp.id); save();
  const col=SP_COL[sp.id]||"#ffcf5c";
  const txt=(w[L]||w.tr);
  const el=document.getElementById("wisdom");
  el.innerHTML=`<div class="wCard" style="--wc:${col}">
      <div class="wGlow"></div>
      <img class="wFace" src="${sp.img}" alt="">
      <div class="wWho">${sp.icon} ${sp.name}</div>
      <div class="wQuote${txt.length>150?" xlong":txt.length>90?" long":""}">${txt}</div>
      <div class="wSign">STONEBREAKING</div>
      <button class="btn wide" id="wShare">${t("wShare")}</button>
      <button class="btn sec wide" id="wClose">${t("wClose")}</button>
    </div>`;
  el.classList.add("on");
  try{ SFX.pick&&SFX.pick(); }catch(e){}
  document.getElementById("wClose").onclick=()=>{ el.classList.remove("on"); };

function endLevel(won,reason){
  if(G.over) return;
  G.over=true; G.busy=true;
  if(won) SFX.win(); else SFX.lose();
  /* Sinav ayri yoldan bitirilir: seviye ilerlemez, Chi bozulmaz,
     hikaye tetiklenmez. Sadece olcum alinir. */
  if(G.exam){ clearInterval(timerId); finishExam(won,reason); return; }
  const n=G.level, p=triplesOf(n), used=(Date.now()-G.t0)/1000;
  const before=chiTotal(S.chi);
  const r={ speed:rSpeed(used,G.par), logic:rLogic(G.ok,G.bad),
            memory:rMemory(G.hints,G.hintMax,G.revisits,p),
            pattern:rPattern(G.bestCombo,p,G.undos,G.undoMax) };
  if(!won) for(const k in r) r[k]*=0.55;
  S.sessions++;
  const fb=familyBonusActive()?1.10:1.0;      // Aile Bonusu: +%10
  for(const k in r) S.chi[k]=updateChi(S.chi[k],n,Math.min(1,r[k]*fb),S.sessions);
  const after=chiTotal(S.chi);
  S.peak=Math.max(S.peak,after);
  const rankBefore=rankIndex(S.level);
  if(won){ S.cleared++; S.level++;   // Sv100 sonrasi sonsuz mod
           S.best=Math.max(S.best||0,G.level); }
  else if(MODE().energy) S.lives=Math.max(0,S.lives-1);
  const rankedUp = won && rankIndex(S.level)>rankBefore;
  save();
  // D4: hak edilmişse önce kırılma, sonra sahne, sonra sonuç ekranı
  const ratio = (G.par>0 && !G.noTimer) ? Math.max(0,G.left)/G.par : 0;
  const lvlDone = G.level;
  const finish = ()=>showResult(won,after-before,reason,rankedUp);
  // Sahne: yalnizca KAZANINCA ve o seviyenin sahnesi henuz gorulmediyse
  const withScene = (won && sceneAt(lvlDone) && !seenScenes().includes(lvlDone))
      ? (()=>playScene(lvlDone, finish))
      : finish;
  if(won && shDeserved(G.level,rankedUp,ratio)){
    shatter(withScene);
  } else {
    withScene();
  }
}
function showResult(won,delta,reason,rankedUp){
  const md=MODE();
  const o=chiToIQ(chiTotal(S.chi),S.sessions);
  const dcls=delta>=0?"up":"down", dtxt=(delta>=0?"+":"")+delta.toFixed(0);
  const evolve = rankedUp ? `<div class="card evo">
      <div class="muted" style="font-size:12px">${t("rankUp")}</div>
      <img src="${heroOf(S)}" class="evoImg" alt="">
      <b style="color:var(--gold);font-size:16px">${rankOf(S.level)}</b></div>` : "";
  /* ---- HIKAYE KANCASI ----
     Her sonuc ekraninda oyuncu bir sonraki perdeye ne kadar kaldigini gorur.
     Bu tek kart, "bir el daha" dongusunun motoru: kapatmadan once
     oyuncuya HER ZAMAN yarim kalmis bir sey birakir. */
  // Su anki seviyede henuz izlenmemis bir perde var mi? (Sv9 -> Sv10 anı)
  const pend=actAt(S.level);
  const ready=!!(pend && !seenActs().includes(pend.act));
  const tgt = ready ? S.level : nextActLevel(S.level);
  const from = ready ? Math.max(1,tgt-STORY_STEP) : prevActLevel(S.level);
  const prog=ready?100:(tgt>from?clamp((S.level-from)/(tgt-from)*100,3,100):100);
  const kalan=Math.max(0,tgt-S.level);
  // Efsane tamamen bittiyse kanca yerine kapanis rozeti gosterilir
  const allSeen = STORY.every(a=>seenActs().includes(a.act));
  const tease = allSeen
    ? `<div class="card storyTease ready" style="padding:12px">
        <div class="stLock">✦</div>
        <b style="color:var(--gold);font-size:14px">${t("stAllDone")}</b>
        <div class="muted" style="font-size:12px;margin-top:3px">${t("stAllDoneSub")}</div>

          onclick="closeModal();playAll(0)">${t("diaryAll")}</button>
      </div>`
    : `<div class="card storyTease ${ready?"ready":""}" style="padding:12px">
      <div class="stLock">${ready?"🔓":"📜"}</div>
      <b style="color:var(--gold);font-size:14px">${ready?t("stReady"):t("stLocked")}</b>
      <div class="muted" style="font-size:12px;margin-top:3px">

      <div class="stBar"><i style="width:${prog}%"></i></div>
    </div>`;

  /* ---- MEYDAN OKUMA SONUCU ---- */
  let duelBox="";
  if(DUEL && won){
    const my=duelScore(G);
    const win=my>DUEL.score;
    duelBox=`<div class="card" style="border-color:${win?"var(--ok)":"var(--bad)"};
        background:linear-gradient(135deg,${win?"rgba(80,220,140,.14)":"rgba(255,95,109,.12)"},rgba(120,80,200,.10))">
      <b style="color:${win?"var(--ok)":"var(--bad)"};font-size:15px">
        ${win?t("duWon"):t("duLost")}</b>
      <div style="display:flex;gap:10px;margin-top:8px;font-size:13px">
        <div style="flex:1;text-align:center">
          <div class="muted" style="font-size:11px">${S.name}</div>
          <b style="font-size:20px;color:var(--gold)">${my}</b></div>
        <div style="align-self:center;opacity:.5">vs</div>
        <div style="flex:1;text-align:center">
          <div class="muted" style="font-size:11px">${DUEL.name}</div>
          <b style="font-size:20px">${DUEL.score}</b></div>
      </div></div>`;
    DUEL=null;                       // tek seferlik
  }
  const duelBtn = won ? `<button class="btn sec wide" style="margin-top:6px"
      onclick="closeModal();showChallengeCreate()">⚔️ ${t("duMake")}</button>` : "";

  const cert = won && S.cleared%5===0
    ? `<div class="card" style="border-color:var(--gold)"><b style="color:var(--gold)">${t("cert")}</b>
       <div class="muted">${t("certTxt")}</div></div>` : "";
  const bar=(k,cls,label)=>{
    const v=S.chi[k], pct=clamp((v-CHI_MIN)/(CHI_MAX-CHI_MIN)*100,2,100);
    return `<div class="dim"><div class="row"><span>${label}</span><span class="sp"></span>
      <b>${Math.round(v)}</b></div><div class="bar ${cls}"><i style="width:${pct}%"></i></div></div>`;
  };
  const title = won ? t("win") : (reason==="full" ? t("full") : t("lose"));
  const sub   = (!won&&reason==="full") ? `<div class="muted">${t("fullTxt")}</div>` : "";
  modal(`

    ${(()=>{ const pl=prideLine(S); return `<div class="card" style="padding:11px;
        border-color:${pl.col}55;background:linear-gradient(135deg,${pl.col}22,rgba(120,80,200,.10))">
        <div style="font-size:26px;line-height:1">${pl.icon}</div>
        <b style="color:${pl.col};font-size:14.5px">${pl.title}</b>
        <div class="muted" style="font-size:12px;margin-top:2px">${pl.sub}</div>
      </div>`; })()}
    <div style="margin:14px 0">
      ${bar("speed","fire","🔥 "+t("speed"))}

        : `±${o.ci.toFixed(0)} ${t("conf")} · ${t("reliab")} %${(o.rho*100).toFixed(0)} · ${S.sessions} ${t("sessions")}`}</div>
    </div>
    <div class="iqnote">${t("iqNote")}<br>${t("moreGames")}</div>` : ""}
    ${familyBonusActive()?`<div class="muted" style="color:var(--ok);font-size:12px;margin-top:8px">
      👨‍👩‍👧 ${t("famBonus")}</div>`:""}
    <div style="margin-top:14px">
      ${won ? `<button class="btn wide" onclick="closeModal();startLevelStoried()">${t("next")}</button>`

}

/* ==================================================================
   B5 — ELEMENT BAZLI PATLAMA EFEKTLERİ
   Canvas parçacık motoru. Her element kendi fiziğiyle patlar:
   ateş yükselir, su düşer, toprak savrulur, hava sarmal çizer.
   ================================================================== */
const FX_COL={
  fire :{a:"#ffe6a8", b:"#ff7a2b", c:"#d0341c"},
  water:{a:"#d6f3ff", b:"#3fa9e8", c:"#1a5f9e"},
  earth:{a:"#dff0a8", b:"#5cb85c", c:"#1e7a4f"},
  air  :{a:"#ffffff", b:"#dfe4ff", c:"#8b7dd8"}
};
/* Her taş yüzü bir elemente bağlanır (renk uyumu SVG ile aynı) */
function faceElement(f){
  if(!f) return "air";
  if(f.k==="el")  return f.e;
  if(f.k==="dot") return "water";   // yildiz takimyildizlari (mavi)
  if(f.k==="stk") return "earth";   // run glifleri (yesil)
  if(f.k==="num") return "fire";    // rakam kartuslari (kirmizi)
  return "air";                     // muhur kalkanlari (mor)
}
const FX={cv:null,ctx:null,p:[],raf:0,last:0,dpr:1,slow:false};
function fxInit(){
  FX.cv=document.getElementById("fxCanvas");
  if(!FX.cv) return;
  FX.ctx=FX.cv.getContext("2d");
  try{ FX.slow=window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  fxResize();
}
function fxResize(){
  if(!FX.cv) return;
  const app=document.getElementById("app");
  FX.dpr=Math.min(window.devicePixelRatio||1, 2);
  FX.cv.width=app.clientWidth*FX.dpr;
  FX.cv.height=app.clientHeight*FX.dpr;
  FX.cv.style.width=app.clientWidth+"px";
  FX.cv.style.height=app.clientHeight+"px";
}
/* Ekran koordinatını #app içine çevir */
function fxPos(node){
  const app=document.getElementById("app").getBoundingClientRect();
  const r=node.getBoundingClientRect();
  return {x:r.left-app.left+r.width/2, y:r.top-app.top+r.height/2};
}
function fxSpawn(x,y,elem,power){
  if(!FX.ctx) return;
  const col=FX_COL[elem]||FX_COL.air;
  const N=Math.round((FX.slow?7:18)*(power||1));
  const R=()=>Math.random();

  /* şok dalgası — her elementte var, rengi değişir */
  FX.p.push({t:"ring",x,y,r:6,vr:170,life:.45,age:0,col:col.b});

  for(let i=0;i<N;i++){
    const base={x,y,age:0,col1:col.a,col2:col.b,col3:col.c};
    if(elem==="fire"){
      const a=-Math.PI/2+(R()-.5)*1.9, sp=40+R()*130;
      FX.p.push({...base,t:"ember",vx:Math.cos(a)*sp*.55,vy:Math.sin(a)*sp-40-R()*70,
        g:-40,size:2+R()*3.4,life:.55+R()*.45,spin:R()*6});
    } else if(elem==="water"){
      const a=R()*Math.PI*2, sp=50+R()*150;
      FX.p.push({...base,t:"drop",vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-90,
        g:520,size:1.8+R()*2.8,life:.5+R()*.4});
    } else if(elem==="earth"){
      const a=R()*Math.PI*2, sp=60+R()*160;
      FX.p.push({...base,t:"rock",vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-70,
        g:600,size:2.4+R()*3.6,life:.55+R()*.4,rot:R()*6.28,vrot:(R()-.5)*14});
    } else {
      const a=R()*Math.PI*2;
      FX.p.push({...base,t:"wisp",ang:a,rad:4+R()*10,vrad:70+R()*110,
        vang:(R()<.5?-1:1)*(2.2+R()*3),size:1.4+R()*2.4,life:.55+R()*.45});
    }
  }
  if(!FX.raf){ FX.last=performance.now(); FX.raf=requestAnimationFrame(fxTick); }
}
function fxTick(now){
  const ctx=FX.ctx; if(!ctx){ FX.raf=0; return; }
  let dt=(now-FX.last)/1000; FX.last=now;
  if(dt>0.05) dt=0.05;
  ctx.setTransform(FX.dpr,0,0,FX.dpr,0,0);
  ctx.clearRect(0,0,FX.cv.width,FX.cv.height);

  for(let i=FX.p.length-1;i>=0;i--){
    const p=FX.p[i];
    p.age+=dt;
    const k=p.age/p.life;
    if(k>=1){ FX.p.splice(i,1); continue; }
    const fade=1-k;

    if(p.t==="ring"){
      p.r+=p.vr*dt;
      ctx.globalCompositeOperation="lighter";
      ctx.globalAlpha=fade*.5;
      ctx.strokeStyle=p.col; ctx.lineWidth=3*fade+.6;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832); ctx.stroke();
      continue;
    }
    if(p.t==="ember"){
      p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
      const s=p.size*(1-k*.7), fl=.72+Math.sin(p.age*22+p.spin)*.28;
      ctx.globalCompositeOperation="lighter";
      ctx.globalAlpha=fade*fl;
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,s*3.4);
      g.addColorStop(0,p.col1); g.addColorStop(.4,p.col2);
      g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,s*3.4,0,6.2832); ctx.fill();
      continue;
    }
    if(p.t==="drop"){
      p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
      const sp=Math.hypot(p.vx,p.vy), st=Math.min(2.6,1+sp/260);
      ctx.globalCompositeOperation="source-over";
      ctx.globalAlpha=fade*.92;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(Math.atan2(p.vy,p.vx));
      const g=ctx.createLinearGradient(-p.size*st,0,p.size*st,0);
      g.addColorStop(0,p.col3); g.addColorStop(.5,p.col2); g.addColorStop(1,p.col1);
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.ellipse(0,0,p.size*st,p.size*.85,0,0,6.2832); ctx.fill();
      ctx.restore();
      continue;
    }
    if(p.t==="rock"){
      p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vrot*dt;
      ctx.globalCompositeOperation="source-over";
      ctx.globalAlpha=fade;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      const s=p.size;
      ctx.fillStyle=p.col2;
      ctx.beginPath();                     // düzensiz kaya çokgeni
      ctx.moveTo(-s, -s*.55);
      ctx.lineTo(-s*.15, -s);
      ctx.lineTo(s*.85, -s*.5);
      ctx.lineTo(s, s*.45);
      ctx.lineTo(s*.1, s);
      ctx.lineTo(-s*.9, s*.5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle=p.col1; ctx.globalAlpha=fade*.5;   // üst yüz ışığı
      ctx.beginPath();
      ctx.moveTo(-s,-s*.55); ctx.lineTo(-s*.15,-s);
      ctx.lineTo(s*.85,-s*.5); ctx.lineTo(-s*.2,-s*.2);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      continue;
    }
    /* wisp — hava: sarmal */
    p.ang+=p.vang*dt; p.rad+=p.vrad*dt;
    const wx=p.x+Math.cos(p.ang)*p.rad, wy=p.y+Math.sin(p.ang)*p.rad-p.age*26;
    ctx.globalCompositeOperation="lighter";
    ctx.globalAlpha=fade*.75;
    ctx.strokeStyle=p.col2; ctx.lineWidth=p.size*fade+.5; ctx.lineCap="round";
    ctx.beginPath();
    ctx.arc(p.x,p.y-p.age*26,p.rad,p.ang-.5,p.ang);
    ctx.stroke();
    ctx.globalAlpha=fade; ctx.fillStyle=p.col1;
    ctx.beginPath(); ctx.arc(wx,wy,p.size*.55*fade,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
  FX.raf = FX.p.length ? requestAnimationFrame(fxTick) : 0;
}


/* ==================================================================
   D4 — KIRILMA ANI
   Zor bir seviyeyi bitirince ekran cam gibi çatlar, kırıklar düşer
   ve arkadan araf görünür. Oyunun en güçlü ödül anı.
   ================================================================== */
const SH={cv:null,ctx:null,raf:0,shards:[],cracks:[],t0:0,dpr:1,on:false};

function shInit(){
  SH.cv=document.getElementById("shatterCv");
  if(!SH.cv) return;
  SH.ctx=SH.cv.getContext("2d");
}
function shResize(){
  if(!SH.cv) return;
  const app=document.getElementById("app");
  SH.dpr=Math.min(window.devicePixelRatio||1,2);
  SH.cv.width=app.clientWidth*SH.dpr;
  SH.cv.height=app.clientHeight*SH.dpr;
  SH.cv.style.width=app.clientWidth+"px";
  SH.cv.style.height=app.clientHeight+"px";
}
/* Kırılma hak edildi mi?
   Her 10. seviye, rütbe atlama, ya da süresinin %25'inden azıyla bitirme. */
function shDeserved(lvl,rankedUp,timeLeftRatio){
  return rankedUp || lvl%10===0 || (timeLeftRatio>0 && timeLeftRatio<0.25);
}
function shatter(cb){
  if(!SH.ctx){ cb&&cb(); return; }
  shResize();
  const W=SH.cv.width/SH.dpr, H=SH.cv.height/SH.dpr;
  const cx=W*0.5, cy=H*0.42;
  SH.shards=[]; SH.cracks=[];

  /* Merkezden dışa ışınsal çatlaklar */
  const rays=13, R=Math.hypot(W,H);
  const angs=[];
  for(let i=0;i<rays;i++) angs.push(i/rays*6.2832 + (Math.random()-0.5)*0.28);

  angs.forEach(a=>{
    const pts=[{x:cx,y:cy}];
    let d=0, ang=a;
    while(d<R){
      d += R*0.13*(0.6+Math.random()*0.8);
      ang += (Math.random()-0.5)*0.22;      // zikzak
      pts.push({x:cx+Math.cos(ang)*d, y:cy+Math.sin(ang)*d});
    }
    SH.cracks.push(pts);
  });

  /* Işınlar arası parçalar (üçgen dilimler) */
  for(let i=0;i<rays;i++){
    const a1=angs[i], a2=angs[(i+1)%rays]+(i===rays-1?6.2832:0);
    const mid=(a1+a2)/2;
    SH.shards.push({
      a1,a2,cx,cy,R:R*1.05,
      vx:Math.cos(mid)*(70+Math.random()*130),
      vy:Math.sin(mid)*(70+Math.random()*130)+40,
      rot:0, vrot:(Math.random()-0.5)*1.5,
      x:0,y:0
    });
  }
  SH.on=true; SH.cv.classList.add("on");
  SH.t0=performance.now();
  SFX.shatter&&SFX.shatter();
  buzz([30,40,60]);
  if(SH.raf) cancelAnimationFrame(SH.raf);
  SH.raf=requestAnimationFrame(ts=>shTick(ts,cb));
}
function shTick(now,cb){
  const ctx=SH.ctx; if(!ctx){ cb&&cb(); return; }
  const el=(now-SH.t0)/1000;
  const W=SH.cv.width/SH.dpr, H=SH.cv.height/SH.dpr;
  ctx.setTransform(SH.dpr,0,0,SH.dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const PH1=0.42;                       // çatlama süresi
  const PH2=1.35;                       // düşme süresi

  if(el<PH1){
    /* Faz 1: çatlaklar yayılıyor */
    const k=el/PH1;
    /* ekran kararır — kırılma hissini güçlendirir */
    ctx.globalAlpha=1;
    ctx.fillStyle=`rgba(8,5,22,${0.34*k})`; ctx.fillRect(0,0,W,H);
    /* kalın koyu gölge çatlak */
    ctx.strokeStyle="rgba(6,4,18,.75)";
    ctx.lineWidth=7; ctx.lineCap="round"; ctx.lineJoin="round";
    SH.cracks.forEach(pts=>{
      const n=Math.max(2,Math.floor(pts.length*k));
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      for(let i=1;i<n;i++) ctx.lineTo(pts[i].x,pts[i].y);
      ctx.stroke();
    });
    /* parlak cam kenarı */
    ctx.strokeStyle="rgba(255,255,255,.96)";
    ctx.lineWidth=3.2;
    ctx.shadowColor="#bfe0ff"; ctx.shadowBlur=16;
    SH.cracks.forEach(pts=>{
      const n=Math.max(2,Math.floor(pts.length*k));
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      for(let i=1;i<n;i++) ctx.lineTo(pts[i].x,pts[i].y);
      ctx.stroke();
    });
    ctx.shadowBlur=0;
    /* merkez parlaması */
    const g=ctx.createRadialGradient(W*0.5,H*0.42,0,W*0.5,H*0.42,90*k+20);
    g.addColorStop(0,`rgba(255,255,255,${0.75*(1-k)})`);
    g.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    SH.raf=requestAnimationFrame(ts=>shTick(ts,cb));
    return;
  }

  if(el<PH1+PH2){
    /* Faz 2: parçalar düşüyor, arkadan uzay görünüyor */
    const k=(el-PH1)/PH2;
    if(k<0.14){                       // kırılma anı flaşı
      ctx.fillStyle=`rgba(255,255,255,${0.55*(1-k/0.14)})`;
      ctx.fillRect(0,0,W,H);
    }
    const ease=k*k;
    SH.shards.forEach(s=>{
      s.x=s.vx*ease*1.5;
      s.y=s.vy*ease*1.5 + 900*ease*ease;
      s.rot=s.vrot*ease*1.6;
      ctx.save();
      ctx.globalAlpha=Math.max(0,1-k*1.05);
      ctx.translate(s.cx+s.x, s.cy+s.y);
      ctx.rotate(s.rot);
      ctx.translate(-s.cx,-s.cy);
      ctx.beginPath();
      ctx.moveTo(s.cx,s.cy);
      ctx.arc(s.cx,s.cy,s.R,s.a1,s.a2);
      ctx.closePath();
      /* buzlu cam dilim */
      const lg=ctx.createLinearGradient(s.cx,s.cy,
        s.cx+Math.cos((s.a1+s.a2)/2)*s.R, s.cy+Math.sin((s.a1+s.a2)/2)*s.R);
      lg.addColorStop(0,"rgba(150,185,240,.62)");
      lg.addColorStop(.45,"rgba(70,95,175,.42)");
      lg.addColorStop(1,"rgba(20,14,48,.30)");
      ctx.fillStyle=lg; ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.lineWidth=2.4; ctx.stroke();
      ctx.restore();
    });
    SH.raf=requestAnimationFrame(ts=>shTick(ts,cb));
    return;
  }

  /* Bitti */
  ctx.clearRect(0,0,W,H);
  SH.cv.classList.remove("on"); SH.on=false; SH.raf=0;
  cb&&cb();
}

/* ==================================================================
   D1 — ZİHİN HARİTASI
   Chi skorun canlı bir takımyıldıza dönüşür. Dört kol = dört alt zeka.
   Oynadıkça yıldızlar büyür, birleşir; herkesin haritası kendine özgü.
   ================================================================== */
/* Renkler ELEMENT ANAYASASINA uyduruldu: kirmizi/mavi/yesil/BEYAZ.
   Onceki halde hava MORDU (#8b7dd8) ve toprak ikonu 🌍 idi -
   taslarla, ruh kartlariyla, kolyeyle celisiyordu. */
const MIND_DIMS=[
  {k:"speed",  col:"#ff4d2e", col2:"#ff9b6a", ico:"🔥", tk:"speed"},
  {k:"logic",  col:"#2f9bff", col2:"#7fc9ff", ico:"💧", tk:"logic"},
  {k:"memory", col:"#35c15e", col2:"#8fe0a3", ico:"🌿", tk:"memory"},
  {k:"pattern",col:"#e8eef5", col2:"#ffffff", ico:"🌀", tk:"pattern"}
];
/* Profilin kimliğinden sabit bir tohum: harita her açılışta aynı kalsın */
function mindSeed(p){
  let s=0; const str=(p.id||"x")+(p.name||"");
  for(let i=0;i<str.length;i++) s=(s*31+str.charCodeAt(i))>>>0;
  return s;
}
/* ==================================================================
   ZIHIN HARITASI — "Cekirdegin Yeniden Insasi"
   ------------------------------------------------------------------
   Kullanici: "zihin haritasi tam anlamiyla istedigim goruntu degil,
   oraya bir hikaye uyarlayalim."

   ESKI: soyut bir takimyildiz. Guzeldi ama hikayeyle bagi yoktu -
   oyuncu neye baktigini bilmiyordu.

   YENI: Perde I'de kirilan CEKIRDEGIN ta kendisi. Dort ruh cekirdegin
   etrafinda cember kurmustu; sen tas kirdikca o cember geri geliyor.
   - Dort element YAYI: her alt zekan bir yay. Chi yukseldikce yay
     uzuyor ve cemberi kapatmaya yaklasiyor.
   - CEMBER: dort yay birlesince tam daire olur = denge saglandi.
     Dengesiz oyuncunun cemberi kirik kalir - tema gorsel olarak anlatiliyor.
   - CEKIRDEK: ortadaki kure. Denge arttikca buyur ve parlar.
   - CATLAKLAR: eksik olan her yayin karsisinda cekirdekte catlak var.
   Boylece harita "ne kadar iyisin" degil "cemberi ne kadar onardin"
   sorusunu cevapliyor. Paylasilan sey de bu: bir onarim hikayesi.
   ================================================================== */
function drawMind(p,canvas){
  const ctx=canvas.getContext("2d");
  const W=canvas.width, H=canvas.height, cx=W/2, cy=H/2-10;
  const rnd=seededRand(mindSeed(p));
  ctx.clearRect(0,0,W,H);

  const norm=v=>clamp((v-CHI_MIN)/(CHI_MAX-CHI_MIN),0.04,1);
  const vals=MIND_DIMS.map(d=>norm(p.chi[d.k]));
  const avg=vals.reduce((a,b)=>a+b,0)/4;
  const mn=Math.min(...vals), mx=Math.max(...vals);
  const balance=mn/Math.max(mx,0.001);          // 1 = kusursuz denge
  const R=W*0.30;                                // cember yaricapi

  /* --- derin uzay zemini --- */
  const bgg=ctx.createRadialGradient(cx,cy,10,cx,cy,W*0.62);
  bgg.addColorStop(0,"rgba(70,46,140,.40)");
  bgg.addColorStop(.55,"rgba(24,16,54,.30)");
  bgg.addColorStop(1,"rgba(6,4,16,0)");
  ctx.fillStyle=bgg; ctx.fillRect(0,0,W,H);
  for(let i=0;i<200;i++){
    const x=rnd()*W,y=rnd()*H,r=rnd()*1.5+0.25;
    ctx.globalAlpha=.10+rnd()*.5; ctx.fillStyle=rnd()>.85?"#ffd9a0":"#dbe4ff";
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  /* --- kirik cember izi: onarilacak yolun hayaleti --- */
  ctx.strokeStyle="rgba(255,255,255,.13)"; ctx.lineWidth=2;
  ctx.setLineDash([5,9]);
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);

  /* --- dort element yayi --- */
  const QUAD=Math.PI/2, GAP=0.13;
  MIND_DIMS.forEach((d,i)=>{
    const n=norm(p.chi[d.k]);
    const a0=-Math.PI/2 + i*QUAD + GAP/2;
    const a1=a0 + (QUAD-GAP)*n;                  // Chi kadar uzayan yay

    // yayin ardindaki nebula parlamasi
    const midA=(a0+a1)/2, mx2=cx+Math.cos(midA)*R, my2=cy+Math.sin(midA)*R;
    const ng=ctx.createRadialGradient(mx2,my2,0,mx2,my2,R*0.55*n+14);
    ng.addColorStop(0,d.col+"66"); ng.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=ng; ctx.beginPath(); ctx.arc(mx2,my2,R*0.55*n+14,0,7); ctx.fill();

    // yay govdesi
    ctx.lineCap="round";
    ctx.strokeStyle=d.col; ctx.lineWidth=13;
    ctx.beginPath(); ctx.arc(cx,cy,R,a0,a1); ctx.stroke();
    ctx.strokeStyle=d.col2; ctx.lineWidth=4.5;
    ctx.beginPath(); ctx.arc(cx,cy,R,a0,a1); ctx.stroke();

    // yayin ucundaki element yildizi
    const ex=cx+Math.cos(a1)*R, ey=cy+Math.sin(a1)*R;
    const eg=ctx.createRadialGradient(ex,ey,0,ex,ey,16+n*14);
    eg.addColorStop(0,"#ffffff"); eg.addColorStop(.35,d.col2);
    eg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(ex,ey,16+n*14,0,7); ctx.fill();

    // eksik kalan pay: kirik cizgi (onarilmamis bolum)
    if(n<0.985){
      ctx.strokeStyle=d.col+"33"; ctx.lineWidth=6; ctx.setLineDash([3,8]);
      ctx.beginPath(); ctx.arc(cx,cy,R,a1,-Math.PI/2+(i+1)*QUAD-GAP/2); ctx.stroke();
      ctx.setLineDash([]);
    }

    // cekirdege giden enerji hatti
    ctx.strokeStyle=d.col+(n>0.5?"88":"44"); ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(ex,ey); ctx.stroke();

    // element simgesi
    const lx=cx+Math.cos(midA)*(R+34), ly=cy+Math.sin(midA)*(R+34);
    ctx.font="22px system-ui,sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.globalAlpha=.55+n*.45; ctx.fillText(d.ico,lx,ly); ctx.globalAlpha=1;
  });

  /* --- merkez cekirdek: denge arttikca butunlesir --- */
  const CR=26+avg*20;
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,CR*2.6);
  cg.addColorStop(0,"#ffffff");
  cg.addColorStop(.20,"#ffe9a8");
  cg.addColorStop(.45,`rgba(255,207,92,${.30+balance*.35})`);
  cg.addColorStop(1,"rgba(255,207,92,0)");
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(cx,cy,CR*2.6,0,7); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.94)"; ctx.beginPath(); ctx.arc(cx,cy,CR*0.86,0,7); ctx.fill();

  /* cekirdek catlaklari: denge dustukce derinlesir */
  const cracks=Math.round((1-balance)*5);
  if(cracks>0){
    ctx.strokeStyle=`rgba(60,40,20,${.25+(1-balance)*.45})`;
    ctx.lineWidth=1.6; ctx.lineCap="round";
    for(let c=0;c<cracks;c++){
      const a=rnd()*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(cx,cy);
      let px=cx,py=cy,ang=a;
      for(let seg=0;seg<3;seg++){
        ang+=(rnd()-0.5)*0.9;
        px+=Math.cos(ang)*CR*0.3; py+=Math.sin(ang)*CR*0.3;
        ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
  }

  const tot=chiTotal(p.chi);
  ctx.fillStyle="#1a1330"; ctx.font="bold 30px system-ui,sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(Math.round(tot), cx, cy+1);

  /* --- denge rozeti: haritanin hikayesi tek cumlede --- */
  const pct=Math.round(balance*100);
  const state = pct>=85 ? t("mindWhole") : pct>=60 ? t("mindMending") : t("mindBroken");
  ctx.font="600 15px system-ui,sans-serif";
  ctx.fillStyle= pct>=85 ? "#ffe9a8" : pct>=60 ? "#cfd6ff" : "#ff9a9a";
  ctx.fillText(`${state} · %${pct}`, cx, cy+R+72);

  /* --- imza --- */
  ctx.textBaseline="alphabetic";
  ctx.fillStyle="rgba(255,255,255,.92)"; ctx.font="bold 18px system-ui,sans-serif";
  ctx.fillText(`${p.name} · ${rankOf(p.level)}`, cx, H-42);
  ctx.fillStyle="rgba(255,207,92,.75)"; ctx.font="600 12px system-ui,sans-serif";
  ctx.fillText("STONEBREAKING", cx, H-22);
}

function renderMind(){
  const c=document.getElementById("mindCanvas");
  drawMind(S,c);
  const lg=document.getElementById("mindLegend"); lg.innerHTML="";
  MIND_DIMS.forEach(d=>{
    const el=document.createElement("div");
    el.innerHTML=`<i style="background:${d.col}"></i>${d.ico} ${t(d.tk)}<b>${Math.round(S.chi[d.k])}</b>`;
    lg.appendChild(el);
  });
}

/* Paylaşım: Web Share API varsa görseli paylaş, yoksa indir */
async function shareMind(){
  const c=document.getElementById("mindCanvas");
  const blob=await new Promise(r=>c.toBlob(r,"image/png"));
  if(!blob) return;
  const file=new File([blob],"stonebreaking-zihin-haritasi.png",{type:"image/png"});
  const txt=`${S.name} · ${rankOf(S.level)} · Chi ${Math.round(chiTotal(S.chi))} — STONEBREAKING`;

   ------------------------------------------------------------------
   KOLYE: on rutbenin HEPSINDE gogus y=%44, x=%50 cikti. Tek deger yeter.

   BT TASI: el konumu her gorselde farkli (x %1.4 ile %10 arasi, bazi

   tutarsizlik uretiyordu - kullanici "havada duruyor" dedi, haklıydı.

     - Hikayeye uygun: BT tasi bir esya degil, cagrilan bir guc
     - Yuzer animasyonu bu okumayi pekistirir
   ================================================================== */
const HERO_FIT={
  /* v3 (kullanici geri bildirimi): kolye %30 iken YUZU kapatiyordu,
     BT tasi %22 iken devasa duruyordu. Ikisi de kucultuldu:
     kolye gogse oturur (%17), tas omuz hizasinda suzulur (%14). */
  1:{amY:"47%", amW:"17%", btX:"11%", btY:"26%", btW:"14%"},
  2:{amY:"47%", amW:"17%", btX:"11%", btY:"26%", btW:"14%"},
  3:{amY:"46%", amW:"16%", btX:"10%", btY:"25%", btW:"13%"},
  4:{amY:"46%", amW:"16%", btX:"10%", btY:"25%", btW:"13%"},
  5:{amY:"45%", amW:"16%", btX:"10%", btY:"24%", btW:"13%"}
};
function heroFitFor(level){
  const r=rankIndex(level)+1;
  return HERO_FIT[Math.min(5,Math.max(1,r))]||HERO_FIT[1];
}
/* Kahramanin uzerine kolye + BT tasini bindir.
   Ayni fonksiyon ana menude, sahnede ve yolculuk kartinda kullanilir:
   tek kaynak, her yerde ayni gorunum. */
function paintHeroGear(wrap, level, scale){
  if(!wrap) return;
  wrap.querySelectorAll(".heroAmulet,.btTile").forEach(e=>e.remove());
  const f=heroFitFor(level||1);
  const k=scale||1;
  wrap.insertAdjacentHTML("beforeend", amuletSVG()+btTileSVG());
  const am=wrap.querySelector(".heroAmulet"), bt=wrap.querySelector(".btTile");
  if(am){ am.style.setProperty("--amY",f.amY);
          am.style.setProperty("--amW",(parseFloat(f.amW)*k)+"%"); }
  if(bt){ bt.style.setProperty("--btX",f.btX); bt.style.setProperty("--btY",f.btY);
          bt.style.setProperty("--btW",(parseFloat(f.btW)*k)+"%"); }
}

/* ==================================================================
   V3 — MEYDAN OKUMA (sunucusuz asenkron PvP)
   ------------------------------------------------------------------
   Kullanici PvP istedi. Canli es zamanli mac REDDEDILDI (sunucu
   maliyeti + eslestirme + cocuk guvenligi). Ama rekabet hissi
   sunucusuz da kurulabilir: AYNI TAHTA, farkli zaman.

   Nasil calisir:
     1) Oyuncu bir seviyeyi bitirir, "Meydan Oku" der
     2) Tahta tohumu + skoru bir KODA gomulur (base36)
     3) Kod WhatsApp'a gider
     4) Karsi taraf kodu yapistirir -> AYNI tahtayi oynar
     5) Bitince iki skor yan yana
   Sunucu yok, hesap yok, eslestirme yok. Maliyet: 0.

   Kod bicimi:  SB<seviye>-<tohum36>-<skor36>-<isim>
   ================================================================== */
function makeChallenge(level, seed, score, name){
  // Teknik alanlar buyuk harf (okunakli), isim DOKUNULMADAN gecer.
  // Tumune toUpperCase uygulamak Turkce karakteri bozuyordu: Ayşe -> AYşE
  const head=["SB"+level.toString(36),
              (seed>>>0).toString(36),
              Math.max(0,Math.round(score)).toString(36)].join("-").toUpperCase();
  return head+"-"+encodeURIComponent((name||"STONEBREAKING").slice(0,12));
}
function parseChallenge(code){
  try{
    const c=(code||"").trim().replace(/\s+/g,"");
    // Teknik alanlar buyuk/kucuk fark etmez; isim aynen korunur.
    const m=c.match(/^[Ss][Bb]([0-9A-Za-z]+)-([0-9A-Za-z]+)-([0-9A-Za-z]+)-(.+)$/);
    if(!m) return null;
    const level=parseInt(m[1].toLowerCase(),36), seed=parseInt(m[2].toLowerCase(),36),
          score=parseInt(m[3].toLowerCase(),36);
    if(!(level>0&&level<=MAX_LEVEL+500)||!isFinite(seed)||!isFinite(score)) return null;
    return {level, seed:seed>>>0, score, name:decodeURIComponent(m[4])};
  }catch(e){ return null; }
}
/* Meydan okuma skoru: sure + verimlilik + kombo. Chi'den bagimsiz,
   boylece dusuk seviyeli oyuncu da yuksek seviyeliyi yenebilir. */
function duelScore(g){
  if(!g) return 0;
  const used=Math.max(1,(Date.now()-g.t0)/1000);
  const par=Math.max(1,g.par||1);
  /* Hiz egrisi lojistik: par suresinde bitiren 0.50, yarisinda 0.85,
     ucte birinde 0.95. Dogrusal oran kullanildiginda bot anlik oynayip
     tavani (1000) hemen vuruyordu; egri tavani gercekten zorlastiriyor. */
  const speed=1/(1+Math.exp(-2.6*(par/used-1)));
  const acc=g.ok/Math.max(1,g.ok+g.bad);
  const combo=Math.min(1,(g.bestCombo||0)/8);
  const clean=1-Math.min(1,(g.hints+g.undos)/6);
  return Math.round(1000*(0.40*speed + 0.25*acc + 0.20*combo + 0.15*clean));
}

/* ==================================================================
   MEYDAN OKUMA v2 — link ile ac, ayni anda basla
   ------------------------------------------------------------------
   Kullanici: "meydan okuma yeri daha basit olsun ve baglantiyi
   tiklayinca iki kisi ayni anda baslasin, baslamaya su dakika kaldi gibi".

   ESKI AKIS (karmasik):  kod kopyala -> gonder -> karsi taraf oyunu ac
                          -> menu -> Meydan Okuma -> kodu yapistir -> oyna
   YENI AKIS (tek dokunus): linke tikla -> tahta hazir -> GERI SAYIM -> basla

   Randevu mantigi: kod uretilirken bir BASLANGIC ZAMANI gomulur
   (paylasim anindan +LOBBY_SEC saniye). Iki taraf da ayni damgayi
   okur, ayni saniyede baslar. Sunucu YOK - zaman damgasi koda gomulu,
   iki cihazin saati de gercek dunyaya bakiyor.

   Gec kalan icin: randevu gectiyse geri sayim atlanir, tahta hemen acilir
   (adalet skorla saglanir, tahta ayni cunku tohum ayni).
   ================================================================== */
const LOBBY_SEC=45;          // paylasimdan sonra kac saniyeye randevu

/* Kod + zaman damgasindan tam link uret */
function challengeLink(code, startAt){
  const base="https://stonebreaking.github.io/";
  return base+"#d="+encodeURIComponent(code)+(startAt?("&t="+startAt):"");
}
/* Adresteki #d=... parametresini oku */
function readChallengeHash(){
  try{
    const h=(location.hash||"").replace(/^#/,"");
    if(!h) return null;
    const q=new URLSearchParams(h);
    const code=q.get("d"); if(!code) return null;
    const t0=parseInt(q.get("t")||"0",10);
    return {code:decodeURIComponent(code), startAt:isFinite(t0)?t0:0};
  }catch(e){ return null; }
}
/* Geri sayim ekrani: iki oyuncu ayni saniyede baslasin */
function duelLobby(d, startAt){
  const el=document.getElementById("wisdom");   // tam ekran katmani yeniden kullaniliyor
  const paint=()=>{
    const kalan=Math.max(0,Math.ceil((startAt-Date.now())/1000));
    const dk=Math.floor(kalan/60), sn=kalan%60;
    const str=dk>0 ? `${dk}:${String(sn).padStart(2,"0")}` : `${sn}`;
    el.innerHTML=`<div class="wCard lobby" style="--wc:#ffcf5c">
        <div class="wGlow"></div>
        <div class="lbTag">⚔️ ${t("duLobbyTag")}</div>
        <div class="lbVs"><b>${S.name||"?"}</b><span>${t("duVsWord")}</span><b>${d.name}</b></div>
        <div class="lbNum">${str}</div>
        <div class="lbSub">${t("duLobbySub")}</div>
        <div class="lbInfo">${t("duLobbyLv").replace("{lv}",d.level)} · ${t("duLobbyScore").replace("{s}",d.score)}</div>
        <button class="btn sec wide" id="lbSkip">${t("duLobbySkip")}</button>
      </div>`;
    const sk=document.getElementById("lbSkip");
    if(sk) sk.onclick=()=>{ clearInterval(LOBBY.t); el.classList.remove("on"); launchDuel(d); };
    /* Son 3 saniye: her saniye vurus */
    if(kalan<=3 && kalan>0 && LOBBY.last!==kalan){ LOBBY.last=kalan; try{ drumHit(ac().currentTime,72,0.3,0.28); }catch(e){} }
    if(kalan<=0){ clearInterval(LOBBY.t); el.classList.remove("on");
                  try{ heroSting(); }catch(e){} launchDuel(d); }
  };
  el.classList.add("on");
  paint();
  clearInterval(LOBBY.t);
  LOBBY.t=setInterval(paint,250);
}
const LOBBY={t:null,last:-1};
function launchDuel(d){
  DUEL=d;
  S.level=d.level;
  startLevel(d.seed);
  toast(t("duVs").replace("{n}",d.name).replace("{s}",d.score));
}
/* Acilista adreste meydan okuma var mi? */
function checkChallengeHash(){
  const h=readChallengeHash(); if(!h) return false;
  const d=parseChallenge(h.code); if(!d) return false;
  history.replaceState(null,"",location.pathname);   // adres temizlensin
  if(!S || !S.spirit){                                // once profil/ruh sart
    PENDING_DUEL={d, startAt:h.startAt}; return false;
  }
  if(h.startAt && h.startAt>Date.now()+800) duelLobby(d,h.startAt);
  else launchDuel(d);
  return true;
}
let PENDING_DUEL=null;

async function shareChallenge(code){
  const startAt=Date.now()+LOBBY_SEC*1000;
  const link=challengeLink(code,startAt);
  const txt=t("duShareTxt").replace("{c}",link);

    if(navigator.share) await navigator.share({text:txt,title:"STONEBREAKING"});
    else { await navigator.clipboard.writeText(txt); toast(t("duCopied")); }
  }catch(e){ try{ await navigator.clipboard.writeText(txt); toast(t("duCopied")); }catch(_){} }
}

function makeChallengeNow(){
  const lv=Math.max(1,S.level-1);
  const seed=(G_LAST_SEED||Math.floor(Math.random()*1e9))>>>0;
  const code=makeChallenge(lv, seed, S.lastDuelScore||0, S.name);

function acceptChallenge(){
  const raw=(document.getElementById("duCode").value||"").trim();
  /* Link yapistirildiysa icinden kodu ve randevuyu cikar */
  let code=raw, startAt=0;
  const hm=raw.match(/[#?&]d=([^&\s]+)/);
  if(hm){
    code=decodeURIComponent(hm[1]);
    const tm=raw.match(/[#?&]t=(\d+)/);
    if(tm) startAt=parseInt(tm[1],10);
  }
  const d=parseChallenge(code);
  if(!d){ document.getElementById("duErr").textContent=t("duBad"); return; }
  closeModal();
  if(startAt && startAt>Date.now()+800) duelLobby(d,startAt);
