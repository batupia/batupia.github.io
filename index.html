<!-- MARKA FONTU — logonun firca dili
     Kullanici: "logo firca dili goz onunde bulundurarak olsun".
     Logomuz saintgreyhills tarzi firca imzasi. Basliklar sistem
     fontuyla yaziliyordu; logo ile ekran arasinda kopukluk vardi.
     'Caveat' firca kalemi hissi verir, Turkce karakterleri (ş ğ ı İ)
     TAM destekler - bu sart, cunku marka adimiz Taşkıran.
     display=swap: font inmezse yazi yine de gorunur, oyun beklemez. -->
<!-- Kendi fontumuz: harici baglanti YOK, 7 KB, cevrimdisi calisir -->
<style>
:root{
  --fire:#c0392b; --water:#1f6fb2; --earth:#1e7a4f; --air:#5b4a8a; --gold:#ffcf5c;
  --felt0:#0f5c4a; --felt1:#0a4438; --ink:#f4f1ff;
  --wood:#7a4a24; --wood2:#5c3418;
  --ok:#4ade80; --bad:#ff5f6d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:radial-gradient(ellipse at 50% 12%,#2a2150,#1d1838 45%,#131024);
  color:var(--ink);user-select:none;display:flex;align-items:center;justify-content:center;
}
@font-face{
  font-family:'STONEBREAKING';
  src:url('assets/font/stonebreaking.woff2') format('woff2'),
      url('assets/font/stonebreaking.woff') format('woff'),
      url('assets/font/stonebreaking.ttf') format('truetype');
  font-weight:400 700; font-style:normal; font-display:block;
  unicode-range: U+0020-007E, U+00C0-024F, U+1E00-1EFF, U+011E-011F, U+0130-0131, U+015E-015F, U+011E, U+00D6, U+00DC, U+00C7, U+011F, U+0130;
}
/* FIRCA DILI: yalniz BASLIKLAR ve marka adi.
   Govde metni sistem fontunda kalir - el yazisi uzun metinde
   okunabilirligi dusurur, bu da oyuncuyu yorar. Marka hissi
   basliklarda verilir, bilgi govdede net kalir. */
.brush,h2,#stTitle,.jHead,.jRank,#stChapter{
  font-family:'STONEBREAKING','Segoe UI Semibold',system-ui,sans-serif;
  letter-spacing:.8px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-variant-ligatures: none;
  transform: translateZ(0);
}
h2{font-size:27px;font-weight:700}
#stTitle{font-size:29px}
.jHead{font-size:19px}
.jRank{font-size:16px}
/* Fircada buyuk harf araligi genis durur */
#stChapter{font-size:13px;letter-spacing:2.2px}

#app{position:relative;width:100%;max-width:520px;height:100%;max-height:940px;
  display:flex;flex-direction:column;overflow:hidden}

.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:16px;
  overflow-y:auto;animation:fade .35s ease}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.btn{border:0;border-radius:16px;padding:14px 20px;font-size:16px;font-weight:700;
  color:#1a1330;cursor:pointer;font-family:inherit;
  background:linear-gradient(180deg,var(--gold),#f0a93c);
  box-shadow:0 5px 0 #b57a1e,0 8px 18px rgba(0,0,0,.45);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b57a1e}
.btn.sec{background:linear-gradient(180deg,#5b4fa8,#463a86);color:#fff;box-shadow:0 5px 0 #2e2560,0 8px 18px rgba(0,0,0,.4)}
.btn.sec:active{box-shadow:0 1px 0 #2e2560}
.btn.wide{width:100%;margin:6px 0}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  border-radius:18px;padding:14px;margin:8px 0}
h1,h2,h3{margin:6px 0}
.muted{opacity:.72;font-size:13px;line-height:1.5}
.center{text-align:center}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1}

#lang{position:absolute;top:10px;right:10px;z-index:70;display:flex;
  background:rgba(0,0,0,.45);border-radius:999px;padding:3px;border:1px solid rgba(255,255,255,.15)}
#lang button{border:0;background:none;color:#fff9;font-weight:700;font-size:12px;
  padding:6px 12px;border-radius:999px;cursor:pointer;font-family:inherit}
#lang button.on{background:var(--gold);color:#1a1330}
#sndBtn{position:absolute;top:10px;left:10px;z-index:70;border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.45);color:#fff;font-size:15px;width:36px;height:32px;
  border-radius:999px;cursor:pointer;line-height:1;padding:0}
#sndBtn.off{opacity:.45}

/* ---------- Sinematik uzay/araf ekranlari ---------- */
.screen.cosmic{background:url("assets/bg_cosmos.jpg") center/cover no-repeat;
  padding:0;align-items:center;justify-content:center}
.screen.cosmic .veil{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,rgba(10,6,30,0) 35%,rgba(10,6,30,.72) 100%),
             linear-gradient(180deg,rgba(10,6,30,.82) 0%,rgba(10,6,30,0) 22%,
                             rgba(10,6,30,0) 55%,rgba(10,6,30,.90) 100%)}
.splashInner{position:relative;z-index:2;width:100%;max-width:340px;padding:52px 18px 22px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  max-height:100%;overflow-y:auto}
/* ---- Logo: kirik tas yazi + dort element madalyonu ----
   Madalyonlar AYRI katman: her biri kendi ritminde yanip soner.
   Faz kaymasi bilincli - hepsi ayni anda parlarsa yapay duruyor. */
/* LOGO + ELEMENT TASLARI
   HATA (kullanici bildirdi): taslar logonun UZERINE biniyordu, "Stonebreaking"
   yazisi okunmuyordu. Sebep: taslar eskiden yuvarlak madalyondu (%19, kose
   disinda duruyordu); kare kumtasi levhaya cevrilince gorsel agirlik artti
   ve negatif konumlar (-6%) yaziyi yedi.
   COZUM: sarmalayiciya yatay/dikey PAY verildi, taslar o payin icine
   yerlesti. Artik logoya hic dokunmuyorlar. */
.logoWrap{position:relative;display:inline-block;width:min(92%,340px);
  margin:0 auto;padding:9% 15% 7%}
.logoWrap .logo{width:100%;display:block;
  filter:drop-shadow(0 6px 22px rgba(120,90,220,.45));
  animation:logoBreathe 6s ease-in-out infinite}
@keyframes logoBreathe{0%,100%{filter:drop-shadow(0 6px 22px rgba(120,90,220,.42))}
  50%{filter:drop-shadow(0 6px 30px rgba(160,120,255,.62))}}
.logoWrap .em{position:absolute;width:13.5%;pointer-events:none;
  will-change:opacity,transform;
  filter:drop-shadow(0 3px 9px rgba(0,0,0,.55))}
/* Dort kose, logonun DISINDA: yaziya temas yok */
.logoWrap .em.fire { left:0;   top:2%;    animation:emGlow 2.6s ease-in-out infinite}
.logoWrap .em.water{ right:0;  top:2%;    animation:emGlow 3.1s ease-in-out infinite .7s}
.logoWrap .em.earth{ left:0;   bottom:2%; animation:emGlow 2.9s ease-in-out infinite 1.4s}
.logoWrap .em.air  { right:0;  bottom:2%; animation:emGlow 3.4s ease-in-out infinite 2.1s}
@keyframes emGlow{
  0%,100%{opacity:.62; transform:scale(.94)}
  50%    {opacity:1;   transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){
  .logoWrap .em,.logoWrap .logo{animation:none}
  .logoWrap .em{opacity:.9}
}
#s-splash .logo{filter:drop-shadow(0 6px 24px rgba(255,180,60,.5))}
.heroWrap{margin:2px 0 6px;animation:float 4.5s ease-in-out infinite}
.heroImg{width:min(62%,190px);display:block;margin:0 auto;
  filter:drop-shadow(0 0 26px rgba(140,180,255,.45)) drop-shadow(0 12px 22px rgba(0,0,0,.6))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
.screen.cosmic .tagline{font-size:14px;opacity:.92;margin:2px 0 15px;font-style:italic;
  text-shadow:0 2px 8px #000}
.screen.cosmic h2{text-shadow:0 2px 12px #000;margin-bottom:4px}
.screen.cosmic .muted{text-shadow:0 1px 6px #000}
#saveInfo{margin-top:13px}

/* Yas secimi */
#ageGrid{width:100%;margin-top:12px}
.agebtn{display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;margin:8px 0;
  border-radius:17px;cursor:pointer;text-align:left;font-family:inherit;
  background:rgba(18,12,40,.72);border:2px solid rgba(255,255,255,.22);
  color:var(--ink);backdrop-filter:blur(9px);transition:.16s;
  box-shadow:0 6px 18px rgba(0,0,0,.45)}
.agebtn:active{transform:scale(.98)}
.agebtn.sel{border-color:var(--gold);background:rgba(255,207,92,.20)}
.agebtn .ai{font-size:26px;flex:0 0 auto;line-height:1}
.agebtn b{font-size:15.5px;display:block}
.agebtn small{display:block;opacity:.86;font-size:11.5px;margin-top:2px;line-height:1.35}

.evo{border-color:var(--gold);background:rgba(255,207,92,.12);text-align:center;
  animation:evopop .6s cubic-bezier(.2,1.4,.4,1)}
.evoImg{width:120px;display:block;margin:6px auto 4px;
  filter:drop-shadow(0 0 18px rgba(255,207,92,.7)) drop-shadow(0 6px 12px rgba(0,0,0,.5))}
@keyframes evopop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
/* ---------- Zihin Haritası ---------- */
#mindCanvas{width:100%;max-width:330px;aspect-ratio:1;margin:10px auto 4px;display:block;
  border-radius:20px;background:rgba(6,4,18,.55);border:1px solid rgba(255,255,255,.12);
  box-shadow:0 0 30px rgba(120,90,220,.22),inset 0 0 40px rgba(0,0,0,.5)}
#mindLegend{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;width:100%;
  max-width:330px;margin:6px auto 12px;font-size:11.5px}
#mindLegend div{display:flex;align-items:center;gap:6px;
  background:rgba(10,6,26,.5);padding:5px 8px;border-radius:10px}
#mindLegend i{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:block}
#mindLegend b{margin-left:auto;font-variant-numeric:tabular-nums}
/* Taşkıran seçimi */
#npHeroes{display:flex;gap:10px;margin-top:8px}
/* Iki kart AYNI yukseklikte ve yazilar AYNI hizada olmali.
   Olculdu: erkek gorseli 185px, kadin 163px -> "Erkek" 199px'te,
   "Kadın" 177px'te kaliyordu (22px kayik). Sebep: gorseller farkli
   oranda, akisa birakilinca yazi da onlarla birlikte kayiyor.
   Cozum: gorsele SABIT yukseklik verilir (object-fit:contain ile
   oran korunur), yazi ise flex ile en alta sabitlenir. */
.heroPick{flex:1;border-radius:16px;padding:8px 6px 10px;cursor:pointer;text-align:center;
  background:rgba(255,255,255,.06);border:2px solid transparent;transition:.16s;
  display:flex;flex-direction:column;align-items:center}
.heroPick img{width:100%;max-width:98px;height:150px;object-fit:contain;
  display:block;margin:0 auto;
  filter:drop-shadow(0 5px 10px rgba(0,0,0,.55))}
.heroPick b{display:block;font-size:12.5px;margin-top:auto;padding-top:6px;opacity:.85}
.heroPick.sel{border-color:var(--gold);background:rgba(255,207,92,.16)}
.heroPick.sel img{filter:drop-shadow(0 0 14px rgba(255,207,92,.65)) drop-shadow(0 5px 10px rgba(0,0,0,.5))}
.heroPick.sel b{opacity:1;color:var(--gold)}
/* Giris / Kayit */
.notePanel{margin-top:14px;padding:11px 13px;border-radius:14px;width:100%;
  background:rgba(12,8,30,.62);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(7px)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;
  background:#fff!important;color:#3c4043!important;box-shadow:0 5px 0 #c9ccd1,0 8px 18px rgba(0,0,0,.4)!important}
.gbtn:active{box-shadow:0 1px 0 #c9ccd1!important}
.gicon{width:24px;height:24px;border-radius:50%;background:conic-gradient(#EA4335 0 25%,#FBBC05 0 50%,#34A853 0 75%,#4285F4 0);
  color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;font-family:Arial,sans-serif}
/* ---------- Profiller / Aile Hesabı ---------- */

.prof{display:flex;align-items:center;gap:11px;padding:11px 13px;margin:7px 0;
  border-radius:16px;cursor:pointer;background:rgba(255,255,255,.07);
  border:2px solid transparent;transition:.16s}
.prof:active{transform:scale(.985)}
.prof.act{border-color:var(--gold);background:rgba(255,207,92,.14)}
.prof .pav{width:44px;flex:0 0 auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))}
.prof .info{flex:1;min-width:0}
.prof .nm{font-weight:800;font-size:15.5px;line-height:1.2}
.prof .st{font-size:11.5px;opacity:.72;margin-top:3px}
.prof .md{font-size:11px;opacity:.85;margin-top:2px}
/* Silme dugmesi kesfedilebilir olmali: eski 16px/.45 opaklik ikonu
   parmakla bulunamiyordu, kullanici "profil silme yok" sandi. */
.prof .del{opacity:.85;font-size:19px;padding:10px 12px;flex:0 0 auto;line-height:1;
  border-radius:12px;background:rgba(255,95,109,.14);border:1px solid rgba(255,95,109,.35)}
.prof .del:active{opacity:1;background:rgba(255,95,109,.3)}
/* Profil karti: begeni sayaci + duzenle dugmesi */
.prof .edit{opacity:.85;font-size:17px;padding:10px 12px;flex:0 0 auto;line-height:1;
  border-radius:12px;background:rgba(255,207,92,.14);border:1px solid rgba(255,207,92,.35);
  margin-right:6px}
.prof .edit:active{opacity:1;background:rgba(255,207,92,.3)}
.likeRow{display:flex;align-items:center;gap:5px;font-size:12px;margin-top:3px}
.likeBtn{cursor:pointer;padding:3px 9px;border-radius:99px;line-height:1;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);font-size:12.5px}
.likeBtn.on{background:rgba(255,95,109,.22);border-color:rgba(255,95,109,.5)}
.likeBtn:active{transform:scale(.92)}
.avgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.avgrid span{
  display:flex;align-items:center;gap:10px;
  font-size:13px;padding:10px 12px;border-radius:14px;cursor:pointer;line-height:1.2;
  background:rgba(255,255,255,.06);border:2px solid transparent;
  transition:.18s;position:relative;overflow:hidden;
}
.avgrid span::before{
  content:attr(data-bg);position:absolute;right:6px;top:50%;transform:translateY(-50%);
  font-size:28px;opacity:0.18;pointer-events:none;
}
.avgrid span b{font-size:12.5px;display:block}
.avgrid span small{font-size:10.5px;opacity:.72;display:block;margin-top:2px}
.avgrid span.sel{border-color:var(--gold);background:rgba(255,207,92,.16);box-shadow:0 0 18px rgba(255,207,92,.25)}
.avgrid span.sel::before{opacity:0.32}
.av-card-fire.sel{border-color:#ff4d2e;box-shadow:0 0 18px rgba(255,77,46,.35)}
.av-card-water.sel{border-color:#2f9bff;box-shadow:0 0 18px rgba(47,155,255,.35)}
.av-card-earth.sel{border-color:#35c15e;box-shadow:0 0 18px rgba(53,193,94,.35)}
.av-card-air.sel{border-color:#ffffff;box-shadow:0 0 18px rgba(255,255,255,.35)}
#npHeroes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.heroPick{
  flex:unset;border-radius:18px;padding:12px 8px 12px;cursor:pointer;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
  border:2px solid rgba(255,255,255,.10);transition:.20s;
  display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;
}
.heroPick::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%, rgba(255,207,92,.18), transparent 64%);opacity:0;transition:.2s;
}
.heroPick.sel::after{opacity:1}
.heroPick img{width:100%;max-width:110px;height:150px;object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
.heroPick b{display:block;font-size:13px;margin-top:10px;letter-spacing:.4px}
.heroPick small{display:block;font-size:10px;opacity:.65;margin-top:3px;line-height:1.3}
.heroPick.sel{border-color:var(--gold);background:linear-gradient(180deg,rgba(255,207,92,.18),rgba(255,207,92,.06));transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 20px rgba(255,207,92,.25)}
.heroPick.sel img{filter:drop-shadow(0 0 18px rgba(255,207,92,.65)) drop-shadow(0 10px 16px rgba(0,0,0,.6))}
.heroPick.sel b{opacity:1;color:var(--gold)}

#npInput{width:100%;padding:11px 13px;border-radius:13px;margin-top:6px;
  border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.3);
  color:var(--ink);font-size:16px;font-family:inherit}
#npInput:focus{outline:none;border-color:var(--gold)}
.modeopt{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:7px;
  border-radius:14px;cursor:pointer;background:rgba(255,255,255,.06);
  border:2px solid transparent}
.modeopt.sel{border-color:var(--gold);background:rgba(255,207,92,.14)}
.modeopt .mi{font-size:21px;flex:0 0 auto;line-height:1}
.modeopt b{font-size:14px}
.modeopt small{display:block;opacity:.7;font-size:11px;margin-top:2px;line-height:1.35}
#profBtn{position:absolute;top:10px;left:54px;z-index:70;border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.45);color:#fff;font-size:16px;min-width:38px;height:32px;
  border-radius:999px;cursor:pointer;line-height:1;padding:0 8px}
#s-splash{align-items:center;justify-content:center;text-align:center}
#s-splash .logoWrap{width:min(94%,400px)}
#s-splash img.logo{width:100%}
#s-splash img.hero{width:min(58%,230px);margin:4px 0 10px;border-radius:20px;
  filter:drop-shadow(0 10px 26px rgba(0,0,0,.6))}
.tagline{font-size:15px;opacity:.85;margin:2px 0 16px;font-style:italic}

.spirits{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.spirit{border-radius:18px;padding:10px;text-align:center;cursor:pointer;
  border:2px solid transparent;background:rgba(255,255,255,.07);transition:.18s}
.spirit img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#0003}
.spirit b{display:block;margin-top:6px;font-size:15px}
.spirit small{opacity:.7;font-size:11px}
.spirit.sel{border-color:var(--gold);background:rgba(255,207,92,.16);transform:scale(1.03)}

/* ---------- OYUN EKRANI ---------- */
/* Senaryo: Taskiran taslari arafta, antik run sunaginda kirar. */
/* TAHTA TEMASI — secilen ruha gore degisir.
   Kullanici: "ruhlarin masa tabelasi tahtasi arka plani bile farkli
   olmali, temaya uygun ilerlemeliyiz".
   Ates sunagi kizil kor, su sunagi buzul mavi, toprak sunagi yosunlu
   yesil, hava sunagi firtinali mor. Oyuncu kendi ruhunun dunyasinda
   oynuyor - secim artik gorsel olarak da karsiligini buluyor.
   --board degiskeni JS'ten yazilir; varsayilan ortak sunak. */
#s-game{padding:0;background:#0d0a1e var(--board,url("assets/bg_board.jpg"))
  center/cover no-repeat;transition:background-image .5s ease}
/* Ruh rengi tahtanin kenarindan iceri sizar: temayi pekistirir */
#s-game::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 120% 70% at 50% 50%,transparent 42%,
    var(--boardTint,rgba(0,0,0,0)) 100%);opacity:.55}
#s-game::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,rgba(8,5,20,.86) 0%,rgba(8,5,20,.32) 20%,
    rgba(8,5,20,.20) 62%,rgba(8,5,20,.88) 100%)}
#topbar,#trayWrap,#say,#boardWrap,#tools{z-index:1}
#topbar{display:flex;align-items:center;gap:6px;padding:10px 108px 6px 100px;flex:0 0 auto;flex-wrap:wrap}
.chip{background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.16);
  border-radius:999px;padding:4px 9px;font-weight:700;white-space:nowrap;font-size:11.5px}
.chip.gold{color:var(--gold)}

#progWrap{height:5px;margin:0 12px 6px;background:rgba(0,0,0,.35);
  border-radius:99px;overflow:hidden;flex:0 0 auto}
#progFill{height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,var(--gold),#ffe9a8);transition:width .35s ease}
/* Tepsi */
#trayWrap{display:flex;justify-content:center;padding:4px 10px 8px;flex:0 0 auto}
#tray{display:flex;gap:3px;padding:7px;border-radius:14px;
  background:linear-gradient(180deg,rgba(38,28,66,.92),rgba(20,14,40,.95));
  border:2px solid rgba(201,164,92,.55);
  box-shadow:inset 0 3px 12px #000a,0 0 18px rgba(201,164,92,.18),0 4px 14px #0007}
.slot{width:var(--tw);height:var(--th);border-radius:7px;
  background:rgba(0,0,0,.38);border:1px dashed rgba(201,164,92,.28);flex:0 0 auto}
.slot.danger{border-color:var(--bad);background:rgba(255,95,109,.15)}
#tray.warn{animation:trayw .45s ease}
@keyframes trayw{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Tahta */
#boardWrap{flex:1;position:relative;overflow:hidden;min-height:0}
#board{position:absolute;left:50%;top:50%;transform-origin:center}

/* 3B tas govdesi: tek PNG + vektor sembol. Boyut kucuk, her olcekte net.
   B4 — Katman derinligi: her tas kendi katmanina gore --dsc (olcek),
   --dsh (golge yaricapi) ve --dep (0..1 derinlik payi) tasir. Ust katman
   hem buyuk hem parlak hem daha uzun golgeli => gercek yigin hissi. */
.tile{position:absolute;cursor:pointer;
  --dsc:1; --dsh:5px; --dep:0;
  background:url("assets/tile_stone.webp") center/100% 100% no-repeat;
  filter:drop-shadow(0 calc(var(--dsh) * .85) var(--dsh) rgba(0,0,0,calc(.42 + var(--dep)*.22)))
         brightness(calc(1 + var(--dep) * .10));
  transform:scale(var(--dsc));
  transition:transform .10s,opacity .18s,filter .12s;
  display:flex;align-items:center;justify-content:center}
/* Yeni tas govdesinde oyma bir cerceve var: sembol onun ICINE oturmali.
   Hafif ic golge + ustte ince isik = tasa kazinmis hissi. */
.tile svg{width:78%;height:78%;pointer-events:none;margin-bottom:4%;margin-right:0.5%;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.45)) drop-shadow(0 -1px 1px rgba(60,40,20,.5))}

/* B2 — Tas durum katmanlari
   1) NORMAL (serbest): ustte ince isik cizgisi, oynanabilir oldugu okunur */
.tile.free::before{content:"";position:absolute;inset:6% 8% auto 8%;height:16%;
  border-radius:50%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,0));
  opacity:calc(.35 + var(--dep) * .45)}

/* 2) KILITLI: secilemez ama yuzu net okunmali. Cam gibi soguk bir ortu +
   hafif desatürasyon. Onceki tek basina brightness(.62) taslari taninmaz
   yapiyordu; simdi ortu ustte, sembol altinda kaliyor. */
.tile.locked{filter:drop-shadow(0 calc(var(--dsh)*.6) calc(var(--dsh)*.85) rgba(0,0,0,.5))
  brightness(.90) saturate(.78);cursor:default}
/* Ortu, tas PNG'sinin silueti ile maskelenir: kose disina tasmaz.
   Kumtasi govde eski krem govdeden koyu oldugu icin ortu hafifletildi:
   kilitli tas geride durur ama sembolu NET okunur (hafiza olcumu icin sart). */
.tile.locked::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(160deg,rgba(34,26,50,.15),rgba(12,9,22,.24) 70%);
  -webkit-mask:url("assets/tile_stone.webp") center/100% 100% no-repeat;
  mask:url("assets/tile_stone.webp") center/100% 100% no-repeat}

/* 3) SECILI: altin hale + hafif yukselme (tepsiye ucmadan onceki tek kare) */
.tile.sel{z-index:9999 !important;
  transform:scale(calc(var(--dsc) * 1.09)) translateY(-3px);
  filter:drop-shadow(0 0 10px var(--gold)) drop-shadow(0 0 20px rgba(255,207,92,.55))
         drop-shadow(0 6px 7px rgba(0,0,0,.5)) brightness(1.14)}
.tile.sel::after{content:"";position:absolute;inset:-6%;pointer-events:none;
  border-radius:16%;border:2px solid rgba(255,207,92,.85);
  box-shadow:0 0 14px rgba(255,207,92,.5) inset;animation:selpulse .5s ease-in-out infinite alternate}
@keyframes selpulse{from{opacity:.55;transform:scale(.97)}to{opacity:1;transform:scale(1)}}

/* 4) RET: kilitli tasa dokunulunca titrer — sessiz hata yerine gorsel geri bildirim */
.tile.nope{animation:nope .28s ease}
@keyframes nope{0%,100%{transform:scale(var(--dsc))}
  25%{transform:scale(var(--dsc)) translateX(-4px) rotate(-1.5deg)}
  75%{transform:scale(var(--dsc)) translateX(4px) rotate(1.5deg)}}

.tile.pick{transform:scale(calc(var(--dsc) * .84)) translateY(-8px);opacity:0}
.tile.hintme{animation:hint .5s ease 3;
  filter:drop-shadow(0 0 9px var(--gold)) drop-shadow(0 4px 5px rgba(0,0,0,.55))}
@keyframes hint{0%,100%{transform:scale(var(--dsc))}
  50%{transform:scale(calc(var(--dsc) * 1.13)) translateY(-4px)}}

/* Tepsideki taş */
.ttile{position:absolute;
  background:url("assets/tile_stone.webp") center/100% 100% no-repeat;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));
  display:flex;align-items:center;justify-content:center;
  transition:left .18s cubic-bezier(.3,.9,.4,1),top .18s cubic-bezier(.3,.9,.4,1),
             transform .15s,opacity .15s;z-index:40}
.ttile svg{width:78%;height:78%;margin-bottom:4%;margin-right:0.5%;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.45)) drop-shadow(0 -1px 1px rgba(60,40,20,.5))}
/* B2 — patlama karesi: sonmeden once tek kare beyaz parlama (kirilma hissi) */
.ttile.boom{transform:scale(1.45) rotate(8deg);opacity:0;
  filter:brightness(2.6) drop-shadow(0 0 14px #fff)}

#tools{display:flex;gap:8px;padding:8px 10px 12px;flex:0 0 auto}
#tools .btn{flex:1;padding:12px 4px;font-size:13.5px}

/* Ikincil menu: acilinca kart gibi grupla, tek tek yigilmasin */
#moreBox{background:rgba(12,8,30,.55);border:1px solid rgba(255,255,255,.10);
  border-radius:18px;padding:9px;margin-top:2px;backdrop-filter:blur(6px);
  animation:moreIn .3s cubic-bezier(.2,.9,.3,1)}
@keyframes moreIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#moreBox .btn{margin:5px 0}

/* --- YOLCULUK SERIDI: ana menudeki "nerede kaldim" karti --- */
#journeyCard{width:100%;max-width:300px;margin:2px 0 10px}
.jCard{background:linear-gradient(180deg,rgba(52,42,96,.92),rgba(29,24,56,.92));
  border:1px solid rgba(255,207,92,.30);border-radius:18px;padding:12px 13px;
  box-shadow:0 10px 30px rgba(0,0,0,.42);text-align:left}
.jCard.fresh{text-align:center;padding:14px 13px}
.jHead{font-size:15px;font-weight:800;color:var(--gold)}
.jSub{font-size:12.5px;opacity:.82;margin-top:4px;line-height:1.5}
.jTop{display:flex;align-items:center;gap:11px}
.jHero{width:46px;height:46px;border-radius:12px;object-fit:cover;
  border:1px solid rgba(255,207,92,.42);flex:none}
.jInfo{min-width:0;flex:1}
.jRank{font-size:13.5px;font-weight:800;color:var(--gold);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jLv{font-size:12px;opacity:.85;margin-top:2px;display:flex;align-items:center;gap:7px}
.jChip{display:inline-flex;align-items:center}
.jGoal{font-size:12.5px;margin:9px 0 6px;opacity:.95;line-height:1.45}
.jBarWrap{height:7px;background:rgba(0,0,0,.42);border-radius:99px;overflow:hidden}
.jBarWrap i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--gold),#ffe9a8);
  transition:width .9s cubic-bezier(.2,.8,.3,1)}
.jFoot{font-size:11px;opacity:.62;margin-top:6px}

/* --- GOLGE AYNASI: hikayenin tezi oyuncunun verisiyle sinanir --- */
.shadowCard{padding:24px 20px 18px;
  background:linear-gradient(180deg,#2a1220,#150a16);
  box-shadow:0 26px 80px rgba(0,0,0,.9), 0 0 46px -10px #b3261a}
#wisdom:has(.shadowCard){background:rgba(8,2,6,.95);backdrop-filter:blur(7px)}
.smTag{font-size:11px;letter-spacing:3.4px;font-weight:800;
  color:#ff6a4d;opacity:.95;position:relative;margin-bottom:12px}
.smQ{font-family:'STONEBREAKING',system-ui,sans-serif;
  font-size:19px;line-height:1.45;color:#fff;font-style:italic;
  position:relative;margin-bottom:16px;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.smBars{position:relative;text-align:left;margin-bottom:13px}
.smRow{margin-bottom:8px}
.smRow.top .smHead b{color:var(--gold);font-size:14px}
.smRow.top .smBar{box-shadow:0 0 12px -2px var(--gold)}
.smHead{display:flex;justify-content:space-between;align-items:baseline;
  font-size:12px;opacity:.9;margin-bottom:3px}
.smHead b{font-size:12.5px}
.smBar{height:8px;background:rgba(0,0,0,.5);border-radius:99px;overflow:hidden}
.smBar i{display:block;height:100%;border-radius:99px;
  transition:width 1.1s cubic-bezier(.2,.8,.3,1)}
.smAnswer{position:relative;font-size:12.5px;line-height:1.6;opacity:.92;
  margin-bottom:15px;padding-top:11px;
  border-top:1px solid rgba(255,255,255,.14)}
.smAnswer b{color:var(--gold)}

/* --- MEYDAN OKUMA LOBISI: iki oyuncu ayni saniyede baslar --- */
/* Lobi karti: geri sayim okunmali, arka plan dikkat dagitmamali.
   Ilk denemede kart yari saydamdi ve ana menu icinden goruyordu. */
.wCard.lobby{padding:26px 20px 18px;
  background:linear-gradient(180deg,#231b48,#140f30);
  box-shadow:0 26px 80px rgba(0,0,0,.85), 0 0 46px -10px var(--wc)}
#wisdom:has(.lobby){background:rgba(4,3,10,.93);backdrop-filter:blur(6px)}
.lbTag{font-size:11.5px;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);font-weight:800;opacity:.9;position:relative}
.lbVs{display:flex;align-items:center;justify-content:center;gap:9px;
  margin:11px 0 4px;position:relative;flex-wrap:wrap}
.lbVs b{font-size:15px;color:#fff;max-width:120px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.lbVs span{font-size:11px;opacity:.55;letter-spacing:2px;text-transform:uppercase}
.lbNum{font-family:'STONEBREAKING',system-ui,sans-serif;
  font-size:78px;line-height:1;color:var(--gold);position:relative;
  margin:6px 0 2px;text-shadow:0 0 34px rgba(255,207,92,.55);
  animation:lbBeat 1s ease-in-out infinite}
@keyframes lbBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.lbSub{font-size:12px;opacity:.68;position:relative;margin-bottom:9px}
.lbInfo{font-size:11.5px;opacity:.55;position:relative;margin-bottom:15px}
.duSep{display:flex;align-items:center;gap:10px;margin:13px 0 11px;opacity:.5}
.duSep::before,.duSep::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.22)}
.duSep span{font-size:11px;letter-spacing:2px;text-transform:uppercase}
@media (prefers-reduced-motion: reduce){ .lbNum{animation:none} }

/* --- BILGELIK KARTI: ekran goruntusu alinasi tam ekran an --- */
#wisdom{position:absolute;inset:0;z-index:160;display:none;
  align-items:center;justify-content:center;padding:22px;
  background:radial-gradient(ellipse at 50% 40%,rgba(14,9,32,.94),rgba(5,3,12,.97))}
#wisdom.on{display:flex;animation:wFade .5s ease}
@keyframes wFade{from{opacity:0}to{opacity:1}}
.wCard{position:relative;width:100%;max-width:360px;text-align:center;
  padding:26px 22px 20px;border-radius:26px;
  background:linear-gradient(180deg,rgba(30,24,60,.92),rgba(16,12,34,.96));
  border:1px solid var(--wc);
  box-shadow:0 24px 70px rgba(0,0,0,.75), 0 0 40px -12px var(--wc);
  animation:wRise .6s cubic-bezier(.2,.9,.3,1)}
@keyframes wRise{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.wGlow{position:absolute;inset:0;border-radius:26px;pointer-events:none;
  background:radial-gradient(ellipse 80% 50% at 50% 0%,var(--wc),transparent 68%);
  opacity:.22}
.wFace{width:78px;height:78px;border-radius:50%;object-fit:cover;
  border:2px solid var(--wc);box-shadow:0 0 26px -6px var(--wc);
  margin-bottom:9px;position:relative}
.wWho{font-size:13px;letter-spacing:2.6px;text-transform:uppercase;
  color:var(--wc);font-weight:800;margin-bottom:13px;position:relative}
.wQuote{font-family:'STONEBREAKING',system-ui,sans-serif;
  font-size:21px;line-height:1.52;color:#fff;position:relative;
  margin:0 0 15px;text-shadow:0 3px 18px rgba(0,0,0,.7);
  max-height:44vh;overflow-y:auto}
/* Uzun sozler kartta sikismasin: 90 karakterden uzunsa punto kucul */
.wQuote.long{font-size:18px;line-height:1.55}
.wQuote.xlong{font-size:16.5px;line-height:1.58}
.wSign{font-size:10px;letter-spacing:4px;opacity:.42;margin-bottom:16px;
  position:relative;font-weight:700}
.wCard .btn{position:relative}
@media (prefers-reduced-motion: reduce){ .wCard{animation:none} }

/* --- Dokunus geri bildirimi: 200ms'den uzun her bekleme gorunur olmali --- */
.tapSpin{display:inline-block;width:15px;height:15px;margin-right:7px;
  vertical-align:-2px;border-radius:50%;
  border:2px solid rgba(255,255,255,.28);border-top-color:var(--gold);
  animation:tapSpin .7s linear infinite}
.tapSpin.big{width:34px;height:34px;border-width:3px;margin:0}
@keyframes tapSpin{to{transform:rotate(360deg)}}
.btn.busy{opacity:.85;cursor:progress}
#tapVeil{position:absolute;inset:0;z-index:99;display:none;
  align-items:center;justify-content:center;background:rgba(7,4,15,.55);
  backdrop-filter:blur(2px);opacity:0;transition:opacity .22s ease}
#tapVeil.on{display:flex;opacity:1}
@media (prefers-reduced-motion: reduce){ .tapSpin{animation:none} }
#modal{position:absolute;inset:0;background:rgba(6,20,16,.88);z-index:100;
  display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
#modal.on{display:flex}
#modalBox{background:linear-gradient(180deg,#2c2455,#1d1838);border:1px solid rgba(255,255,255,.18);
  border-radius:24px;padding:22px;max-width:400px;width:100%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.7);max-height:88%;overflow-y:auto}
.dim{margin:9px 0}
.dim .row{font-size:12.5px;margin-bottom:4px}
.bar{height:9px;background:rgba(0,0,0,.42);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.3,1)}
/* Cubuk renkleri de anayasadan: kirmizi / mavi / yesil / BEYAZ */
.bar.fire i{background:linear-gradient(90deg,#b3261a,#ff7a45)}
.bar.water i{background:linear-gradient(90deg,#12579e,#4aa8e8)}
.bar.earth i{background:linear-gradient(90deg,#1f6b3a,#57b96f)}
.bar.air i{background:linear-gradient(90deg,#8fa0ad,#ffffff)}
.big{font-size:42px;font-weight:900;color:var(--gold);line-height:1;margin:6px 0}
.iqnote{font-size:11px;opacity:.6;line-height:1.45;margin-top:10px;
  border-top:1px solid rgba(255,255,255,.12);padding-top:9px}
.delta{font-size:13px;font-weight:700}
.up{color:var(--ok)} .down{color:var(--bad)}
/* ================= HIKAYE SAHNESI =================
   Sinematik his: gorsel yavas zoom yapar (Ken Burns), metin alttan
   suzulur. Tek ekran tum bolumleri servis eder. */
#s-story{padding:0;background:#07040f;overflow:hidden}
/* Gorsel alani metnin USTUNDE biter: kahraman hicbir zaman yazinin
   arkasinda kalmaz. --sh = metin blogunun kapladigi pay. */
#stImgWrap{position:absolute;left:0;right:0;top:0;bottom:var(--sh,38%);overflow:hidden}
#stImg{width:100%;height:100%;object-fit:cover;
  object-position:var(--focus,center 42%);transform-origin:center 42%;
  animation:kenb 18s ease-out forwards, stBreathe 7s ease-in-out infinite;
  opacity:0;transition:opacity .6s}
#stImg.in{opacity:1}
@keyframes kenb{from{transform:scale(1.0)}to{transform:scale(1.16)}}
/* Gorsel nefes aliyor: parlaklik ve doygunluk hafifce dalgalaniyor.
   Durgun bir resim yerine yasayan bir sahne hissi. */
@keyframes stBreathe{
  0%,100%{filter:brightness(1) saturate(1)}
  50%    {filter:brightness(1.09) saturate(1.12)}}
/* Yildiz tozu: gorselin ustunde suzulen parcaciklar */
#stDust{position:absolute;inset:0;pointer-events:none;z-index:3;
  opacity:0;transition:opacity 1.2s ease}
#stDust.on{opacity:1}
/* Sahne kenarindan iceri sizan altin isik - canli bir kaynak varmis gibi */
#stAura{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse 70% 45% at 50% 38%,
    rgba(255,214,120,.16),rgba(255,180,60,.06) 45%,transparent 72%);
  animation:auraPulse 5.5s ease-in-out infinite}
@keyframes auraPulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){
  #stImg{animation:none} #stAura{animation:none} #stDust{display:none}
}
#stShade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,4,15,.55) 0%,rgba(7,4,15,.05) 22%,
    rgba(7,4,15,.10) calc(100% - var(--sh,38%) - 90px),
    rgba(7,4,15,.88) calc(100% - var(--sh,38%) - 10px),
    rgba(7,4,15,1) calc(100% - var(--sh,38%) + 10px), rgba(7,4,15,1) 100%)}
#stBody{position:absolute;left:0;right:0;bottom:0;padding:10px 20px 18px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  height:var(--sh,38%);overflow-y:auto;justify-content:flex-end}
#stChapter{font-size:11.5px;letter-spacing:2.6px;text-transform:uppercase;
  color:var(--gold);opacity:.85;margin-bottom:5px;font-weight:700}
#stTitle{font-size:23px;margin:0 0 9px;text-shadow:0 3px 16px #000;line-height:1.2}
/* Kademeli giris: bolum -> baslik -> metin sirayla suzuluyor.
   Hepsi ayni anda girince "sayfa yuklendi" hissi veriyordu; sirayla
   girince "sahne aciliyor" hissi veriyor. */
#stChapter.stFade{animation:stfade .5s ease both}
#stTitle.stFade{animation:stfade .6s ease .12s both}
#stText.stFade{animation:stfade .7s ease .26s both}
#stText{font-size:14.5px;line-height:1.66;opacity:.94;max-width:420px;
  text-shadow:0 2px 10px #000;margin-bottom:13px}
/* Uzun perde metinlerinde punto kucul: tasma yerine okunur sikilik.
   Olcum: 2 panelde metin tasiyordu (P0.0 ve P0.3 - en uzun metinler). */
#stText.long { font-size:13.5px; line-height:1.58 }
#stText.xlong{ font-size:12.5px; line-height:1.52 }
#stText b{color:var(--gold)}
#stText .whisper{display:block;margin-top:9px;font-style:italic;opacity:.8;font-size:13.5px}
#stBody .btn{max-width:330px}
#stDots{display:flex;gap:6px;margin-bottom:12px}
#stDots i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.28)}
#stDots i.on{background:var(--gold);box-shadow:0 0 8px var(--gold);width:18px}
.stFade{animation:stfade .55s ease}
@keyframes stfade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* SOGUK ACILIS: ekran siyahtan yavasca aciliyor, cekirdek bir kez atiyor.
   Oyuna ilk giren kisi donuk bir resim degil, uyanan bir evren goruyor. */
#s-story.coldOpen::after{content:"";position:absolute;inset:0;z-index:8;
  pointer-events:none;background:#04030a;animation:coldFade 2.0s ease-out forwards}
@keyframes coldFade{
  0%{opacity:1} 22%{opacity:.92} 60%{opacity:.35} 100%{opacity:0}}
#s-story.coldOpen #stCore{animation:coreBoot 2.6s cubic-bezier(.2,.9,.3,1) both,
  coreBreathe 4.6s ease-in-out 2.6s infinite}
@keyframes coreBoot{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}
  38%{opacity:.5;transform:translate(-50%,-50%) scale(.72)}
  62%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#s-story.coldOpen #stCoreGlow{animation:haloBoot 2.6s ease-out both,
  coreHalo 4.6s ease-in-out 2.6s infinite}
@keyframes haloBoot{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
  55%{opacity:1;transform:translate(-50%,-50%) scale(1.35)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion: reduce){
  #s-story.coldOpen::after{animation:none;opacity:0}
  #s-story.coldOpen #stCore,#s-story.coldOpen #stCoreGlow{animation:none}
}

/* ============ ACILIS SINEMATIGI (yalniz Perde I) ============
   Kullanici: "Baslangictaki hikayeye giris daha canli bisey olmali".
   Uc olay sahneleniyor:
   1) DORT RUH yorungeye giriyor  -> cember kuruluyor (Panel 1)
   2) CEKIRDEK CATLIYOR           -> sarsinti + kirik isik + savrulma (Panel 2)
   3) KOLYE PARLIYOR              -> cagri kahramana geciyor (Panel 3)
   Hepsi CSS; tek bayt gorsel eklenmedi (madalyonlar zaten var). */
/* Dort ruh gorselde ZATEN var — uzerlerine madalyon koymak kopya olurdu.
   Onun yerine ruhlarin kendileri sirayla UYANIYOR: her birinin uzerinde
   kendi renginde bir isik acilip nabiz atmaya basliyor. */
#stOrbit{position:absolute;inset:0;z-index:4;pointer-events:none}
#stOrbit .orb{position:absolute;left:var(--x);top:var(--y);
  width:var(--os,22vmin);height:var(--os,22vmin);
  margin:calc(var(--os,22vmin) / -2) 0 0 calc(var(--os,22vmin) / -2);
  border-radius:50%;opacity:0;
  background:radial-gradient(circle,var(--oc) 0%,transparent 68%);
  mix-blend-mode:screen;
  animation:orbWake 1.25s cubic-bezier(.2,.9,.3,1) var(--od,0s) both,
            orbPulse 3.4s ease-in-out calc(var(--od,0s) + 1.25s) infinite}
@keyframes orbWake{
  0%{opacity:0;transform:scale(.3)}
  55%{opacity:1;transform:scale(1.22)}
  100%{opacity:.72;transform:scale(1)}}
@keyframes orbPulse{0%,100%{opacity:.5;transform:scale(.96)}
  50%{opacity:.85;transform:scale(1.06)}}
/* Cember kuruldu: cekirdekten disari altin halka gecer */
#stRing{position:absolute;left:50%;top:50%;width:0;height:0;z-index:3;pointer-events:none}
#stRing.go::before{content:"";position:absolute;left:50%;top:50%;
  width:34vmin;height:34vmin;margin:-17vmin 0 0 -17vmin;border-radius:50%;
  border:2px solid rgba(255,214,120,.85);
  animation:ringOut 2.6s cubic-bezier(.2,.8,.3,1) .9s forwards}
@keyframes ringOut{0%{opacity:0;transform:scale(.15)}
  25%{opacity:.9}100%{opacity:0;transform:scale(1.9)}}

/* --- CATLAMA --- */
#s-story.fxCrack #stImgWrap{animation:quake 1.4s cubic-bezier(.36,.07,.19,.97) .25s}
@keyframes quake{
  0%,100%{transform:translate(0,0)}
  8%{transform:translate(-7px,4px)} 18%{transform:translate(6px,-5px)}
  28%{transform:translate(-9px,-3px)} 38%{transform:translate(8px,5px)}
  50%{transform:translate(-5px,3px)} 64%{transform:translate(4px,-2px)}
  80%{transform:translate(-2px,1px)}}
/* Yalniz cekirdek ZATEN sahnedeyse parcalanir. Aksi halde kapali logo
   fxCrack yuzunden opacity:1 alip patlamanin ustunde hayalet gibi cikiyordu. */
#s-story.fxCrack #stCore.on{animation:coreBreak 1.9s cubic-bezier(.3,.9,.2,1) both}
@keyframes coreBreak{
  0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  14%{transform:translate(-50%,-50%) scale(1.14)}
  22%{filter:brightness(2.4) drop-shadow(0 0 40px #fff)}
  30%{transform:translate(-50%,-50%) scale(.94) rotate(-2deg)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.6);filter:brightness(3) blur(6px)}}
/* Kirik isik: cekirdekten disariya kacan yedi sivri hat */
#stCrack{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0}
#stCrack.go{animation:crackShow 2.4s ease forwards}
@keyframes crackShow{0%{opacity:0}12%{opacity:1}70%{opacity:.9}100%{opacity:0}}
#stCrack path{stroke:#ffe7a8;stroke-width:1.1;fill:none;filter:drop-shadow(0 0 6px #ffcf5c);
  stroke-dasharray:120;stroke-dashoffset:120;
  animation:crackDraw 1.1s cubic-bezier(.2,.9,.3,1) var(--cd,0s) forwards}
@keyframes crackDraw{to{stroke-dashoffset:0}}
/* Beyaz carpma flasi */
#stFlash{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;background:#fff}
#stFlash.go{animation:flashHit .7s ease-out forwards}
@keyframes flashHit{0%{opacity:0}9%{opacity:.85}100%{opacity:0}}
/* Ruhlar dort köseye savruluyor */
#stOrbit.blow .orb{animation:orbBlow 1.7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes orbBlow{
  0%{opacity:.8;transform:scale(1)}
  30%{opacity:1;transform:scale(1.5) translate(var(--bx,0),var(--by,0))}
  100%{opacity:0;transform:scale(.4) translate(calc(var(--bx,0) * 4),calc(var(--by,0) * 4))}}

/* --- KOLYE CAGRISI --- */
#stAmulet{position:absolute;z-index:5;pointer-events:none;opacity:0;
  width:16vmin;height:16vmin;margin:-8vmin 0 0 -8vmin;border-radius:50%;
  background:radial-gradient(circle,rgba(255,246,214,.95) 0%,rgba(255,207,92,.55) 26%,
    rgba(255,180,60,.18) 52%,transparent 74%)}
#stAmulet.go{animation:amuGlow 3.6s ease-in-out .5s 2}
@keyframes amuGlow{0%{opacity:0;transform:scale(.5)}
  18%{opacity:1;transform:scale(1.15)} 40%{opacity:.45;transform:scale(.92)}
  60%{opacity:1;transform:scale(1.06)} 100%{opacity:0;transform:scale(1.3)}}

/* --- METIN SATIR SATIR --- */
#stText .ln{display:block;opacity:0;animation:lnIn .75s ease var(--ld,0s) both}
@keyframes lnIn{from{opacity:0;transform:translateY(10px);filter:blur(3px)}
  to{opacity:1;transform:none;filter:none}}

@media (prefers-reduced-motion: reduce){
  #stOrbit,#stOrbit.on{animation:none} #stOrbit .orb img{animation:none}
  #s-story.fxCrack #stImgWrap{animation:none}
  #stCrack,#stFlash,#stAmulet,#stRing.go::before{animation:none;opacity:0}
  #stText .ln{animation:none;opacity:1}
}

/* ==================================================================
   PERDE KAHRAMANI — hikaye panellerinde oyuncunun avatari
   ------------------------------------------------------------------
   Perde I'de logonun durdugu yerde artik OYUNCU duruyor. Logo marka
   isaretidir, sahnenin oyuncusu degil; hikayede kahraman gorulmeli.
   Konum panelden gelir (heroAt), boylece her panel kendi cercevesine
   gore yerlestirir. */
#stHeroWrap{position:absolute;left:var(--shX,50%);bottom:var(--shB,6%);
  transform:translateX(-50%);height:var(--shH,46%);z-index:4;
  pointer-events:none;opacity:0;display:none;
  animation:stHeroIn 1.2s cubic-bezier(.2,.9,.3,1) .5s both,
            stHeroFloat 6.5s ease-in-out 1.7s infinite}
#stHeroWrap.on{display:block}
#stHero{display:block;height:100%;width:auto;
  filter:drop-shadow(0 16px 26px rgba(0,0,0,.8))
         drop-shadow(0 0 30px rgba(255,207,92,.28))}
#stHeroWrap .heroAmulet,#stHeroWrap .btTile{position:absolute}
@keyframes stHeroIn{
  from{opacity:0;transform:translateX(-50%) translateY(30px) scale(.94)}
  to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes stHeroFloat{0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(-9px)}}
@media (prefers-reduced-motion: reduce){ #stHeroWrap{animation:none;opacity:1} }

/* Perde acilis patlamasi: altin dalga ekrandan gecer */
/* Perde I'de dort ruhun ortasindaki altin cekirdegin uzerinde logo.
   Konum gorselden olculdu: merkez x=56.1% y=55.0%.
   Ken Burns zoom'u ile birlikte olceklensin diye stImgWrap icinde. */
/* Cekirdek logosu.
   screen blend denendi -> logo hayalet gibi soldu, yazi okunmadi.
   Cozum: logo TAM OPAK kalir; yapistirilmis hissini KENDI ISIGI kirar.
   Arkasina ayri bir hale katmani (stCoreGlow) koyduk: kureden yayilan
   altin isik logonun altindan tasar, ikisi tek nesne gibi gorunur. */
#stCoreGlow{position:absolute;left:49.8%;top:52%;width:98%;aspect-ratio:1;
  transform:translate(-50%,-50%);pointer-events:none;opacity:0;
  border-radius:50%;mix-blend-mode:screen;transition:opacity 1s ease;
  background:radial-gradient(circle at 50% 50%,
    rgba(255,244,214,.95) 0%, rgba(255,214,120,.62) 22%,
    rgba(255,176,60,.30) 42%, rgba(255,150,40,.10) 62%, transparent 78%)}
#stCoreGlow.on{opacity:1;animation:coreHalo 4.6s ease-in-out infinite}
@keyframes coreHalo{
  0%,100%{transform:translate(-50%,-50%) scale(.92);opacity:.72}
  50%    {transform:translate(-50%,-50%) scale(1.10);opacity:1}}

#stCore{position:absolute;left:49.8%;top:54.5%;width:58%;
  transform:translate(-50%,-50%);pointer-events:none;opacity:0;
  filter:drop-shadow(0 2px 10px rgba(40,20,60,.55))
         drop-shadow(0 0 22px rgba(255,214,120,.65));
  transition:opacity 1s ease}
#stCore.on{opacity:1;animation:coreBreathe 4.6s ease-in-out infinite}
@keyframes coreBreathe{
  0%,100%{transform:translate(-50%,-50%) scale(.97);
    filter:drop-shadow(0 2px 10px rgba(40,20,60,.55)) drop-shadow(0 0 16px rgba(255,214,120,.5))}
  50%    {transform:translate(-50%,-50%) scale(1.04);
    filter:drop-shadow(0 2px 12px rgba(40,20,60,.5)) drop-shadow(0 0 34px rgba(255,232,168,.9))}}
@media (prefers-reduced-motion: reduce){ #stCore.on{animation:none} }

/* ---- SAHNE KARTI: seviye biter bitmez cikan gunluk sayfasi ----
   Perde degil, tek nefeslik bir an. Alttan suzulur, gorsel zemin
   arc'a gore degisir, metin daktilo gibi belirir. */
/* ================= HIKAYE ANI — TAM SAYFA =================
   Kullanici: "anlarida boyle bildiri gibi degil de tam sayfa mi yapsak,
   gorselleri biraz daha fazlalastirsak... hikayeyi gelecekte insanlar
   OKUMAK ICIN BILE OLSA bu oyunu indirmek istesinler".

   Eskiden ortada 360px'lik bir kart vardi: bildirim gibi duruyordu,
   gorsel 190px'e sikismisti. Artik an TUM EKRANI kapliyor: gorsel
   arkada yavas yavas yakinlasiyor (Ken Burns), metin altta duruyor.
   Ayni motor, ayni veri - ama artik bir "an" degil, bir SAHNE. */
#scene{position:absolute;inset:0;z-index:150;display:none;
  align-items:stretch;justify-content:center;padding:0;
  background:#07040f}
#scene.on{display:flex;animation:scFade .5s ease}
@keyframes scFade{from{opacity:0}to{opacity:1}}
#sceneCard{width:100%;max-width:none;border-radius:0;overflow:hidden;
  border:0;position:relative;display:flex;flex-direction:column;
  box-shadow:none;animation:none}
/* RUH ANI: kart secilen ruhun rengini alir - bu an sana ozel demektir */
#sceneCard.spiritMoment{border-color:var(--spc);
  box-shadow:0 20px 60px rgba(0,0,0,.7), 0 0 26px -4px var(--spc)}
#sceneCard.spiritMoment #sceneBody{
  background:linear-gradient(180deg,#1c1540,#120d28),
             radial-gradient(ellipse 70% 60% at 50% 0%,var(--spc),transparent 70%);
  background-blend-mode:normal,screen}
.scSpirit{color:var(--spc);font-weight:800;letter-spacing:1.2px;
  text-shadow:0 0 12px var(--spc)}
@keyframes scRise{from{transform:translateY(26px) scale(.97);opacity:0}
  to{transform:none;opacity:1}}
/* Gorsel: ekranin ust 3/5'i, yavas yakinlasma ile canli durur */
#sceneImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  display:block;object-position:center 38%;
  animation:scKen 16s ease-out forwards;opacity:0;transition:opacity .8s}
#sceneImg.in{opacity:1}
@keyframes scKen{from{transform:scale(1.02)}to{transform:scale(1.16)}}
/* Metnin okunmasi icin alttan yukselen perde */
#sceneCard::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,4,15,.62) 0%,rgba(7,4,15,.12) 26%,
    rgba(7,4,15,.30) 48%,rgba(7,4,15,.88) 72%,rgba(7,4,15,.98) 100%)}
/* KAHRAMAN: sahnenin icinde, metnin hemen ustunde durur.
   Silueti korunsun diye alttan golge, ustten hafif isik alir.
   Yavas yukselerek girer - "yolda yuruyor" hissi. */
#sceneHeroWrap{position:absolute;left:50%;bottom:var(--heroB,26%);
  transform:translateX(-50%);height:var(--heroH,34%);z-index:2;
  pointer-events:none}
#sceneHeroWrap .heroAmulet,#sceneHeroWrap .btTile{position:absolute}
#sceneHero{display:block;height:100%;width:auto;
  pointer-events:none;opacity:0;
  filter:drop-shadow(0 14px 22px rgba(0,0,0,.75))
         drop-shadow(0 0 26px rgba(255,207,92,.22));
  animation:heroFade .9s ease .35s both}
#sceneHeroWrap{animation:heroIn 1.1s cubic-bezier(.2,.9,.3,1) .35s both,
            heroFloat 6s ease-in-out 1.4s infinite}
@keyframes heroFade{from{opacity:0}to{opacity:1}}
@keyframes heroIn{
  from{opacity:0;transform:translateX(-50%) translateY(26px) scale(.96)}
  to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes heroFloat{0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(-7px)}}
/* Kahramanin bastigi zemin: yumusak isik lekesi */
#sceneHero.on{opacity:1}
#sceneCard::before{content:"";position:absolute;left:50%;
  bottom:calc(var(--heroB,26%) - 8px);transform:translateX(-50%);
  width:46%;height:26px;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 50% 50% at 50% 50%,
    rgba(255,207,92,.20),transparent 70%);filter:blur(4px)}
/* ==================================================================
   KOLYE + BT TASI KATMANI  (SVG, sifir dosya)
   ------------------------------------------------------------------
   Kullanici: "kahramanin gorsellerindeki element taslari ve benim
   kendi BT yazan tasimi STONEBREAKING'in eline ver, kolyemizin
   detayi element taslarindan olussun, renk karismasin".

   NEDEN SVG: uretilen gorsellerde kolye renkleri her rutbede farkli
   cikiyordu (mor/turuncu karisimi). Ustune SVG katman koyunca:
     - Dort renk ANAYASAYA birebir uyar (kirmizi/mavi/yesil/beyaz)
     - On rutbede de AYNI gorunur (tutarlilik)
     - Sifir bayt, sifir yukleme maliyeti
   Konum yuzdeyle verilir; kahraman goruntusu olceklense de yerinde kalir.
   ================================================================== */
.heroAmulet{position:absolute;left:50%;top:var(--amY,47%);
  transform:translate(-50%,-50%);width:var(--amW,26%);
  pointer-events:none;z-index:3;
  filter:drop-shadow(0 2px 7px rgba(0,0,0,.65))}
/* BT tasi: kahramanin yaninda SUZULEN cagrilmis guc.
   Ele yapistirmak yerine yuzduruyoruz - hem tum rutbelerde ayni
   yerde durur hem "bu bir esya degil, bir enerji" der. */
.btTile{position:absolute;left:var(--btX,6%);top:var(--btY,22%);
  transform:translate(-50%,-50%) rotate(-8deg);width:var(--btW,22%);
  pointer-events:none;z-index:3;
  animation:btFloat 4.2s ease-in-out infinite,
            btPulse 3.4s ease-in-out infinite}
@keyframes btFloat{
  0%,100%{transform:translate(-50%,-50%) rotate(-8deg) translateY(0)}
  50%    {transform:translate(-50%,-50%) rotate(-5deg) translateY(-9px)}}
@keyframes btPulse{
  0%,100%{filter:drop-shadow(0 0 12px rgba(255,207,92,.55))
    drop-shadow(0 4px 10px rgba(0,0,0,.55))}
  50%{filter:drop-shadow(0 0 26px rgba(255,207,92,.95))
    drop-shadow(0 4px 10px rgba(0,0,0,.55))}}
@media (prefers-reduced-motion: reduce){ .btTile{animation:none} }

/* KONUSAN KORUYUCU: ruh ani oldugunda kahramanin yaninda suzulur.
   Boylece "Dem fisildadi" derken Dem GORUNUYOR - metin degil sahne anlatiyor. */
#sceneSpirit{position:absolute;right:9%;bottom:calc(var(--heroB,26%) + 9%);
  width:23%;max-width:120px;z-index:3;border-radius:50%;
  pointer-events:none;opacity:0;display:none;
  border:2px solid var(--spc,#ffcf5c);
  box-shadow:0 0 30px -4px var(--spc,#ffcf5c), 0 10px 26px rgba(0,0,0,.6);
  animation:spIn 1s cubic-bezier(.2,.9,.3,1) .75s both,
            spFloat 5s ease-in-out 1.8s infinite}
#sceneSpirit.on{display:block}
@keyframes spIn{from{opacity:0;transform:translateX(22px) scale(.7)}
  to{opacity:1;transform:none}}
@keyframes spFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@media (prefers-reduced-motion: reduce){ #sceneSpirit{animation:none;opacity:1} }

/* Marka imzasi: sag ustte, sessiz ama her karede var */
#sceneBrand{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));
  right:16px;z-index:3;pointer-events:none;
  font-size:9.5px;letter-spacing:3.4px;font-weight:800;
  color:rgba(255,255,255,.42);text-shadow:0 2px 10px rgba(0,0,0,.9)}
@media (prefers-reduced-motion: reduce){
  #sceneHero{animation:none;opacity:1} #sceneHeroWrap{animation:none} }

#sceneBody{position:relative;z-index:2;margin-top:auto;
  padding:18px 22px calc(20px + env(safe-area-inset-bottom,0px));
  text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:2px}

#sceneArc{font-size:12.5px;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);opacity:.9;font-weight:700;
  text-shadow:0 2px 12px #000}
#sceneLv{font-size:11.5px;opacity:.55;margin-top:2px;letter-spacing:1px}
/* Tam sayfada metin nefes alsin: daha buyuk, daha genis satir araligi.
   max-width okunabilirlik icin: 50-60 karakterlik satir en rahat okunan. */
#sceneTxt{font-size:17.5px;line-height:1.72;margin:12px 0 6px;min-height:58px;
  font-style:italic;color:#f6f3ff;max-width:430px;
  text-shadow:0 2px 14px rgba(0,0,0,.9)}
#sceneCount{font-size:11.5px;opacity:.6;margin-bottom:14px;letter-spacing:.6px}
#sceneNext{max-width:340px}

#stBurst{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0}
#stBurst.go{animation:stburst 1.05s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes stburst{
  0%{opacity:1;background:radial-gradient(circle at 50% 45%,rgba(255,231,168,.95) 0%,
     rgba(255,207,92,.55) 18%,rgba(255,207,92,0) 42%)}
  100%{opacity:0;background:radial-gradient(circle at 50% 45%,rgba(255,231,168,0) 0%,
     rgba(255,207,92,0) 100%)}}
/* Yeni perde rozeti */
#stBadge{position:absolute;top:7%;left:50%;transform:translateX(-50%);
  z-index:6;pointer-events:none;opacity:0;
  padding:9px 20px;border-radius:99px;font-size:12.5px;font-weight:800;
  letter-spacing:2.5px;text-transform:uppercase;color:#2a1c05;
  background:linear-gradient(180deg,#ffe9a8,#f0a93c);
  box-shadow:0 6px 26px rgba(255,207,92,.6)}
#stBadge.go{animation:stbadge 2.4s ease forwards}
@keyframes stbadge{
  0%{opacity:0;transform:translateX(-50%) scale(.6)}
  14%{opacity:1;transform:translateX(-50%) scale(1.08)}
  22%{transform:translateX(-50%) scale(1)}
  78%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-12px)}}
/* Sonuc ekraninda "hikaye kilidi" kartı — bir sonraki bolume kanca */
.storyTease{border:1px solid rgba(255,207,92,.45)!important;
  background:linear-gradient(135deg,rgba(255,207,92,.14),rgba(120,80,200,.14))!important;
  position:relative;overflow:hidden}
.storyTease .stLock{font-size:26px;margin-bottom:2px}
.storyTease .stBar{height:6px;background:rgba(0,0,0,.4);border-radius:99px;
  overflow:hidden;margin-top:8px}
.storyTease .stBar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--gold),#ffe9a8);transition:width .8s cubic-bezier(.2,.8,.3,1)}
.storyTease.ready{animation:teasepulse 1.3s ease-in-out infinite}
@keyframes teasepulse{0%,100%{box-shadow:0 0 0 rgba(255,207,92,0)}
  50%{box-shadow:0 0 22px rgba(255,207,92,.45)}}

/* ---- Sampiyon seridi + siralama + toast ---- */
#champBar{display:flex;align-items:center;gap:7px;cursor:pointer;
  padding:8px 14px;margin:2px 0 12px;border-radius:99px;max-width:320px;
  background:linear-gradient(90deg,rgba(255,207,92,.18),rgba(120,80,200,.16));
  border:1px solid rgba(255,207,92,.45);font-size:13px;
  box-shadow:0 2px 14px rgba(0,0,0,.35)}
#champBar:empty{display:none}
#champBar:active{transform:scale(.97)}
#champBar .crown{font-size:15px}
#champBar b{color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
#champBar .cLv{opacity:.8;font-size:11.5px}
#champBar .cMore{margin-left:auto;opacity:.7;font-size:11px;white-space:nowrap}
.lbList{max-height:46vh;overflow-y:auto;margin-top:4px}
.lbRow{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:13px;
  margin-bottom:5px;background:rgba(255,255,255,.05);text-align:left}
.lbRow.me{background:rgba(255,207,92,.16);border:1px solid rgba(255,207,92,.4)}
.lbPos{width:26px;text-align:center;font-size:16px;flex:0 0 auto}
.lbPos .rk{font-size:13px;opacity:.65;font-weight:700}
.lbAv{width:34px;height:34px;border-radius:10px;object-fit:cover;flex:0 0 auto}
.lbInfo{flex:1;min-width:0}
.lbNm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbSt{font-size:11px;opacity:.72}
.lbRank{font-size:10.5px;opacity:.6;flex:0 0 auto;text-align:right;max-width:74px}
/* Kalici geri tusu: hangi ekranda oldugumuza gore dogru yere doner.
   Oyun icinde onay ister (ilerleme kaybi endisesi), digerlerinde direkt doner. */
#backBtn{position:absolute;top:10px;left:10px;z-index:75;display:none;
  width:38px;height:38px;border-radius:50%;font-size:20px;line-height:1;
  background:rgba(20,14,40,.82);color:#fff;border:1px solid rgba(255,255,255,.18);
  cursor:pointer;padding:0;box-shadow:0 2px 10px rgba(0,0,0,.4)}
#backBtn.on{display:block}
#backBtn:active{transform:scale(.9);background:rgba(255,207,92,.28)}
/* Oyun ekraninda sol ustte ses/profil var: geri tusu onlarin soluna gecemez,
   o yuzden oyunda gizli - orada zaten "Menu" dugmesi var. */

.btRow{display:inline-flex;gap:5px;align-items:center;vertical-align:middle}
.btIcon{display:block;height:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.btIcon.off{opacity:.7}
.btBtn{display:inline-flex;align-items:center;gap:4px;cursor:pointer;
  text-decoration:none;vertical-align:middle}

/* ---- Ruh bagirma efekti ----
   Balon ruhun rengiyle parliyor ve bir kez zipliyor. Oyun "sessiz
   ipucu panosu" olmaktan cikip tepki veren bir alana donuyor. */
#say.shout{animation:shoutPop .5s cubic-bezier(.2,1.6,.4,1);
  border-color:var(--shoutHue,#ffcf5c) !important;
  box-shadow:0 0 20px color-mix(in srgb, var(--shoutHue,#ffcf5c) 55%, transparent),
             inset 0 0 14px color-mix(in srgb, var(--shoutHue,#ffcf5c) 18%, transparent)}
@keyframes shoutPop{0%{transform:scale(.94)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
#say.shout #sayImg{animation:shoutAv .5s ease}
@keyframes shoutAv{0%{transform:scale(.8) rotate(-8deg)}60%{transform:scale(1.18) rotate(6deg)}100%{transform:scale(1)}}
/* Zaman donma: sayac buz mavisi nabiz + ekranda kisa buz parlamasi */
#hTime.frozen{animation:froze 1.1s ease-in-out 3}
@keyframes froze{0%,100%{text-shadow:0 0 0 rgba(159,232,255,0)}
  50%{text-shadow:0 0 14px rgba(159,232,255,.95)}}
.freezeFlash::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:65;
  background:radial-gradient(circle at 50% 22%,rgba(159,232,255,.30),rgba(159,232,255,0) 62%);
  animation:freezeFade .9s ease-out forwards}
@keyframes freezeFade{from{opacity:1}to{opacity:0}}

#toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%) translateY(12px);
  background:rgba(20,14,40,.96);border:1px solid rgba(255,207,92,.4);color:#fff;
  padding:10px 18px;border-radius:99px;font-size:13px;z-index:200;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:86%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

#fxCanvas{position:absolute;inset:0;pointer-events:none;z-index:80;display:block}
#shatterCv{position:absolute;inset:0;pointer-events:none;z-index:90;display:none}
#shatterCv.on{display:block}
#fx{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.pop{position:absolute;font-weight:900;font-size:18px;color:var(--gold);
  text-shadow:0 2px 6px #000;animation:pop .8s ease-out forwards}
@keyframes pop{0%{opacity:1;transform:translateY(0) scale(.7)}
  100%{opacity:0;transform:translateY(-54px) scale(1.2)}}
#say{display:flex;align-items:center;gap:8px;padding:5px 9px;margin:0 10px 4px;
  background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;font-size:11.5px;min-height:36px;flex:0 0 auto}
#say img{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:#0004}

#stChapter{letter-spacing:2.6px;font-size:11px;font-weight:900;opacity:.85;text-transform:uppercase;
  color:var(--gold);background:rgba(0,0,0,.55);padding:4px 10px;border-radius:999px;
  border:1px solid rgba(255,207,92,.28);display:inline-block;margin-bottom:8px;
  box-shadow:0 2px 10px rgba(0,0,0,.5)}
#stChapter::before{content:"◈ ";color:var(--gold)}
#stTitle{position:relative}
#stTitle::after{content:"";display:block;height:2px;width:48px;
  background:linear-gradient(90deg,var(--gold),transparent);margin-top:8px;border-radius:999px}
#stText{line-height:1.6;font-size:15.5px}
#stText .ln{border-left:2px solid rgba(255,207,92,.18);padding-left:12px;margin-left:2px}
#stText .ln + .ln{margin-top:12px}
#s-story .comicProgress{
  position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);z-index:9;
  display:flex;gap:6px;padding:6px 12px;border-radius:999px;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px)
}
.comicDot{
  width:22px;height:6px;border-radius:999px;background:rgba(255,255,255,.22);
  transition:.25s;
}
.comicDot.on{
  background:var(--gold);width:28px;box-shadow:0 0 10px rgba(255,207,92,.6)
}
.comicPage{
  position:absolute;top:12px;right:12px;z-index:9;
  font-family:'STONEBREAKING',system-ui,sans-serif;
  font-size:12px;letter-spacing:1.5px;color:rgba(255,255,255,.6);
  background:rgba(0,0,0,.4);padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.1)
}

<script>
"use strict";
/* ==================================================================
   STONEBREAKING — Tepsili Eşleştirme (Tile Match)
   Mekanik: taşa dokun -> tepsiye gider, aynılar yan yana dizilir,
   3 aynı yan yana gelince patlar. Tepsi dolarsa kaybedersin.
   Sağı-solu kapalı / üstü örtülü taşlar alınamaz.
   ================================================================== */

/* ---------- i18n ---------- */
/* ==================================================================
   HIKAYE — "Taskiran Gunlugu" (D5) + Acilis sinematigi (C1 cekirdegi)

function arcOf(lv){ return ARCS.find(a=>lv<=a.to)||ARCS[ARCS.length-1]; }
/* Arc icinde seviyeye gore gorsel sec — mevcut olmayanlari atla */
function arcBg(arc, lv){
  const list=(arc.bg||[]).filter(x=>!MISSING_BG.has(x));
  if(!list.length) return "s_yol";
  return list[lv % list.length];
}

34:{tr:"Su akmaya başladı. Yavaş, ama başladı.",en:"The water began to flow. Slowly, but it began."},
35:{tr:"İkinci sembol doldu. Kolye ağırlaşıyor.",en:"The second symbol is full. The amulet grows heavy."},
36:{tr:"Dem: \"Mantık, aceleye düşman değildir. Aceleciliğe düşmandır.\"",en:"Dem: \"Logic is not the enemy of speed. Only of haste.\""},
37:{tr:"Öğrenci değilim artık. Bükücü diyorlar.",en:"No longer a student. They call me Bender."},
38:{tr:"Taşların üstündeki yazıları okumaya başladım.",en:"I have begun to read the writing on the stones."},
39:{tr:"Önümde bir kütüphane. Ama sayfalar boş.",en:"A library ahead. But the pages are blank."},
41:{tr:"Kaya yaprakları solmuş halde oturuyordu. Beni hatırlamadı.",en:"Kaya sat with wilted leaves. She did not remember me."},
42:{tr:"Hafızanın ruhu hafızasını kaybediyor. Bu bir şaka olmalı.",en:"The spirit of memory is losing her memory. This must be a joke."},
43:{tr:"Kırdığım her taş bir levhaya yazı döküyor.",en:"Every stone I break spills words onto a tablet."},
44:{tr:"Kaya başını kaldırdı: \"Sen hatırladıkça ben de hatırlıyorum.\"",en:"Kaya looked up: \"When you remember, I remember too.\""},
45:{tr:"Kendi adımı unutmaktan korkuyorum.",en:"I am afraid of forgetting my own name."},
46:{tr:"Bugün eski bir taşı tanıdım. Aylar önce görmüştüm.",en:"Today I recognised an old stone. I had seen it months ago."},
47:{tr:"Üçüncü sembol doldu. Bir tane kaldı.",en:"The third symbol is full. One remains."},
48:{tr:"Kütüphane arkamda. Sayfalar artık dolu.",en:"The library is behind me. The pages are full now."},
49:{tr:"Rüzgâr çıktı. Hiç dinmeyen türden.",en:"A wind rose. The kind that never stops."},
51:{tr:"Yel fırtınasının ortasında dönüyordu. Çıkamıyordu.",en:"Yel spun at the heart of her storm. She could not escape."},
52:{tr:"\"Örüntüsünü kaybeden rüzgâr,\" dedi, \"sadece gürültüdür.\"",en:"\"Wind that has lost its pattern,\" she said, \"is only noise.\""},
53:{tr:"Fırtınayı durdurmaya çalışmadım. İçindeki düzeni aradım.",en:"I did not try to stop the storm. I looked for the order inside."},
54:{tr:"Buldum. Kaosun bir ritmi varmış.",en:"I found it. Chaos has a rhythm."},
55:{tr:"Dördüncü sembol doldu. Kolye tamam.",en:"The fourth symbol is full. The amulet is complete."},
56:{tr:"Dört ruh da yanımda. Ama çember hâlâ kapanmıyor.",en:"All four spirits are with me. Yet the circle still won't close."},
57:{tr:"Bir eksik var. Kimse söylemiyor.",en:"Something is missing. No one will say what."},
58:{tr:"Arafta kendi yankımı duydum. Ama ben konuşmamıştım.",en:"I heard my own echo in the void. But I had not spoken."},
59:{tr:"Önümde bir ayna. Cam değil — karanlık.",en:"A mirror ahead. Not glass — darkness."},
61:{tr:"Aynadaki ben, benden daha emin görünüyordu.",en:"The me in the mirror looked more certain than I."},
62:{tr:"\"Ben senin en güçlü yanınım,\" dedi. Haklıydı.",en:"\"I am your strongest side,\" it said. It was right."},
63:{tr:"Tek elementle vurdum. Gölge güldü.",en:"I struck with one element. The shadow laughed."},
64:{tr:"İki elementle vurdum. Gölge esnedi.",en:"I struck with two. The shadow yawned."},
65:{tr:"Gölgenin bildiği tek şey: haklı olduğum anlar.",en:"The only thing the shadow knows: the moments I was right."},
66:{tr:"Usta diyorlar bana. Gölge de öyle diyor. Alay ediyor.",en:"They call me Master. The shadow says it too. Mockingly."},
67:{tr:"Dördünü aynı anda kullanmayı denemedim hiç.",en:"I never tried using all four at once."},
68:{tr:"Bu gece deneyeceğim.",en:"Tonight I will try."},
69:{tr:"Kolyedeki dört sembol aynı anda parladı.",en:"The four symbols flared at once."},
71:{tr:"Gölge dağıldı. Yok olmadı — dağıldı. Fark var.",en:"The shadow scattered. Not destroyed — scattered. There's a difference."},
72:{tr:"Dört ruh etrafımda dönüyor. Çember neredeyse tam.",en:"Four spirits orbit me. The circle is nearly whole."},
73:{tr:"Kaya: \"Çember kırılmadı. Taşınacak birini bekliyordu.\"",en:"Kaya: \"The circle was never broken. It waited for someone to carry it.\""},
74:{tr:"Ağırlık omuzlarımda. Ama tanıdık bir ağırlık.",en:"The weight is on my shoulders. But a familiar weight."},
75:{tr:"Bugün hiç ipucu kullanmadım. Fark ettim, gülümsedim.",en:"I used no hints today. I noticed, and smiled."},
76:{tr:"Uzakta devasa bir gölge. Heykel mi?",en:"A vast shadow in the distance. A statue?"},
77:{tr:"Yaklaştıkça büyüyor. Ve tanıdık geliyor.",en:"It grows as I approach. And it feels familiar."},
78:{tr:"Kukuletalı. Yaşlı. Taştan.",en:"Hooded. Aged. Made of stone."},
79:{tr:"Göğsündeki kolye kırık. Boş.",en:"The amulet on its chest is broken. Empty."},
80:{tr:"Bu benden önce buraya gelen biri.",en:"Someone came here before me."},
81:{tr:"Çatlaklarından hâlâ altın ışık sızıyor. Hâlâ yaşıyor.",en:"Golden light still leaks from its cracks. It still lives."},
82:{tr:"\"Bir seçim yaptım,\" dedi taş. Sesi kendi sesimdi.",en:"\"I made a choice,\" said the stone. Its voice was mine."},
83:{tr:"En güçlü olanı seçmiş. Diğer üçünü bırakmış.",en:"He chose the strongest. He let the other three go."},
84:{tr:"Ve taş kesilmiş. Yalnız, tavanda, sonsuza kadar.",en:"And turned to stone. Alone, at the summit, forever."},
86:{tr:"Büyük Usta diyorlar. İlk Taşkıran'a da öyle demişlerdir.",en:"They call me Grandmaster. They must have called the First that too."},
87:{tr:"Her gün dört elementi de kullanıyorum. Alışkanlık değil — yemin.",en:"Every day I use all four. Not a habit — a vow."},
88:{tr:"Çekirdek yaklaşıyor. Ya da ben ona.",en:"The core draws near. Or I to it."},
89:{tr:"Kor sordu: \"Korkuyor musun?\" \"Evet,\" dedim. Güldü.",en:"Kor asked: \"Are you afraid?\" \"Yes,\" I said. It laughed."},
90:{tr:"Doksan sunak. Doksan bin taş. Bir tek çember.",en:"Ninety altars. Ninety thousand stones. One single circle."},
91:{tr:"Dem: \"Buraya kadar geldin. Şimdi asıl sınav.\"",en:"Dem: \"You came this far. Now the real test.\""},
92:{tr:"Dengeyi korumak, kazanmaktan daha zor.",en:"Keeping balance is harder than winning."},
93:{tr:"Bir alanda güçlenirken diğerini ihmal ettim. Fark ettim, döndüm.",en:"I grew in one branch and neglected another. I noticed, and turned back."},
94:{tr:"İlk Taşkıran'ın hatası buymuş. Şimdi anlıyorum.",en:"This was the First's mistake. Now I understand."},
95:{tr:"Çekirdeğin ışığı ufukta. Altın, sıcak, sakin.",en:"The core's light on the horizon. Golden, warm, calm."},
96:{tr:"Yel önden uçtu. Yol açıyor.",en:"Yel flew ahead. Clearing the way."},
97:{tr:"Kaya son levhayı verdi: \"Bunu sen yazacaksın.\"",en:"Kaya handed me the last tablet: \"You will write this one.\""},
98:{tr:"Son sunak. Elim titriyor.",en:"The final altar. My hand trembles."},
99:{tr:"Bir taş kaldı. Sadece bir tane.",en:"One stone remains. Only one."},

   yani secim sahteydi.

     - Oyuncu "benim yolculugum farkliydi" der  -> tekrar oynanabilirlik

/* Secili ruhun bu seviyede sozu var mi? */
function spiritLineAt(lv){
  const sp=S&&S.spirit; if(!sp) return null;
  const path=SPIRIT_PATH[sp]; if(!path) return null;
  const e=path[lv]; if(!e) return null;
  return e[L]||e.tr;
}

function sceneAt(lv){
  const sc=SCENES[lv]; if(!sc) return null;
  const arc=arcOf(lv);
  /* Ruh sozu varsa sahneyi O konusur: ayni seviye, farkli ruh,
     farkli metin. Oyuncu "benim yolculugum baskaydi" der. */
  const own=spiritLineAt(lv);
  return {lv, arc, txt: own || (sc[L]||sc.tr), bg:arcBg(arc,lv),
          spirit: own ? (SPIRITS[S.spirit]||null) : null};
}
function seenScenes(){ S.scenes=S.scenes||[]; return S.scenes; }
function markScene(lv){ const a=seenScenes(); if(!a.includes(lv)){ a.push(lv); save(); } }
/* Kac hikaye ani acildi?
   Marka sozu: "100 seviye = 100 an". Sv1 HEM perde (acilis) HEM sahne
   (ilk zafer) tasiyor, o yuzden ham toplam 101 cikiyordu. Anlar SEVIYE
   bazinda tekillestiriliyor: her seviye tam olarak bir an sayilir. */
function storyProgress(){
  const lv=new Set();
  STORY.forEach(a=>{ if(S.level>=a.at) lv.add(a.at); });
  Object.keys(SCENES).forEach(k=>{ if(S.level>=+k) lv.add(+k); });
  const all=new Set([...STORY.map(a=>a.at), ...Object.keys(SCENES).map(Number)]);
  return {open:lv.size, total:all.size};
}

const STORY_STEP=10;
function actAt(lv){ return STORY.find(a=>a.at===lv); }
const ACT_LEVELS=STORY.map(a=>a.at).sort((a,b)=>a-b);
/* Bir sonraki perdenin seviyesi (kanca metni icin) */
function nextActLevel(lv){
  const nxt=ACT_LEVELS.find(x=>x>lv);
  return nxt || MAX_LEVEL;
}
/* Onceki perdenin seviyesi — ilerleme cubugu dogru dolsun diye */
function prevActLevel(lv){
  const prev=ACT_LEVELS.filter(x=>x<=lv).pop();
  return prev || 1;
}

function pickWisdom(spId){
  const arr=WISDOM[spId]||WISDOM.fire;
  S.wSeen=S.wSeen||[];
  const key=k=>spId+":"+k;
  let pool=arr.map((_,i)=>i).filter(i=>!S.wSeen.includes(key(i)));
  if(!pool.length){ S.wSeen=S.wSeen.filter(x=>!x.startsWith(spId+":")); pool=arr.map((_,i)=>i); }
  const i=pool[Math.floor(Math.random()*pool.length)];
  S.wSeen.push(key(i));
  if(S.wSeen.length>28) S.wSeen=S.wSeen.slice(-28);
  return arr[i];
}

  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c.d}"/>

    <path d="M${x-r*0.66} ${y-r*0.42}a${r*0.8} ${r*0.8} 0 0 1 ${r*1.32} 0"

}

function svgDot(n){
  const c=INK.water, pts=STARS[n];
  const r = n<=2?19 : n<=4?15.5 : n<=6?13 : 10.5;
  let g="";
  // Takimyildiz cizgileri: sayma zorlasmasin diye cok soluk
  if(n>=3 && n<=8){
    const loop = (n===7) ? pts : pts.concat([pts[0]]);
    g += `<polyline points="${P(loop)}" fill="none" stroke="${c.d}"
      stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity=".45"/>`;
  }
  if(n===9){

      stroke="${c.d}" stroke-width="3.4" fill="none" opacity=".38"/>`;

  pts.forEach(p=> g += carvedDisc(p[0],p[1],r,c));
  return g;
}
